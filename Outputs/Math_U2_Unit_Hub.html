fore Activity 2 (IM student responses). Colour coding matches each partial product to its part of the diagram.\nTIMING: 1–2 min.\nCLICK-BY-CLICK:\n  Click 1: partial products for 3 × 135.\n  Click 2: sum 405.\n  Click 3: Lin's diagram completed (2,000 label and all parts).\n  Click 4: sum 6,405.\nANTICIPATED RESPONSES:\n  • IM: (3 × 100) + (3 × 30) + (3 × 5) = 300 + 90 + 15 = 405.\n  • IM: 6,000 + 300 + 90 + 15 = 6,405.\nMISCONCEPTIONS TO WATCH FOR:\n  • Students who wrote 3 × 2,135 = 645 (forgot the 2,000 part).\nFORMATIVE ASSESSMENT: Hands up if your partial products matched. Note students who missed the 2,000 part — that is the Day 5 conferring focus.\nCALLOUTS:\n  • Rosenshine Principle 6: Check for student understanding.\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s012.jpg", "title": "Activity 2", "notes": "PURPOSE: Launch Activity 2. Students analyze a common error: work that does not apply place value understanding and so gives an unreasonable product. When they find Jada's errors and explain their reasoning, they critique the reasoning of others (MP3).\nTIMING: About 1 min of Activity 2's 20.\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Groups of 2.\n  “Take a few quiet minutes to analyze Jada’s errors. Then share your thinking with your partner.” (Say after the GDD slide.)\nMISCONCEPTIONS TO WATCH FOR:\n  • Students who agree with Jada because 3 × 6 = 18 is a correct fact.\nDIFFERENTIATION / EXTENSION:\n  • UDL Representation (IM): Use base-ten blocks to demonstrate Jada’s error and how her work should be corrected. Invite students to discuss how they might avoid such an error (for example, by estimating the product first, or by visualizing the value in base-ten blocks).\nCALLOUTS:\n  • MP3: Construct viable arguments and critique the reasoning of others.\n  • UDL — Representation: Access for Perception. Supports accessibility for: Conceptual Processing, Visual-Spatial Processing.\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s013.jpg", "title": "Activity 2", "notes": "PURPOSE: Get Ready · Do · Done send-off for Activity 2 (Ward & Jacobsen, GDD pp. 74–79).\nTIMING: 1 min. Step times from IM: 2 min independent on Jada’s diagram, 2 min partner discussion, pause for a class discussion, then 5 min independent on the last two problems. The class pause sits at the 4-minute mark, which is the halfway point of the 9 minutes of student work.\nCLICK-BY-CLICK:\n  Click 1: Done mat.\n  Click 2: Do mat.\n  Click 3: Get Ready mat.\nTEACHER SAYS:\n  Teacher says (drafted for this deck; the Day 5 lesson plan has no GDD script): “Future glasses on. When you're done, your page explains what Jada did wrong, gives the right value for 3 × 6,489, and solves 5 × 699 and 8 × 4,973. Steps: 2 minutes on Jada by yourself, 2 minutes with your partner, then we stop and check together, then 5 minutes on the last two problems. Get Ready: task page and pencil, next to your partner.”\n  Future-glasses prompt: “Picture 8 × 4,973 when you're done. How many partial products will you have?”\n  If-then obstacle prompt: “If a partial product looks too small, then ask: what is this digit really worth?”\n  Set the timer for the halfway point: 4 minutes. At the beep, everyone pauses for the class discussion.\nFORMATIVE ASSESSMENT: At the 4-minute pause, listen for students who already named the place-value error.\nCALLOUTS:\n  • EF: GDD send-off (Ward & Jacobsen, GDD p. 75, Figure 1; halfway timer p. 79).\n  • Materials and space lines are inferred (the lesson plan lists none)."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s014.jpg", "title": "Activity 2", "notes": "PURPOSE: Activity 2, Problem 1: analyze Jada’s errors.\nTIMING: 2 min independent, then 2 min partner discussion (IM).\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nANTICIPATED RESPONSES:\n  • a. Sample (IM): Jada forgot to include the place values (1,000, 100, and 10) when multiplying each part. She only multiplied the non-zero digits.\n  • b. 19,467 (IM).\nMISCONCEPTIONS TO WATCH FOR:\n  • Fixing only the first part (18 → 18,000) and leaving the others.\nFORMATIVE ASSESSMENT: Problem-solving conferring (sequence card, Day 5): Are students tracking every place-value part, or losing one when the diagram gets bigger?\nCALLOUTS:\n  • MP3.\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s015.jpg", "title": "Activity 2", "notes": "PURPOSE: Pause for a discussion, then display and correct Jada’s diagram as a class. The wrong partial products (orange tint) disappear one at a time and the correct ones (blue) take their place.\nTIMING: About 3 min (class pause in the middle of Activity 2).\nCLICK-BY-CLICK:\n  Click 1: Question 1.\n  Click 2: Question 2.\n  Click 3: 18 disappears → 18,000.\n  Click 4: 12 disappears → 1,200.\n  Click 5: 24 disappears → 240.\n  Click 6: 18,000 + 1,200 + 240 + 27 = 19,467.\nTEACHER SAYS:\n  Pause for a discussion.\n  “What did Jada do correctly?”\n  “What did Jada miss?”\n  Display and correct Jada’s diagram as a class.\n  “Now complete the remaining problems independently.”\nANTICIPATED RESPONSES:\n  • Correct (IM): She multiplied the non-zero digits correctly. She decomposed the 6,489 by place value, which is helpful.\n  • Missed (IM): She multiplied only the non-zero digits. She didn’t account for the place value of the digits being multiplied. For example: The partial product of 3 × 6,000 is 18,000, not 18.\nMISCONCEPTIONS TO WATCH FOR:\n  • Students who now add zeros by habit (“just add three zeros”) without reasoning. Ask: 3 × 6 thousands is how many thousands?\nDIFFERENTIATION / EXTENSION:\n  • Support: build 3 × 400 with hundreds flats if blocks are on hand (IM UDL suggestion).\nFORMATIVE ASSESSMENT: Ask for an estimate: is 19,467 reasonable for 3 × about 6,500? (Sample: 3 × 6,500 = 19,500.)\nCALLOUTS:\n  • Disappear is used here only to remove the wrong values so attention goes to the corrected ones.\n  • MP3.\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s016.jpg", "title": "Activity 2", "notes": "PURPOSE: Activity 2, Problems 2–3 (independent).\nTIMING: 5 min independent work (IM).\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  “Now complete the remaining problems independently.”\n  Monitor for students who: draw diagrams that partition the multi-digit factor by place value; write expressions that show the multi-digit factor decomposed by place value.\nANTICIPATED RESPONSES:\n  • 2. 3,495. Sample (IM): 5 × 699 = (5 × 600) + (5 × 90) + (5 × 9) = 3,000 + 450 + 45 = 3,495.\n  • 3. 39,784. Sample (IM): 8 × 4,973 = (8 × 4,000) + (8 × 900) + (8 × 70) + (8 × 3) = 32,000 + 7,200 + 560 + 24 = 39,784.\nMISCONCEPTIONS TO WATCH FOR:\n  • 8 × 900 = 720 or 72,000.\n  • Adding the four partial products with misaligned places.\nDIFFERENTIATION / EXTENSION:\n  • Extension: estimate first, then compare the estimate with the product.\n  • Support: four-part rectangle template for Problem 3.\nFORMATIVE ASSESSMENT: Problem-solving conferring (sequence card, Day 5): Are students tracking every place-value part, or losing one when the diagram gets bigger?\nCALLOUTS:\n  • Rosenshine Principle 9: Require and monitor independent practice.\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s017.jpg", "title": "Activity 2", "notes": "PURPOSE: Activity 2 Synthesis: write expressions that show how each product was found.\nTIMING: About 4 min.\nCLICK-BY-CLICK:\n  Start: 8 × 4,973.\n  Click 1: expanded form.\n  Click 2: partial-product expressions.\n  Click 3: partial products.\n  Click 4: 39,784.\n  Click 5: Problem 2 answer card (5 × 699).\nTEACHER SAYS:\n  Select 1–2 students to share their solutions and reasoning for finding the value of 8 × 4,973.\n  Consider asking students to write expressions that represent the way they found each product.\nANTICIPATED RESPONSES:\n  • IM example: 8 × 4,973 / 8 × (4,000 + 900 + 70 + 3) / (8 × 4,000) + 8 × 900 + 8 × 70 + 8 × 3 / 32,000 + 7,200 + 560 + 24 / 39,784.\n  • Problem 2 (IM): 3,000 + 450 + 45 = 3,495.\nFORMATIVE ASSESSMENT: Students mark their own work: which partial product (colour) did I get wrong, if any?\nCALLOUTS:\n  • Partial products: continue to refer to them by their mathematical name (IM).\n  • Rosenshine Principle 4: Provide models.\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s018.jpg", "title": "Lesson Wrap Up", "notes": "PURPOSE: Lesson Synthesis, part 1: compare diagrams for 7 × 2,129 and 7 × 129.\nTIMING: About 6 min of 10.\nCLICK-BY-CLICK:\n  Click 1: the comparison question.\nTEACHER SAYS:\n  “Today we used diagrams to multiply three- and four-digit numbers by one-digit numbers. Let’s compare diagrams that represent 7 × 2,129 and 7 × 129.”\n  Display 7 × 2,129 and 7 × 129.\n  “How are the representations alike and how are they different?”\nANTICIPATED RESPONSES:\n  • IM: They both show the expanded form of the multi-digit factor, have 7 as one of the factors, and show partial products. They both show one factor decomposed by place value or written in expanded form. They are different because one diagram is decomposed into four parts because the factor 2,129 has four digits. The diagram shows 4 partial products. The other diagram is decomposed into 3 parts, because 129 has three digits. The diagram shows 3 partial products.\nMISCONCEPTIONS TO WATCH FOR:\n  • Thinking the number of parts depends on the one-digit factor.\nFORMATIVE ASSESSMENT: Ask: “How many partial products would 7 × 52,129 have?” (Sample: 5.)\nCALLOUTS:\n  • Rosenshine Principle 3: Ask a large number of questions.\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s019.jpg", "title": "Lesson Wrap Up", "notes": "PURPOSE: Lesson Synthesis, part 2: a factor with a zero in it.\nTIMING: About 4 min of 10.\nCLICK-BY-CLICK:\n  Click 1: 2,039 in expanded form.\n  Click 2: the three partial-product expressions.\nTEACHER SAYS:\n  “How would you find the value of 7 × 2,039?”\nANTICIPATED RESPONSES:\n  • IM: Think of 2,039 as 2,000 + 30 + 9 and find (7 × 2,000) + (7 × 30) + (7 × 9).\n  • Sample value: 14,000 + 210 + 63 = 14,273.\nMISCONCEPTIONS TO WATCH FOR:\n  • Drawing a hundreds part for the 0 and writing 7 × 0 hundreds as 7 hundreds. Ask what the 0 is worth.\nDIFFERENTIATION / EXTENSION:\n  • Return to the HOW question (Researchers · Resourceful): what tools helped you keep every part organized today?\nFORMATIVE ASSESSMENT: Cold call 2 students for the expression.\nCALLOUTS:\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s020.jpg", "title": "Cool Down", "notes": "PURPOSE: Cool-down: independent check of the learning target.\nTIMING: 5 min, independent.\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Students work on their own on the Cool-down page.\nANTICIPATED RESPONSES:\n  • 1,308. Sample (IM): (6 × 200) + (6 × 10) + (6 × 8) = 1,200 + 60 + 48 = 1,308, with a diagram 200 | 10 | 8 by 6.\nMISCONCEPTIONS TO WATCH FOR:\n  • Responding to Student Thinking (IM): Students may find the correct partial products but add them incorrectly.\nDIFFERENTIATION / EXTENSION:\n  • Next Day Supports (IM): Before the Warm-up, invite students to work in small groups to discuss a correct response to this Cool-down.\n  • Prior-unit support: students who add the partial products incorrectly may need a quick review of multi-digit addition with regrouping.\nFORMATIVE ASSESSMENT: Sort: correct / correct partial products with an addition error / place-value error in a partial product. Use for Day 6 small groups.\nCALLOUTS:\n  • Assessment (sequence card): IM L7 diagram-and-equation tasks.\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}]}, "Math U2 L06_Multiply 2 Two-digit Numbers​.pptx": {"name": "Math U2 L06_Multiply 2 Two-digit Numbers​.pptx", "slug": "Math_U2_L06_Multiply_2_Two_digit_Numbers", "pptx": null, "pdf": null, "sprite": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/sprite.jpg", "tw": 192, "th": 108, "landscape": true, "slides": [{"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s001.jpg", "title": "Multiply 2 Two-Digit Numbers", "notes": "PURPOSE: Open the lesson and set the split-screen intention (verbatim from the Day 6 sequence card).\nTIMING: 1 min. Lesson total 60 min: Warm-up 10, Activity 1 20, Activity 2 15, Lesson Synthesis 10, Cool-down 5 (IM timeline).\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Read both questions aloud. This is the skill the M1&M2 Checkpoint area-diagram question asks for (sequence card).\nCALLOUTS:\n  • Standards: 4.NBT.B.5 (Addressing; Building Toward in the Warm-up).\n  • Instructional routines: Number Talk, MLR5 Co-Craft Questions.\n  • Source: Day 6 lesson plan (Day 6 Teacher.pdf = IM Grade 4 Unit 6 Lesson 8) and Day 6 Student.pdf."}, {"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s002.jpg", "title": "Learning Target", "notes": "PURPOSE: State the learning target (verbatim from the Day 6 sequence card) and the IM student-facing goal.\nTIMING: 1 min.\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Read the target together.\nFORMATIVE ASSESSMENT: Thumb check on confidence; revisit at the Cool-down.\nCALLOUTS:\n  • IM lesson goals: describe (orally) how decomposing factors by place value is helpful when determining products; use a diagram to multiply 2 two-digit numbers.\n  • No success criteria are given in the source, so there is no Success Criteria slide."}, {"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s003.jpg", "title": "Warm Up", "notes": "PURPOSE: Warm-up (Number Talk): use multiples of 10 to mentally multiply two-digit numbers that are close to multiples of 10. Students use place value reasoning and the distributive property over addition or subtraction, and think flexibly about how numbers can be decomposed strategically.\nTIMING: 10 min total. For each expression: 1 min quiet think time, then record answers and strategy.\nCLICK-BY-CLICK:\n  Start: prompt and signal line only.\n  Click 1: 20 × 60.  Click 2: 1,200.\n  Click 3: 21 × 60.  Click 4: 1,260.\n  Click 5: 20 × 62.  Click 6: 1,240.\n  Click 7: 19 × 60.  Click 8: 1,140.\n  Each value appears only after students have shared strategies. Keep expressions and work displayed (record strategies on the board).\nTEACHER SAYS:\n  Display one expression.\n  “Give me a signal when you have an answer and can explain how you got it.”\n  1 minute: quiet think time.\n  Record answers and strategy. Keep expressions and work displayed. Repeat with each expression.\nANTICIPATED RESPONSES:\n  • 1,200 (IM): I know 2 × 6 is 12, so 2 × 10 × 6 × 10 is 12 × 100, which is 1,200.\n  • 1,260 (IM): 21 × 60 is one more group of 60 than 20 × 60, so it is 1,200 + 60 or 1,260 (or (20 × 60) + (1 × 60) = 1,260).\n  • 1,240 (IM): 20 × 62 is 20 × 2 more than 20 × 60, so it is 40 more than 1,200 (or (20 × 60) + (20 × 2) = 1,240).\n  • 1,140 (IM): 19 groups of 60 is 1 group of 60 less than 20 groups of 60, so it is 1,200 − 60 or 1,140 (or (20 × 60) − (1 × 60) = 1,140).\nMISCONCEPTIONS TO WATCH FOR:\n  • 20 × 62: adding 2 instead of 20 × 2.\n  • 19 × 60: subtracting 1 instead of 60.\nDIFFERENTIATION / EXTENSION:\n  • Support: write 20 × 60 = 1,200 in a corner of the board as an anchor for the other three.\nFORMATIVE ASSESSMENT: Note which students use 20 × 60 to reason about the others.\nCALLOUTS:\n  • Instructional routine: Number Talk.\n  • Rosenshine Principle 1: Begin with a short review.\n  • Source: Day 6 lesson plan (Day 6 Teacher.pdf = IM Grade 4 Unit 6 Lesson 8) and Day 6 Student.pdf."}, {"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s004.jpg", "title": "Warm Up", "notes": "PURPOSE: Warm-up Activity Synthesis.\nTIMING: About 2 min.\nCLICK-BY-CLICK:\n  Click 1: the reasoning sentence.\n  Click 2: (20 × 60) − (1 × 60).\n  Click 3: 1,200 − 60 = 1,140.\nTEACHER SAYS:\n  “How can 20 × 60 help us find the value of 19 × 60?”\nANTICIPATED RESPONSES:\n  • IM: 19 × 60 is one group of 60 less than 20 × 60, so we can subtract 60 from 20 × 60.\nFORMATIVE ASSESSMENT: Ask: “How could 20 × 60 help with 20 × 59?” (Sample: subtract 20.)\nCALLOUTS:\n  • Rosenshine Principle 3: Ask a large number of questions.\n  • Source: Day 6 lesson plan (Day 6 Teacher.pdf = IM Grade 4 Unit 6 Lesson 8) and Day 6 Student.pdf."}, {"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s005.jpg", "title": "Activity 1", "notes": "PURPOSE: Launch Activity 1. Students use rectangular diagrams to represent multiplication of 2 two-digit numbers. They analyze a progression: 18 and 6, 18 and 10, then 18 and 16.\nTIMING: About 2 min of Activity 1's 20: 1 min quiet think time, 1 min partner discussion.\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Display the three diagrams in the activity.\n  “What do you notice? What do you wonder?”\n  1 minute: quiet think time.\n  1 minute: partner discussion.\nANTICIPATED RESPONSES:\n  • Sample (not in IM): All three have 10 and 8 across the top. Diagram C has two rows. Diagram C looks like A and B stacked together.\n  • Sample wonder: Why does C have 10 and 6 down the side?\nMISCONCEPTIONS TO WATCH FOR:\n  • Thinking diagram C shows 18 × 106 or 18 × 60 because of how the side labels read.\nDIFFERENTIATION / EXTENSION:\n  • MLR8 Discussion Supports (IM): Pair gestures with verbal directions to clarify the meaning of any unfamiliar terms such as partial product.\nCALLOUTS:\n  • MLR8 Discussion Supports — Advances: Listening, Representing.\n  • Source: Day 6 lesson plan (Day 6 Teacher.pdf = IM Grade 4 Unit 6 Lesson 8) and Day 6 Student.pdf."}, {"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s006.jpg", "title": "Activity 1", "notes": "PURPOSE: Get Ready · Do · Done send-off for Activity 1 (Ward & Jacobsen, GDD pp. 74–79).\nTIMING: 1 min. Step times from IM: 3 min independent work time, 3 min partner discussion, then share responses, then 3 min independent or partner work time. Work time 9 min; halfway = 4½ min.\nCLICK-BY-CLICK:\n  Click 1: Done mat.\n  Click 2: Do mat.\n  Click 3: Get Ready mat.\nTEACHER SAYS:\n  Teacher says (drafted for this deck; the Day 6 lesson plan has no GDD script): “Future glasses on. When you're done, your page has an expression and a value for diagrams A, B and C, your thinking about how they are alike and different, and diagrams with products for 13 × 21 and 25 × 46. Steps: 3 minutes on Problem 1 by yourself, 3 minutes with your partner and a quick class share, then 3 minutes on Problems 2 and 3. Get Ready: task page, pencil, and base-ten blocks only if you want them.”\n  Future-glasses prompt: “Picture your diagram for 13 × 21. How many parts will it have?”\n  If-then obstacle prompt: “If you get stuck on a big product, then split both numbers into tens and ones and find one part at a time.”\n  Set the timer for the halfway point: 4½ minutes (pause it during the class share).\nFORMATIVE ASSESSMENT: At the halfway point, listen in on partner talk for “partial product.”\nCALLOUTS:\n  • EF: GDD send-off (Ward & Jacobsen, GDD p. 75, Figure 1; halfway timer p. 79).\n  • Base-ten blocks are from the IM UDL note (Action and Expression). Space lines are inferred."}, {"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s007.jpg", "title": "Activity 1", "notes": "PURPOSE: Activity 1, Problem 1 (independent then partner).\nTIMING: 3 min independent work, 3 min partner discussion (IM).\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  “Take a few quiet minutes to work on the first problem. Then share your thinking with your partner.”\n  3 minutes: independent work time.\n  3 minutes: partner discussion.\nANTICIPATED RESPONSES:\n  • a. 18 × 6 or 6 × 18. The value is 108. Sample (IM): (10 × 6) + (8 × 6) = 60 + 48 = 108.\n  • b. 18 × 10 or 10 × 18. The value is 180. Sample (IM): (10 × 10) + (10 × 8) = 100 + 80 = 180.\n  • c. 18 × 16 or 16 × 18. The value is 288. Sample (IM): (10 × 10) + (10 × 8) + (6 × 10) + (6 × 8) = 100 + 80 + 60 + 48 = 288.\nMISCONCEPTIONS TO WATCH FOR:\n  • In diagram c, finding only two partial products (for example 10 × 10 and 6 × 8).\nDIFFERENTIATION / EXTENSION:\n  • UDL Action and Expression (IM): Give students access to base-ten blocks. If students use the blocks for the last question, ask them to also draw a diagram that represents their work with the blocks.\nFORMATIVE ASSESSMENT: Problem-solving conferring (sequence card, Day 6): Watch for students missing one of the four partial products when both factors are decomposed.\nCALLOUTS:\n  • UDL — Action and Expression: Develop Expression and Communication. Supports accessibility for: Conceptual Processing, Visual-Spatial Processing.\n  • Source: Day 6 lesson plan (Day 6 Teacher.pdf = IM Grade 4 Unit 6 Lesson 8) and Day 6 Student.pdf."}, {"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s008.jpg", "title": "Activity 1", "notes": "PURPOSE: Share Problem 1 responses before students go on.\nTIMING: About 2 min.\nCLICK-BY-CLICK:\n  Click 1: 18 × 6.\n  Click 2: partial products and 108.\n  Click 3: 18 × 10.\n  Click 4: partial products and 180.\n  Click 5: 18 × 16.\n  Click 6: four partial products and 288.\nTEACHER SAYS:\n  Invite students to share their responses: “What multiplication expression can be represented by each diagram?”\n  “Complete the rest of the activity.”\nANTICIPATED RESPONSES:\n  • IM: 18 × 6 = 108; 18 × 10 = 180; 18 × 16 = 288 (see Problem 1 notes for equations). Students may also say 6 × 18, 10 × 18, 16 × 18.\nMISCONCEPTIONS TO WATCH FOR:\n  • Missing one of the four partial products in c.\nFORMATIVE ASSESSMENT: Problem-solving conferring (sequence card, Day 6): Watch for students missing one of the four partial products when both factors are decomposed.\nCALLOUTS:\n  • Rosenshine Principle 6: Check for student understanding.\n  • Source: Day 6 lesson plan (Day 6 Teacher.pdf = IM Grade 4 Unit 6 Lesson 8) and Day 6 Student.pdf."}, {"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s009.jpg", "title": "Activity 1", "notes": "PURPOSE: Activity 1, Problems 2–3.\nTIMING: 3 min independent or partner work time (IM).\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  “Complete the rest of the activity.”\n  Monitor for students who decompose both factors into tens and ones and those who choose to keep one of the factors intact.\nANTICIPATED RESPONSES:\n  • 2. Sample (IM): The diagrams are alike because they all show multiplication by 18, decomposed by place value. They are different because Diagram A shows a one-digit factor, B shows 10 as a factor, and C shows a two-digit factor partitioned into two rows. Diagrams A and B are smaller parts of Diagram C.\n  • 3. 13 × 21 = 200 + 10 + 60 + 3 = 273 (IM). 25 × 46 = 800 + 120 + 200 + 30 = 1,150 (IM).\nMISCONCEPTIONS TO WATCH FOR:\n  • Students may decompose factors in different ways. Those who are familiar with multiples of 25 may find it intuitive to decompose 25 × 46 as 25 × 40 and 25 × 6, rather than decomposing 25 into 20 + 5 (IM).\nDIFFERENTIATION / EXTENSION:\n  • Support: pre-drawn 2-by-2 rectangle.\n  • Extension: find 25 × 46 two ways.\nFORMATIVE ASSESSMENT: Problem-solving conferring (sequence card, Day 6): Watch for students missing one of the four partial products when both factors are decomposed. Assessment (sequence card): IM L8 area-diagram tasks.\nCALLOUTS:\n  • Rosenshine Principle 9: Require and monitor independent practice.\n  • Source: Day 6 lesson plan (Day 6 Teacher.pdf = IM Grade 4 Unit 6 Lesson 8) and Day 6 Student.pdf."}, {"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s010.jpg", "title": "Activity 1", "notes": "PURPOSE: Activity 1 Synthesis.\nTIMING: About 4 min.\nCLICK-BY-CLICK:\n  Click 1: Question 1.\n  Click 2: Question 2.\n  Clicks 3–6: each partial product, one at a time.\n  Click 7: Question 3.\n  Click 8: 200 + 10 + 60 + 3 = 273.\nTEACHER SAYS:\n  Select two students to share their diagrams, solutions, and reasoning for the last problem.\n  “How did you decompose the factors and the diagram?”\n  “What expression could we write to show the partial product represented by each part of the diagram?”\n  “How do these partial products help us find the value of 13 × 21?”\nANTICIPATED RESPONSES:\n  • IM: I decomposed the 13 into 10 and 3 and the 21 into 20 and 1.\n  • IM: Adding them gives us the value of 13 × 21: 200 + 10 + 60 + 3 = 273.\nMISCONCEPTIONS TO WATCH FOR:\n  • Writing 3 × 1 = 3 but leaving it out of the sum.\nFORMATIVE ASSESSMENT: Problem-solving conferring (sequence card, Day 6): Watch for students missing one of the four partial products when both factors are decomposed.\nCALLOUTS:\n  • Rosenshine Principle 4: Provide models.\n  • Source: Day 6 lesson plan (Day 6 Teacher.pdf = IM Grade 4 Unit 6 Lesson 8) and Day 6 Student.pdf."}, {"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s011.jpg", "title": "Activity 1", "notes": "PURPOSE: Compare the two decompositions IM anticipates for 25 × 46: both factors by place value (IM student response) and keeping 25 whole (IM activity narrative).\nTIMING: About 2 min.\nCLICK-BY-CLICK:\n  Click 1: four partial products for 20 + 5 by 40 + 6, total 1,150.\n  Click 2: the 25 × 40 and 25 × 6 diagram, total 1,150.\nTEACHER SAYS:\n  Ask the student who kept 25 whole to explain why 25 × 40 felt easy.\nANTICIPATED RESPONSES:\n  • IM: 800 + 120 + 200 + 30 = 1,150.\n  • IM narrative: students familiar with multiples of 25 may decompose 25 × 46 as 25 × 40 and 25 × 6. Values 1,000 and 150 computed for this slide (sample).\nMISCONCEPTIONS TO WATCH FOR:\n  • Students who think only one way is right.\nDIFFERENTIATION / EXTENSION:\n  • Return to the HOW question (Self Managers · Flexible): which way would you choose for 25 × 46, and why?\nFORMATIVE ASSESSMENT: Can students say why both diagrams give the same product?\nCALLOUTS:\n  • Source: Day 6 lesson plan (Day 6 Teacher.pdf = IM Grade 4 Unit 6 Lesson 8) and Day 6 Student.pdf."}, {"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s012.jpg", "title": "Activity 2", "notes": "PURPOSE: Launch Activity 2 with MLR5 Co-Craft Questions. Display only the two diagrams, without revealing the opening sentence or the question(s).\nTIMING: About 6 min of Activity 2's 15: 2 min independent, 2 min partner, then share.\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Groups of 2.\n  “Write a list of mathematical questions that could be asked about this situation.”\n  2 minutes: independent work time.\n  2 minutes: partner discussion.\n  Invite several students to share one question with the class. Record responses.\n  “What do these questions have in common? How are they different?”\n  Reveal the task (students open books), and invite additional connections.\nANTICIPATED RESPONSES:\n  • Sample questions (not in IM): What are the missing numbers in each part? Do both diagrams show the same product? Why are the side lengths different?\nMISCONCEPTIONS TO WATCH FOR:\n  • Questions that are not mathematical (for example, about colours). Redirect: what could we calculate?\nFORMATIVE ASSESSMENT: Listen for questions about the products of each part.\nCALLOUTS:\n  • MLR5 Co-Craft Questions — Advances: writing, reading, representing.\n  • MP7: students see why it is helpful to decompose each factor by place value.\n  • Source: Day 6 lesson plan (Day 6 Teacher.pdf = IM Grade 4 Unit 6 Lesson 8) and Day 6 Student.pdf."}, {"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s013.jpg", "title": "Activity 2", "notes": "PURPOSE: Get Ready · Do · Done send-off for Activity 2 (Ward & Jacobsen, GDD pp. 74–79).\nTIMING: 1 min. IM gives 2 min independent work on the first problem and 1 min partner discussion. IM gives no time for “complete the rest of the activity,” so the 4 minutes for Problem 2 is inferred from what is left of the 15 minutes after the co-craft launch and before the synthesis. Work time 7 min; halfway = 3½ min.\nCLICK-BY-CLICK:\n  Click 1: Done mat.\n  Click 2: Do mat.\n  Click 3: Get Ready mat.\nTEACHER SAYS:\n  Teacher says (drafted for this deck; the Day 6 lesson plan has no GDD script): “Future glasses on. When you're done, your page says which diagram is more helpful and why, and shows diagrams and products for 49 × 57 and 29 × 55. Steps: 2 minutes thinking about Question 1 on your own, 1 minute with your partner, then 4 minutes on Problem 2. Get Ready: task page and pencil, next to your partner.”\n  Future-glasses prompt: “Picture your diagram for 29 × 55. What numbers are on the sides?”\n  If-then obstacle prompt: “If a part feels hard to multiply in your head, then check: did I split by place value?”\n  Set the timer for the halfway point: 3½ minutes.\nFORMATIVE ASSESSMENT: At the halfway point, check that pairs have moved to Problem 2.\nCALLOUTS:\n  • EF: GDD send-off (Ward & Jacobsen, GDD p. 75, Figure 1; halfway timer p. 79).\n  • Extra problems (83 × 39, 64 × 92) are IM's “if extra time is available” items.\n  • Materials and space lines are inferred."}, {"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s014.jpg", "title": "Activity 2", "notes": "PURPOSE: Activity 2 task (after the co-craft reveal).\nTIMING: 2 min independent on Question 1, 1 min partner discussion, then the rest of the activity (IM).\nCLICK-BY-CLICK:\n  Click 1 (only if there is extra time): 83 × 39 and 64 × 92.\nTEACHER SAYS:\n  “Take two quiet minutes to think about the first question. Then share your thinking with your partner.”\n  2 minutes: independent work time on the first problem.\n  1 minute: partner discussion.\n  “Now complete the rest of the activity.”\n  Monitor for students who: decompose the side lengths of their diagrams by place value; write expressions to show the sum of the partial products.\n  If extra time is available, add more two-digit by two-digit expressions to the last problem: 83 × 39, 64 × 92.\nANTICIPATED RESPONSES:\n  • 1. Sample (IM): Diagram A, because 40 × 50 is easier than 37 × 50 to find or know.\n  • 2. 49 × 57: 2,000 + 280 + 450 + 63 = 2,793 (IM). 29 × 55: 1,000 + 100 + 450 + 45 = 1,595 (IM).\n  • Extra (sample, not in IM): 83 × 39 = 3,237; 64 × 92 = 5,888.\nMISCONCEPTIONS TO WATCH FOR:\n  • Choosing Diagram B because 12 “looks easier” than 9.\nFORMATIVE ASSESSMENT: Problem-solving conferring (sequence card, Day 6): Watch for students missing one of the four partial products when both factors are decomposed. Assessment (sequence card): IM L8 area-diagram tasks.\nCALLOUTS:\n  • MP7: Look for and make use of structure.\n  • Source: Day 6 lesson plan (Day 6 Teacher.pdf = IM Grade 4 Unit 6 Lesson 8) and Day 6 Student.pdf."}, {"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s015.jpg", "title": "Activity 2", "notes": "PURPOSE: Activity 2 Synthesis.\nTIMING: About 3 min.\nCLICK-BY-CLICK:\n  Click 1: Question 1.\n  Click 2: Question 2.\n  Click 3: partial products in Diagram A.\n  Click 4: 2,000 + 280 + 450 + 63 = 2,793.\nTEACHER SAYS:\n  “How can both diagrams be used to find the value of 49 × 57?”\n  “Why was the partitioning in Diagram A more helpful than in Diagram B?”\nANTICIPATED RESPONSES:\n  • Q1 (IM): We can partition each side of a rectangle in many ways without changing the total side lengths.\n  • Q2 (IM): 40 × 50 is easier than 37 × 50 or 12 × 50 to find mentally, because we are multiplying multiples of 10.\nFORMATIVE ASSESSMENT: Ask pairs to point to the hardest partial product in Diagram B (sample: 37 × 50).\nCALLOUTS:\n  • MP7.\n  • Source: Day 6 lesson plan (Day 6 Teacher.pdf = IM Grade 4 Unit 6 Lesson 8) and Day 6 Student.pdf."}, {"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s016.jpg", "title": "Lesson Wrap Up", "notes": "PURPOSE: Lesson Synthesis: compare a decomposition that is not helpful (42 + 13) with decomposing by place value (50 + 5).\nTIMING: 10 min (IM estimate).\nCLICK-BY-CLICK:\n  Start: the 42 + 13 diagram (IM's example of an unhelpful decomposition).\n  Click 1: the place-value diagram.\n  Click 2: its partial products.\n  Click 3: the why question.\nTEACHER SAYS:\n  “Today we learned how to represent the multiplication of 2 two-digit numbers using a rectangular diagram. We learned that we can decompose each factor by place value and show the tens and ones on each side of the rectangle, and that doing this can help us to multiply efficiently.”\n  Select students with different strategies to share their reasoning for finding the value of 29 × 55 (the last problem of the last activity).\n  Display the following diagram as an example of how decomposing can result in facts that are not helpful when multiplying to support using place value to decompose.\n  “Why might it be more helpful to decompose 55 into 50 + 5 than into 42 + 13?”\nANTICIPATED RESPONSES:\n  • IM: Multiplying by multiples of 10 and by single-digit numbers is easier than multiplying numbers like 42 and 9.\n  • IM: 1,000 + 100 + 450 + 45 = 1,595.\nMISCONCEPTIONS TO WATCH FOR:\n  • Students who think the 42 + 13 diagram gives a different product. It gives the same product; it is just harder to find.\nDIFFERENTIATION / EXTENSION:\n  • Return to the HOW question (Self Managers · Flexible): how did you adapt your diagram when there were four parts to track?\nFORMATIVE ASSESSMENT: Cold call: “Which part of the 42 + 13 diagram would be hardest to find?”\nCALLOUTS:\n  • The right-hand diagram is redrawn from the IM Activity 2 student response for 29 × 55 so the two decompositions sit side by side.\n  • Source: Day 6 lesson plan (Day 6 Teacher.pdf = IM Grade 4 Unit 6 Lesson 8) and Day 6 Student.pdf."}, {"img": "_hub/slides/Math_U2_L06_Multiply_2_Two_digit_Numbers/s017.jpg", "title": "Cool Down", "notes": "PURPOSE: Cool-down: independent check of the learning target.\nTIMING: 5 min, independent.\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Students work on their own on the Cool-down page.\nANTICIPATED RESPONSES:\n  • 408. Sample (IM): 200 + 140 + 40 + 28 = 408 (diagram 20 + 4 by 10 + 7).\nMISCONCEPTIONS TO WATCH FOR:\n  • Responding to Student Thinking (IM): Students may decompose factors in ways to result in partial products that are not useful.\nDIFFERENTIATION / EXTENSION:\n  • Next Day Supports (IM): Launch Warm-up or activities by analyzing two different ways to decompose the factors to multiply. Discuss which is most useful and why.\n  • Prior-unit support: students missing a partial product may need to return to Day 4 diagrams (one factor split) before Day 7 practice.\nFORMATIVE ASSESSMENT: Sort cool-downs: correct / missing a partial product / unhelpful decomposition. Day 7 (Consolidation & Practice) uses these groups for targeted small-group support.\nCALLOUTS:\n  • Assessment (sequence card): IM L8 area-diagram tasks.\n  • Source: Day 6 lesson plan (Day 6 Teacher.pdf = IM Grade 4 Unit 6 Lesson 8) and Day 6 Student.pdf."}]}, "Math U2 L08_Checkpoint M1-2.pptx": {"name": "Math U2 L08_Checkpoint M1-2.pptx", "slug": "Math_U2_L08_Checkpoint_M1_2", "pptx": null, "pdf": null, "sprite": "_hub/slides/Math_U2_L08_Checkpoint_M1_2/sprite.jpg", "tw": 192, "th": 108, "landscape": true, "slides": [{"img": "_hub/slides/Math_U2_L08_Checkpoint_M1_2/s001.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L08_Checkpoint_M1_2/s002.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L08_Checkpoint_M1_2/s003.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L08_Checkpoint_M1_2/s004.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L08_Checkpoint_M1_2/s005.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L08_Checkpoint_M1_2/s006.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L08_Checkpoint_M1_2/s007.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L08_Checkpoint_M1_2/s008.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L08_Checkpoint_M1_2/s009.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L08_Checkpoint_M1_2/s010.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L08_Checkpoint_M1_2/s011.jpg", "title": "", "notes": ""}]}, "Math U2 L09_Partial Products.pptx": {"name": "Math U2 L09_Partial Products.pptx", "slug": "Math_U2_L09_Partial_Products", "pptx": null, "pdf": null, "sprite": "_hub/slides/Math_U2_L09_Partial_Products/sprite.jpg", "tw": 192, "th": 108, "landscape": true, "slides": [{"img": "_hub/slides/Math_U2_L09_Partial_Products/s001.jpg", "title": "Recording Partial Products: One-Digit and Three- or Four-Digit Factors", "notes": "PURPOSE: Open Day 9 (IM Grade 4, Unit 6, Lesson 9) and set the split-screen intentions. This is the first lesson of Part 2: recording strategies and efficient computation.\n\nTIMING: 1 minute\n\nTEACHER SAYS:\n“Today we write down the thinking we have been drawing. Read the WHAT question with me. Now the HOW question: being flexible means we can show the same idea as a picture or as equations.”\n\nDISCUSSION PROMPTS:\n• WHAT (Day 9 card): As mathematicians, how can writing an equation for each part of our diagram help us explain our thinking without the picture?\n• HOW (Thinkers · Flexible): As thinkers, how can being flexible between a diagram and a written equation help us communicate the same idea two ways?\n\nDIFFERENTIATION AND SUPPORT:\n• Start your first conferring group with the students the Day 8 Cool-down flagged: anyone who rated the multiplication statement a 1 or 2, or named Question 3 as hardest because of a missing part.\n\nCALLOUTS: Standard 4.NBT.B.5. Card tags: NBT.5, IM L9. Lesson timeline from the IM guide: Warm-up 10, Activity 1 20, Activity 2 15, Lesson Synthesis 10, Cool-down 5."}, {"img": "_hub/slides/Math_U2_L09_Partial_Products/s002.jpg", "title": "Learning Target", "notes": "PURPOSE: Name the learning target (verbatim from the Day 9 card) and connect it to the Part 2 question.\n\nTIMING: 1 minute\n\nTEACHER SAYS:\n“Read the target with me. For eight days we drew diagrams. Starting today we also record each part. By the end of the lesson you will check: can I write an equation for each part of a diagram?”\n\nFORMATIVE ASSESSMENT: Revisit the target in the Lesson Synthesis: students point to one part of the diagram and the matching line of the algorithm.\n\nCALLOUTS: Rosenshine Principle 1: begin with a short review. Students saw diagrams for one-digit by three- and four-digit factors on Days 4–5."}, {"img": "_hub/slides/Math_U2_L09_Partial_Products/s003.jpg", "title": "Warm Up", "notes": "PURPOSE: Which Three Go Together? Students compare four equivalent expressions and use precise language about their features and value (MP6). It gives you a read on how students talk about properties of operations.\n\nTIMING: 10 minutes: 1 minute quiet think, 2–3 minutes partner discussion, then share and record.\n\nCLICKS: Expressions are on screen from the start. Click 1: first synthesis question. Click 2: second synthesis question.\n\nTEACHER SAYS:\n“Pick 3 that go together. Be ready to share why they go together.”\n(After 1 minute of quiet think time) Discuss your thinking with your partner.\n\nDISCUSSION PROMPTS:\n• How are the expressions alike? (They all have a value of 350.)\n• Were there expressions that you knew right away had the same value? Which ones? How did you know?\n\nANTICIPATED RESPONSES:\n• A, B, and C go together because they have a multiplication symbol.\n• A, B, and D go together because they include 50.\n• A, C, and D go together because each has only one type of operation symbol.\n• B, C, and D go together because they have multiple operations.\n\nWATCH FOR / MISCONCEPTIONS:\n• Students who only name surface features (symbols, number of 50s) without checking the value. Ask: What is the value of each one?\n\nDIFFERENTIATION AND SUPPORT:\n• Groups of 2. Record each reason next to the expressions so students can see the language.\n\nFORMATIVE ASSESSMENT: Listen for students who can say why B equals A (3 fifties and 4 fifties make 7 fifties). That is the decomposing move the rest of the lesson relies on.\n\nCALLOUTS: IM routine: Which Three Go Together? Rosenshine Principle 3: ask questions."}, {"img": "_hub/slides/Math_U2_L09_Partial_Products/s004.jpg", "title": "Activity 1", "notes": "PURPOSE: Launch Activity 1. Students look at Noah's diagram before they see his expressions or his new recording method.\n\nTIMING: About 2 minutes: 1 minute partner discussion, then share and record.\n\nTEACHER SAYS:\n“What do you notice? What do you wonder?”\n\nANTICIPATED RESPONSES:\n• Sample (not from the guide): 7 is multiplied by each part of 124. The parts are 100, 20 and 4. 700, 140 and 28 are inside the rectangle.\n• Sample wonder: Why is the 100 part so much bigger? What is the whole product?\n\nDIFFERENTIATION AND SUPPORT:\n• Groups of 2. Record notices and wonders where students can see them during the activity.\n\nCALLOUTS: IM Activity 1 Launch. MLR8 Discussion Supports: revoice student ideas with precise language (see the next slides)."}, {"img": "_hub/slides/Math_U2_L09_Partial_Products/s005.jpg", "title": "Activity 1", "notes": "PURPOSE: Problem 1. Students connect each expression to a part of the diagram. This is the target in action: an equation for each part.\n\nTIMING: 4 minutes independent work on Problem 1, then 4 minutes partner discussion.\n\nCLICKS: Diagram and expressions show first. Click 1: the question.\n\nTEACHER SAYS:\n“Take a few minutes on your own. How does each expression represent Noah's diagram? Then talk with your partner.”\n\nANTICIPATED RESPONSES:\n• 7 × 124 represents the value of the whole diagram.\n• 7 × (100 + 20 + 4) represents one factor (one side length of the rectangle) being decomposed by place value and being multiplied by 7.\n• (7 × 100) + (7 × 20) + (7 × 4) represents each decomposed part of 124 being multiplied by 7 and combined together.\n• 700 + 140 + 28 represents the sum of the products in all the parts, which is the product of 7 × 124.\n\nWATCH FOR / MISCONCEPTIONS:\n• Students who match 700 + 140 + 28 to the diagram but cannot say where 7 × (100 + 20 + 4) shows up. Point to the top labels and the side label.\n\nDIFFERENTIATION AND SUPPORT:\n• MLR8 Discussion Supports: revoice. For example, revoice “I added all the numbers together to find the answer” as “I added all the partial products to calculate the final product.”\n\nFORMATIVE ASSESSMENT: Problem-Solving Conferring (Day 9 card): do students see the diagram and the equations as the same thinking, or as two unrelated methods?\n\nCALLOUTS: Rosenshine Principle 4: provide models. MP2 reasoning abstractly and quantitatively."}, {"img": "_hub/slides/Math_U2_L09_Partial_Products/s006.jpg", "title": "Activity 1", "notes": "PURPOSE: Problem 2. Students make sense of an algorithm that uses partial products. The highlights show which digits are multiplied in each step.\n\nTIMING: Part of the 5 minutes of group work time on the rest of the activity (Problems 2 and 3).\n\nCLICKS: Prompt shows first. Clicks 1–3: Step 1, Step 2, Step 3. Reveal one step at a time when you go over it; students have all three steps on their page.\n\nTEACHER SAYS:\n“Noah learns another way to record the multiplication. Make sense of each step of the calculations and record your thoughts.”\n\nANTICIPATED RESPONSES:\n• Noah multiplies the single-digit factor by each digit of the multi-digit number at the top in order from right to left. He places the products below the line and adds them up to get the final product.\n\nWATCH FOR / MISCONCEPTIONS:\n• Monitor for students who include the place value of each digit in 124 in explaining what is happening in the algorithm.\n• Students who say “7 times 2 is 14” and write 14. Ask: What is the 2 worth in 124?\n\nDIFFERENTIATION AND SUPPORT:\n• Students are not required to use a specific notation today. Analyzing the algorithm deepens their understanding of place value in multiplication.\n\nFORMATIVE ASSESSMENT: Listen for “7 times 2 tens” or “7 times 20”, not “7 times 2.”\n\nCALLOUTS: Rosenshine Principle 2: present new material in small steps. MP3 construct viable arguments and critique the reasoning of others."}, {"img": "_hub/slides/Math_U2_L09_Partial_Products/s007.jpg", "title": "Activity 1", "notes": "PURPOSE: Problem 3. Students use the diagram and Noah's recording method on new numbers. Same thinking, two records.\n\nTIMING: Rest of the 5 minutes of group work time.\n\nTEACHER SAYS:\n“Complete the diagram to find the value of 384 × 5. Use Noah's recording method to check your work.”\n\nANTICIPATED RESPONSES:\n• Completed diagram: 1,500 | 400 | 20. 1,500 + 400 + 20 = 1,920.\n• Algorithm: 20 (5 × 4), 400 (5 × 80), 1,500 (5 × 300). Sum 1,920.\n\nWATCH FOR / MISCONCEPTIONS:\n• Students who write 40 for 5 × 80 or 15 for 5 × 300: the place value of the digit dropped out.\n• Students who line up 20, 400 and 1,500 on the left instead of by place value.\n\nDIFFERENTIATION AND SUPPORT:\n• If needed, review these steps for 5 × 384 in the synthesis (next slide).\n\nFORMATIVE ASSESSMENT: Check that each line of the algorithm matches a part of the diagram: Problem-Solving Conferring from the Day 9 card.\n\nCALLOUTS: Rosenshine Principle 5: guide student practice."}, {"img": "_hub/slides/Math_U2_L09_Partial_Products/s008.jpg", "title": "Activity 1", "notes": "PURPOSE: Activity 1 Synthesis. Students share their interpretations of Noah's steps. Each click adds one key idea from the IM guide and the matching line of the algorithm.\n\nTIMING: About 4 minutes.\n\nCLICKS: Clicks 1–4: each key idea appears with its line of the algorithm. Click 5: the closing question.\n\nTEACHER SAYS:\n“Select students to share their interpretations of the steps in the second problem.”\n“The recording strategy that Noah learned is an algorithm that uses partial products. We used an algorithm to add and subtract large numbers in our last unit.”\n“How do we know if we have finished finding all the partial products?”\n\nANTICIPATED RESPONSES:\n• We keep track of all the partial products or smaller parts of the whole product as we go. We went in order from the smallest place value to the largest place value.\n\nWATCH FOR / MISCONCEPTIONS:\n• Reiterate that we typically begin by multiplying the single-digit factor by the digit in the ones place, and then repeat with the digit in the tens place, and so on.\n\nDIFFERENTIATION AND SUPPORT:\n• If needed, review these steps for 5 × 384 (Problem 3): 5 × 4 = 20, 5 × 80 = 400, 5 × 300 = 1,500, total 1,920.\n• MLR8: revoice “I added all the numbers” as “I added all the partial products.”\n\nFORMATIVE ASSESSMENT: Can students name the place value of the digit being multiplied in each step?\n\nCALLOUTS: Rosenshine Principle 4: provide models. Rosenshine Principle 2: small steps."}, {"img": "_hub/slides/Math_U2_L09_Partial_Products/s009.jpg", "title": "Activity 1", "notes": "PURPOSE: Name the two terms students will use for the rest of Part 2.\n\nTIMING: 1 minute.\n\nCLICKS: Partial product shows first. Click 1: algorithm that uses partial products.\n\nTEACHER SAYS:\n“The recording strategy that Noah learned is an algorithm that uses partial products.”\n\nDISCUSSION PROMPTS:\n• Point to a partial product in Noah's diagram. Point to the same partial product in his algorithm.\n\nDIFFERENTIATION AND SUPPORT:\n• Definition of partial product is from the IM Lesson Synthesis: “a result of multiplying a part of one factor by the second factor.” The second card summarises Noah's steps from the Activity 1 synthesis.\n\nCALLOUTS: MLR2 style word display: keep these two terms posted through Day 14."}, {"img": "_hub/slides/Math_U2_L09_Partial_Products/s010.jpg", "title": "Activity 2", "notes": "PURPOSE: Launch Activity 2. Students see that the same partial products can be recorded in a different order.\n\nTIMING: About 4 minutes: 1 minute partner discussion, share, 1 minute quiet think time, 1 minute partner discussion.\n\nCLICKS: Click 1: Noah's and Mai's work. Click 2: how did they arrive at the last four numbers? Click 3: which representation is more like your thinking?\n\nTEACHER SAYS:\n“What strategy would you use to find the value of 6 × 2,947?”\n“Take a quiet moment to make sense of Noah and Mai's work. How do you think they arrived at the last four numbers?”\n“Which representation is more like how you thought about it?”\n\nANTICIPATED RESPONSES:\n• Sample: Noah started with 6 × 7 = 42 in the ones. Mai started with 6 × 2,000 = 12,000.\n\nDIFFERENTIATION AND SUPPORT:\n• Groups of 2.\n• Action and Expression (Internalize Executive Functions): provide colored pencils and sticky notes. Students can color code each partial product as in Activity 1, and record the expanded form of 2,947 on a sticky note (2,000 + 900 + 40 + 7).\n\nCALLOUTS: MP7 look for and make use of structure."}, {"img": "_hub/slides/Math_U2_L09_Partial_Products/s011.jpg", "title": "Activity 2", "notes": "PURPOSE: Get Ready · Do · Done send-off into Activity 2 (Ward & Jacobsen, GDD pp. 74–79). Students picture the finished page first, then plan the steps and time, then gather materials.\n\nTIMING: 2 minutes, then start the timer.\n\nCLICKS: Click 1: Done. Click 2: Do. Click 3: Get Ready. (Right to left.)\n\nTEACHER SAYS:\n“Put on your future glasses. Look at the Done mat. When you are done, your page shows Question 1 answered, a diagram for Question 2 with four parts labelled, and two products in Question 3, at least one with Noah's algorithm.”\n“Now the Do mat. Questions 1 and 2 with your partner, about 5 minutes. Then we pause together. Then Question 3 on your own, about 5 minutes.”\n“Last, Get Ready. Activity 2 page, pencil, colored pencils, and a sticky note with 2,000 + 900 + 40 + 7 on it. Clear everything else.”\n“If you get stuck on Question 2, then look back at Noah's diagram from Activity 1 and draw one part for each digit.”\n“Timer is set for the halfway point.”\n\nDIFFERENTIATION AND SUPPORT:\n• Set the timer for the halfway point (5 minutes: the pause for discussion), not the end (GDD p. 79).\n• The Do times come from the IM guide (5 minutes partner work, pause, 5 minutes independent work). There is no Day 9 lesson plan in the project yet, so the mat content is drawn from the IM guide.\n\nFORMATIVE ASSESSMENT: At the halfway pause, ask pairs to hold up Question 2: is there a part for each digit of 2,947?\n\nCALLOUTS: EF: Get Ready · Do · Done (Ward & Jacobsen). If-then obstacle prompt included above."}, {"img": "_hub/slides/Math_U2_L09_Partial_Products/s012.jpg", "title": "Activity 2", "notes": "PURPOSE: Activity 2 work time. Partners do Questions 1 and 2. After the pause, students do Question 3 on their own.\n\nTIMING: 5 minutes partner work time on the first two problems, brief pause, 5 minutes independent work time on the last set of problems.\n\nCLICKS: Questions 1 and 2 show first. Click 1: Question 3 (after the pause).\n\nTEACHER SAYS:\n“Work with your partner on the first two questions.”\n(Pause) How are Mai's and Noah's notation the same and how are they different?\n“Are both methods correct? How do you know?”\n“Work on the last set of problems independently before discussing with your partner.”\n\nANTICIPATED RESPONSES:\n• Question 1: They both multiplied using an algorithm and they both used partial products, but Mai multiplied starting with the thousands and Noah started with the ones.\n• Pause: Both of these methods calculate partial products, but Noah's goes in order from multiplying the ones, tens, hundreds, then the thousands. Mai's goes in order the other way from the thousands, hundreds, tens, and then the ones. Yes, both are correct, because they both result in the same product.\n• Question 2: diagram 6 by 2,000 | 900 | 40 | 7 with parts 12,000 | 5,400 | 240 | 42. 6 × 2,947 = 17,682.\n• Question 3a: 21,368. Question 3b: 6,881.\n\nWATCH FOR / MISCONCEPTIONS:\n• Students who record 6 × 900 as 54 or 6 × 2,000 as 12. Ask what the 9 or the 2 is worth.\n• Note: the IM student response for Question 1 says “Han started with the ones.” It should read Noah.\n\nDIFFERENTIATION AND SUPPORT:\n• Colored pencils: color code each partial product to match the diagram.\n• Sticky note with the expanded form of the factor supports working memory.\n\nEXTENSION:\n• Ask early finishers to find 6 × 2,947 a second way and say which recording was easier to check.\n\nFORMATIVE ASSESSMENT: IM L9 diagram-and-equation matching tasks (Day 9 card).\n\nCALLOUTS: Rosenshine Principle 9: guide students through independent practice. MP7."}, {"img": "_hub/slides/Math_U2_L09_Partial_Products/s013.jpg", "title": "Lesson Wrap Up", "notes": "PURPOSE: Lesson Synthesis. Students connect each part of the diagram to a line of the algorithm.\n\nTIMING: 10 minutes.\n\nCLICKS: Clicks 1–4: each part of the diagram appears with its partial product in the algorithm (ones, tens, hundreds, thousands). Click 5: the total. Click 6: the connection question.\n\nTEACHER SAYS:\n“Today we learned different ways of recording partial products to multiply four-digit by one-digit numbers. We made connections between a diagram and using algorithms that use partial products.”\n(Invite students to take turns making connections between each part of the diagram to the algorithm.)\n\nDISCUSSION PROMPTS:\n• Each number in the smaller rectangles in the diagram is a partial product—a result of multiplying a part of one factor by the second factor.\n• When we use a diagram, we can find the partial products for different smaller rectangles and add the pieces together in any order. The product stays the same no matter how we decompose the diagram.\n• When we use an algorithm that uses partial products, we multiply the ones, tens, hundreds, then thousands, and record the partial products vertically. Changing the order of multiplying doesn't change the final product.\n\nANTICIPATED RESPONSES:\n• Sample: The 160 in the yellow part is 4 × 40. It is the second line of the algorithm.\n\nDIFFERENTIATION AND SUPPORT:\n• Return to the split-screen HOW question: where did being flexible between the diagram and the algorithm help you today?\n\nFORMATIVE ASSESSMENT: Revisit the learning target: can students record the partial products from a diagram as equations?\n\nCALLOUTS: Rosenshine Principle 6: check for student understanding. Rosenshine Principle 10: weekly and monthly review (link back to Days 4–5 diagrams)."}, {"img": "_hub/slides/Math_U2_L09_Partial_Products/s014.jpg", "title": "Cool Down", "notes": "PURPOSE: Cool-down. Independent check on the learning target.\n\nTIMING: 5 minutes.\n\nTEACHER SAYS:\n“Find the value of 5 × 1,023. Show your thinking using diagrams, symbols, or other representations.”\n\nANTICIPATED RESPONSES:\n• 5,115. Sample: 5 × 3 = 15, 5 × 20 = 100, and 5 × 1,000 = 5,000. The sum of 15, 100, and 5,000 is 5,115.\n\nWATCH FOR / MISCONCEPTIONS:\n• Responding to Student Thinking (IM): students decompose factors and multiply without considering place value, resulting in incorrect partial products.\n\nDIFFERENTIATION AND SUPPORT:\n• Next Day Support (IM): after the Warm-up, have students discuss with a partner their strategies for the Cool-down and allow time to make revisions to their thinking.\n• Prior-Unit Support: Days 4–5 diagrams for one-digit by three- and four-digit factors.\n\nFORMATIVE ASSESSMENT: Sort: correct with partial products tied to place value / correct product but no record of parts / place value error.\n\nCALLOUTS: Standard 4.NBT.B.5."}]}, "Math U2 L10_Partial Products 2.pptx": {"name": "Math U2 L10_Partial Products 2.pptx", "slug": "Math_U2_L10_Partial_Products_2", "pptx": null, "pdf": null, "sprite": "_hub/slides/Math_U2_L10_Partial_Products_2/sprite.jpg", "tw": 192, "th": 108, "landscape": true, "slides": [{"img": "_hub/slides/Math_U2_L10_Partial_Products_2/s001.jpg", "title": "Using Algorithms with Partial Products: 2 Two-Digit Numbers", "notes": "PURPOSE: Open Day 10 (IM Grade 4, Unit 6, Lesson 10) and set the split-screen intentions.\n\nTIMING: 1 minute\n\nTEACHER SAYS:\n“Yesterday we recorded partial products for a one-digit factor. Today both factors have two digits, so there are four partial products to keep track of. Being reliable means checking a partner's partial products against our own.”\n\nDISCUSSION PROMPTS:\n• WHAT (Day 10 card): As mathematicians, how do we organize four partial products so we don't lose track of any of them?\n• HOW (Collaborators · Reliable): As collaborators, how can being reliable — checking a partner's recorded partial products against our own — help us both catch an error?\n\nCALLOUTS: Standard 4.NBT.B.5. Card tags: NBT.5, IM L10. IM timeline: Warm-up 10, Activity 1 25, Activity 2 10, Lesson Synthesis 10, Cool-down 5."}, {"img": "_hub/slides/Math_U2_L10_Partial_Products_2/s002.jpg", "title": "Learning Target", "notes": "PURPOSE: Name the learning target (verbatim from the Day 10 card) and the Problem-Solving Conferring look-for.\n\nTIMING: 1 minute\n\nCLICKS: Click 1: the look-for (Problem-Solving Conferring from the card).\n\nTEACHER SAYS:\n“Read the target with me. Today's check for yourself: did I record all four partial products, and are they lined up by place value before I add?”\n\nFORMATIVE ASSESSMENT: Problem-Solving Conferring (Day 10 card): check that all four partial products are recorded and aligned by place value before adding.\n\nCALLOUTS: Rosenshine Principle 1: begin with a review of Day 9's algorithm for one-digit factors."}, {"img": "_hub/slides/Math_U2_L10_Partial_Products_2/s003.jpg", "title": "Warm Up", "notes": "PURPOSE: Notice and Wonder. Students compare ways to keep track of a newly composed unit when adding, and when adding partial products. The new idea: use whatever way you already record composing a unit when you add partial products.\n\nTIMING: 10 minutes: 1 minute quiet think, 1 minute partner discussion, share and record, then synthesis.\n\nTEACHER SAYS:\n“What do you notice? What do you wonder?”\n“Discuss your thinking with your partner.”\n“In both examples, the same numbers are added up. How would you explain what happens when adding the tens and hundreds?”\n“How does place value help us understand what the additional 1s represent?”\n“When you add up partial products, keep track of the composed units in a way that makes sense to you.”\n\nANTICIPATED RESPONSES:\n• Students may notice: the numbers that are added up are the same in each problem but their order is different. Some columns have little 1s. In both problems, there is a small 1 written in the hundreds and thousands place.\n• Students may wonder: Why is there a 1 in the hundreds (or thousands) column? What does the 1 in the hundreds (or thousands) column represent? Does it matter how you record the work?\n• Add 5 tens and 5 tens to get 10 tens, which is 1 hundred or 100. Show that 100 with 0 in the tens place and either record a 1 at the top. To add the hundreds, 300 + 700 + 100 = 1,100, so record 1 in the hundreds place and then show that we also have 1,000 to add.\n• If the 1 is in the hundreds column, it represents 100. If it is in the thousands column, it represents 1,000.\n\nDIFFERENTIATION AND SUPPORT:\n• Groups of 2. Both columns are a redrawn version of the IM handwritten image: 14,000 + 700 + 350 + 56 and 2,158 × 7, both 15,106. Check against the IM image on your teacher guide.\n\nCALLOUTS: IM routine: Notice and Wonder. Building Toward 4.NBT.B.5. MP7 look for and make use of structure."}, {"img": "_hub/slides/Math_U2_L10_Partial_Products_2/s004.jpg", "title": "Activity 1", "notes": "PURPOSE: Get Ready · Do · Done send-off into Activity 1 (Ward & Jacobsen, GDD pp. 74–79). It covers the student work in this activity only; a second GDD slide comes before Activity 2.\n\nTIMING: 2 minutes, then start the timer.\n\nCLICKS: Click 1: Done. Click 2: Do. Click 3: Get Ready. (Right to left.)\n\nTEACHER SAYS:\n“Put on your future glasses. When you are done, every step of Tyler's method is explained, your draft names the place value of each digit, and 31 × 15 is solved with a diagram that matches.”\n“Now the Do mat. First, make sense of Tyler's 64 × 87 on your own, 3 to 4 minutes. We pause at the halfway point for partner talk. Then share, listen and revise. Then Problem 2 with a diagram to check.”\n“Last, Get Ready. Activity 1 page, pencil, colored pencils and your journal. Sit beside your partner and clear everything else.”\n“If you get stuck, then reread the problem, look at the diagram or the steps above it, and ask your partner what each number is worth.”\n“I will set the timer for the halfway point.”\n\nDIFFERENTIATION AND SUPPORT:\n• The step times are a suggested split of the 25-minute activity. Adjust to your class.\n• Set the timer for the halfway point, not the end (GDD p. 79).\n• The Do times come from the IM guide for Activity 1. There is no Day 10 lesson plan in the project yet.\n\nCALLOUTS: EF: Get Ready · Do · Done (Ward & Jacobsen)."}, {"img": "_hub/slides/Math_U2_L10_Partial_Products_2/s005.jpg", "title": "Activity 1", "notes": "PURPOSE: Activity 1, Problem 1. Students make sense of work where the partial products are recorded but nothing shows where each came from.\n\nTIMING: 3–4 minutes independent work time, then structured partner discussion (next slide).\n\nCLICKS: Tyler's algorithm shows first. Click 1: the question. Click 2: the partner-share prompt.\n\nTEACHER SAYS:\n“Find the value of 64 × 87 and share your reasoning with a partner.”\n“Take a few minutes to make sense of Tyler's calculation. Be prepared to explain your thinking.”\n\nANTICIPATED RESPONSES:\n• 28 is the product of 7 in 87 and 4 in 64.\n• 420 is the product of 7 in 87 and 60 in 64.\n• 320 is the product of 80 in 87 and 4 in 64.\n• 4,800 is the product of 80 in 87 and 60 in 64.\n• 5,568 is the sum of the four partial products above it.\n\nWATCH FOR / MISCONCEPTIONS:\n• Students who think 320 is 8 × 4 = 32 with a stray zero. Ask: what is the 8 worth in 87?\n\nDIFFERENTIATION AND SUPPORT:\n• Representation (Internalize Comprehension): offer a partially completed version of the itemized steps: four copies of 64 × 87, each with one partial product written underneath in its color. Students highlight the digits in each step with green, yellow, red and purple pencils and write the matching expression next to each partial product.\n\nCALLOUTS: IM routine: MLR1 Stronger and Clearer Each Time. Advances: reading, writing. Rosenshine Principle 4: provide models."}, {"img": "_hub/slides/Math_U2_L10_Partial_Products_2/s006.jpg", "title": "Activity 1", "notes": "PURPOSE: MLR1 Stronger and Clearer Each Time. Students refine their explanation of Tyler's calculation with feedback from more than one partner.\n\nTIMING: 2 minutes structured partner discussion, repeat with 1–2 different partners, then 2–3 minutes independent revision.\n\nCLICKS: Clicks 1–4: each step of the routine. Click 5: the sentence starters (display them to support conversation).\n\nTEACHER SAYS:\n“Share your analysis of Tyler's calculation with a partner. Take turns being the speaker and the listener. If you are the speaker, share your ideas and writing so far. If you are the listener, ask questions and give feedback to help your partner improve their work.”\n“Revise your initial draft based on the feedback you got from your partners.”\n\nDIFFERENTIATION AND SUPPORT:\n• Consider displaying the prompts: “Can you explain how multiplying ___ and ___ gives ___?” and “Can you use the phrase ‘partial products’ in your explanation?”\n\nFORMATIVE ASSESSMENT: Listen for revised drafts that name the place value of each digit (80, not 8).\n\nCALLOUTS: MLR1 Stronger and Clearer Each Time (IM). Collaborators · Reliable: the listener's job is to help the speaker catch an error."}, {"img": "_hub/slides/Math_U2_L10_Partial_Products_2/s007.jpg", "title": "Activity 1", "notes": "PURPOSE: Problem 2. Students apply Tyler's method to a new problem and check it with a diagram.\n\nTIMING: 5 minutes independent work time.\n\nTEACHER SAYS:\n“Now try using Tyler's method to complete the last problem and use a diagram to check your work.”\n\nANTICIPATED RESPONSES:\n• 31 × 15 = 465. Partial products: 5 (1 × 5), 150 (30 × 5), 10 (1 × 10), 300 (30 × 10). Sum 465.\n• Diagram: 30 and 1 across the top, 10 and 5 down the side. 10 × 30 = 300, 10 × 1 = 10, 5 × 30 = 150, 5 × 1 = 5.\n\nWATCH FOR / MISCONCEPTIONS:\n• Students who record 15 for 3 × 5 (ones and tens mixed) or 3 for 30 × 10: partial products without place value.\n\nDIFFERENTIATION AND SUPPORT:\n• Students keep their color-coded Tyler page (64 × 87) beside them.\n\nFORMATIVE ASSESSMENT: Problem-Solving Conferring: all four partial products recorded and aligned by place value before adding."}, {"img": "_hub/slides/Math_U2_L10_Partial_Products_2/s008.jpg", "title": "Activity 1", "notes": "PURPOSE: Activity 1 Synthesis. Itemise each step with color coding and connect each partial product to its part of the diagram.\n\nTIMING: About 5 minutes.\n\nCLICKS: Clicks 1–4: each partial product appears with its matching part of the diagram (green, yellow, red, blue). Click 5: the total. Click 6: the question about the small 1.\n\nTEACHER SAYS:\n“Why did Tyler record a small 1 in the thousands place?”\n\nDISCUSSION PROMPTS:\n• Which part of the diagram does 4,800 come from? (80 × 60, the large blue part.)\n• Where would a missing partial product show up in the diagram?\n\nANTICIPATED RESPONSES:\n• It shows that we composed a new thousand when adding the values in the hundreds place because 15 hundreds is composed of 1 thousand and 5 hundreds.\n\nDIFFERENTIATION AND SUPPORT:\n• Display a corresponding diagram for 64 × 87 and invite students to make connections to the algorithm (IM guide).\n\nFORMATIVE ASSESSMENT: Can students name each partial product as tens × tens, tens × ones, and so on?\n\nCALLOUTS: Rosenshine Principle 4: provide models. Rosenshine Principle 2: small steps. The IM synthesis colors: green, yellow, red, blue. Tyler's second partial product is 420 (7 × 60)."}, {"img": "_hub/slides/Math_U2_L10_Partial_Products_2/s009.jpg", "title": "Activity 2", "notes": "PURPOSE: Get Ready · Do · Done send-off into Activity 2 (Ward & Jacobsen, GDD pp. 74–79).\n\nTIMING: 2 minutes, then start the timer.\n\nCLICKS: Click 1: Done. Click 2: Do. Click 3: Get Ready. (Right to left.)\n\nTEACHER SAYS:\n“Put on your future glasses. When you are done, you have found two products with all four partial products lined up, you have named Han's errors, and you have fixed 81 × 47.”\n“Now the Do mat. With your partner, find one product each, 3 to 4 minutes. Then we pause together. Then Han's mishap on your own, 3 to 4 minutes.”\n“Now Get Ready: Activity 2 page, pencil, colored pencils, your Tyler page. Clear everything else.”\n“If you get stuck on a partial product, then ask: what are the two digits being multiplied worth?”\n“Timer is set for the halfway point.”\n\nDIFFERENTIATION AND SUPPORT:\n• Set the timer for the halfway point, not the end (GDD p. 79).\n• The Do times come from the IM guide (3–4 minutes partner work, discussion, 3–4 minutes independent work). There is no Day 10 lesson plan in the project yet.\n\nCALLOUTS: EF: Get Ready · Do · Done (Ward & Jacobsen)."}, {"img": "_hub/slides/Math_U2_L10_Partial_Products_2/s010.jpg", "title": "Activity 2", "notes": "PURPOSE: Problem 1. Partners each find one product. Because the same two numbers are multiplied, the answers match and the partial products appear in a different order.\n\nTIMING: 3–4 minutes partner work time.\n\nTEACHER SAYS:\n“Work with your partner on the first problem. Each partner should find the value of one product.”\n(Pause for discussion; select a group whose calculations yield the same product to display their work.)\n“Should the calculations show the same result? Why or why not?”\n“How are the two calculations different?”\n“Does it matter which number is listed first and which is listed second?”\n\nANTICIPATED RESPONSES:\n• Yes, because the same two numbers are being multiplied.\n• The partial products are written in different orders.\n• No.\n• 19 × 32 = 608: 18, 20, 270, 300. 32 × 19 = 608: 18, 270, 20, 300. Same four partial products in a different order.\n\nDIFFERENTIATION AND SUPPORT:\n• MLR8 Discussion Supports: display sentence frames: “___ and ___ are the same/alike because …” and “Why did you …?”\n\nCALLOUTS: IM Activity 2. MP3 critique the reasoning of others. Commutativity of multiplication seen in the partial products."}, {"img": "_hub/slides/Math_U2_L10_Partial_Products_2/s011.jpg", "title": "Activity 2", "notes": "PURPOSE: Problem 2. Students analyze a common error: multiplying the digits and ignoring their place value (“9 times 2 is 18 and 9 times 3 is 27”). A diagram next to the vertical notation helps show how the place value of each digit changes each partial product.\n\nTIMING: 3–4 minutes independent work time.\n\nCLICKS: Han's work shows first. Click 1: question a. Click 2: question b.\n\nTEACHER SAYS:\n“Complete the last problem independently.”\n“In the Lesson Synthesis, let's analyze different ways to keep track of partial products and share how we can learn from Han's miscalculation.”\n\nANTICIPATED RESPONSES:\n• Han found 7 × 5 instead of 7 × 50. He also found 40 × 5 instead of 40 × 50. The second and fourth partial products should be 350 and 2,000, not 35 and 200.\n• Correct computation: 7, 560, 40, 3,200 (the partial products); 81 × 47 = 3,807.\n\nWATCH FOR / MISCONCEPTIONS:\n• Han's own work in the guide: 7, 56, 40, 320, total 423. Students who say only “the answer is wrong” without naming which partial product.\n• Monitor for students who record the partial products and the newly composed hundred in different ways to correct Han's mishap.\n\nDIFFERENTIATION AND SUPPORT:\n• To help students see that the place value of the digits impacts each partial product, consider displaying a diagram that shows partial products alongside the vertical notation (IM guide).\n• The slide shows Han's handwritten work redrawn with typed digits. Check it against your teacher guide.\n\nFORMATIVE ASSESSMENT: Sort responses: names the specific partial products that are wrong / says “wrong answer” only / not yet.\n\nCALLOUTS: MP3 construct viable arguments and critique the reasoning of others."}, {"img": "_hub/slides/Math_U2_L10_Partial_Products_2/s012.jpg", "title": "Lesson Wrap Up", "notes": "PURPOSE: Lesson Synthesis. Students analyze a corrected sample next to Han's miscalculation of 81 × 47, and use estimation to judge reasonableness.\n\nTIMING: 10 minutes.\n\nCLICKS: Click 1: the reasonableness question. Click 2: the reasoning that Han's answer is too low.\n\nTEACHER SAYS:\n“Today we used partial products in an algorithm to multiply pairs of two-digit numbers. We wrote expressions and equations to help us find and keep track of the partial products as we were multiplying. Sometimes when adding partial products we also needed to keep track of a newly composed hundred.”\n“Let's look at strategies to correct Han's mishap with solving 81 × 47.”\n(Display one example of student work side by side with Han's miscalculation.)\n“Before we analyze this sample closely, can you tell whether the answer is correct or seems more reasonable than Han's work? Why or why not?”\n(Select students to explain each step in the computation and any questions the sample raises. Consider recording the factors for each partial product and drawing a diagram.)\n(Display a different calculation for 81 × 47 side by side with the work that was discussed.)\n“How does this work keep track of partial products and their sum in a different way?”\n\nDISCUSSION PROMPTS:\n• Reiterate the importance of paying attention to the place value of each digit being multiplied as we find and record the partial products.\n\nANTICIPATED RESPONSES:\n• Han's answer was too low because 80 × 40 = 3,200, so that means the correct answer is greater than 3,200.\n\nDIFFERENTIATION AND SUPPORT:\n• Display student work from Activity 2 side by side with Han's. The slide holds the reasonableness question and answer only; use the document camera for the two calculations.\n\nFORMATIVE ASSESSMENT: Revisit the learning target. Which students named the place value of each digit?\n\nCALLOUTS: Rosenshine Principle 6: check for understanding. HOW: where did checking a partner's partial products help us catch Han's error?"}, {"img": "_hub/slides/Math_U2_L10_Partial_Products_2/s013.jpg", "title": "Cool Down", "notes": "PURPOSE: Cool-down. Independent check: students choose a strategy and record all partial products by place value.\n\nTIMING: 5 minutes.\n\nTEACHER SAYS:\n“Find the value of 15 × 43. Show your reasoning.”\n\nANTICIPATED RESPONSES:\n• 645. Samples: 15 × 40 + 15 × 3 = 600 + 45 = 645. Or the algorithm: 15, 30, 200, 400 → 645.\n\nWATCH FOR / MISCONCEPTIONS:\n• Responding to Student Thinking (IM): students multiply the digits without accounting for their place value (for example, treating 4 and 1 as ones, rather than 4 tens and 1 ten), resulting in inaccurate partial products.\n\nDIFFERENTIATION AND SUPPORT:\n• Next Day Support (IM): before the Warm-up, have students discuss in small groups the partial products for this problem and this specific error.\n• Prior-Unit Support: Day 9, algorithm with a one-digit factor.\n\nFORMATIVE ASSESSMENT: Sort: correct with all partial products / correct with partial products not tied to place value / place value error.\n\nCALLOUTS: Standard 4.NBT.B.5."}]}, "Math U2 L11_Partial Products and the Standard Algorithm.pptx": {"name": "Math U2 L11_Partial Products and the Standard Algorithm.pptx", "slug": "Math_U2_L11_Partial_Products_and_the_Standard_Algorithm", "pptx": null, "pdf": null, "sprite": "_hub/slides/Math_U2_L11_Partial_Products_and_the_Standard_Algorithm/sprite.jpg", "tw": 192, "th": 108, "landscape": true, "slides": [{"img": "_hub/slides/Math_U2_L11_Partial_Products_and_the_Standard_Algorithm/s001.jpg", "title": "Partial Products and the Standard Algorithm", "notes": "PURPOSE: Open Day 11 (IM Grade 4, Unit 6, Lesson 11) and set the split-screen intentions.\n\nTIMING: 1 minute\n\nTEACHER SAYS:\n“Today we put two recordings of the same problem side by side: the partial products we have been writing, and a shorter way called the standard algorithm. Being persistent means we trace each step of the short way back to a partial product until we trust it.”\n\nDISCUSSION PROMPTS:\n• WHAT (Day 11 card): As mathematicians, what do the standard algorithm's steps have in common with the partial products we've been recording?\n• HOW (Thinkers · Persistent): As thinkers, how can being persistent in tracing each algorithm step back to a partial product help us trust the shortcut?\n\nCALLOUTS: Standard 4.NBT.B.5. Card tags: NBT.5, IM L11. IM timeline: Warm-up 10, Activity 1 20, Activity 2 15, Lesson Synthesis 10, Cool-down 5. Students are not expected to use the standard algorithm this year; they build toward it for IM Grade 5."}, {"img": "_hub/slides/Math_U2_L11_Partial_Products_and_the_Standard_Algorithm/s002.jpg", "title": "Learning Target", "notes": "PURPOSE: Name the learning target (verbatim from the Day 11 card) and the Problem-Solving Conferring look-for.\n\nTIMING: 1 minute\n\nCLICKS: Click 1: the look-for.\n\nTEACHER SAYS:\n“Read the target with me. Today's check: can I point to where each step of the short way matches a partial product?”\n\nFORMATIVE ASSESSMENT: Problem-Solving Conferring (Day 11 card): can students point to where the standard algorithm's steps match the partial products they'd get?\n\nCALLOUTS: IM Grade 4 does not require the standard algorithm. Assure students they do not need to use any particular method."}, {"img": "_hub/slides/Math_U2_L11_Partial_Products_and_the_Standard_Algorithm/s003.jpg", "title": "Warm Up", "notes": "PURPOSE: Number Talk. Students decompose factors by place value to multiply a one-digit number by a multi-digit number mentally. It sets up today's work on the value of digits.\n\nTIMING: 10 minutes: about 1 minute quiet think per expression, then record answers and strategies.\n\nCLICKS: Clicks 1–4: one expression at a time. Click 5: the connections question. Keep each expression and its work displayed.\n\nTEACHER SAYS:\n“Give me a signal when you have an answer and can explain how you got it.”\n“What connections or relationships do you see between each expression?”\n\nDISCUSSION PROMPTS:\n• Students may notice that multiplying the ones place gives 5, 10, 15 (a pattern). Ask: where does the 15 go in 5 × 203?\n\nANTICIPATED RESPONSES:\n• 505: 5 × 100 and 5 × 1, and 500 + 5 = 505.\n• 510: 5 × 102 is 5 more than 5 × 101, so it is 5 more than 505, which is 510.\n• 1,015: 5 × 200 is 1,000 and 5 × 3 is 15, so 5 × 203 is 1,015.\n• 2,020: 404 is 4 times 101, 5 × 404 is 4 times 505, or 4 × 505, which is 2,020.\n• Connections: each problem involves one more group of 5, or sets of 100 more.\n\nDIFFERENTIATION AND SUPPORT:\n• Record answers and strategy on the board under each expression. Engagement support: remind students they are doing mental math, so there is no need to write.\n\nCALLOUTS: IM routine: Number Talk. Rosenshine Principle 3: ask questions. MP7."}, {"img": "_hub/slides/Math_U2_L11_Partial_Products_and_the_Standard_Algorithm/s004.jpg", "title": "Activity 1", "notes": "PURPOSE: Get Ready · Do · Done send-off into Activity 1 (Ward & Jacobsen, GDD pp. 74–79). It covers the student work in this activity only; a second GDD slide comes before Activity 2.\n\nTIMING: 2 minutes, then start the timer.\n\nCLICKS: Click 1: Done. Click 2: Do. Click 3: Get Ready. (Right to left.)\n\nTEACHER SAYS:\n“Put on your future glasses. When you are done, you can say how Kiran's and Diego's algorithms are alike and different, how Kiran found 2,139, and you found two products with Kiran's way.”\n“Now the Do mat. With your partner, Kiran and Diego, about 3 minutes. We pause at the halfway point. Then 212 × 4 and 3 × 4,132 on your own, 3 minutes. Then talk with your partner for 2 minutes.”\n“Last, Get Ready. Activity 1 page, pencil and blank paper. Sit beside your partner and clear everything else.”\n“If you get stuck, then reread the problem, look at the diagram or the steps above it, and ask your partner what each number is worth.”\n“I will set the timer for the halfway point.”\n\nDIFFERENTIATION AND SUPPORT:\n• The step times follow the IM guide. Adjust to your class.\n• Set the timer for the halfway point, not the end (GDD p. 79).\n• The Do times come from the IM guide for Activity 1 (3 minutes partner discussion, 3 minutes independent, 2 minutes partner). There is no Day 11 lesson plan in the project yet.\n\nCALLOUTS: EF: Get Ready ·
