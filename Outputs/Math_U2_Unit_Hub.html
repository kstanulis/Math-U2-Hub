ou partial-quotients evidence before the Checkpoint.\n\nPRIOR-UNIT SUPPORT\nStudents who lose track of the stack: Day 17 (IM L17–L18, partial quotients). Students unsure of multiples of 4: Math Unit 1, Section A (factors and multiples).\n\nFOR TOMORROW\nUse the Cool-down and the Hearts and Seats work to build the Day 19 check-in group: students with no recording method they trust, and students who calculate a remainder but can't say what to do with it."}]}, "Math U2 L19_Checkpoint_Division_with_Remainders.pptx": {"name": "Math U2 L19_Checkpoint_Division_with_Remainders.pptx", "slug": "Math_U2_L19_Checkpoint_Division_with_Remainders", "pptx": null, "pdf": null, "sprite": "_hub/slides/Math_U2_L19_Checkpoint_Division_with_Remainders/sprite.jpg", "tw": 192, "th": 108, "landscape": true, "slides": [{"img": "_hub/slides/Math_U2_L19_Checkpoint_Division_with_Remainders/s001.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L19_Checkpoint_Division_with_Remainders/s002.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L19_Checkpoint_Division_with_Remainders/s003.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L19_Checkpoint_Division_with_Remainders/s004.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L19_Checkpoint_Division_with_Remainders/s005.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L19_Checkpoint_Division_with_Remainders/s006.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L19_Checkpoint_Division_with_Remainders/s007.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L19_Checkpoint_Division_with_Remainders/s008.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L19_Checkpoint_Division_with_Remainders/s009.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L19_Checkpoint_Division_with_Remainders/s010.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L19_Checkpoint_Division_with_Remainders/s011.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L19_Checkpoint_Division_with_Remainders/s012.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L19_Checkpoint_Division_with_Remainders/s013.jpg", "title": "", "notes": ""}]}}, "unassigned": [], "package": true}</script>
<script>
const DATA = JSON.parse(document.getElementById('hubdata').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L = DATA.lessons, byId = Object.fromEntries(L.map(l => [l.id, l]));
const partById = Object.fromEntries(DATA.parts.map(p => [p.id, p]));
const cpById = Object.fromEntries(DATA.checkpoints.map(c => [c.id, c]));
const textById = Object.fromEntries(DATA.texts.map(t => [t.id, t]));
const resById = Object.fromEntries(DATA.resources.map(r => [r.id, r]));
const rubById = Object.fromEntries(DATA.rubrics.map(r => [r.id, r]));
const sgById = Object.fromEntries(DATA.groups.map(g => [g.id, g]));
const pcolor = id => `var(--${id})`;

// ---------- per-browser state (taught ticks, notes) ----------
const store = {
  get(k, d){ try { const v = localStorage.getItem('g4m2.' + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('g4m2.' + k, JSON.stringify(v)); } catch(e){} }
};
let taught = store.get('taught', {});
let notes = store.get('notes', {});

// ---------- small helpers ----------
const stdChip = (code, kind) => `<a class="chip std ${kind === 'a' ? 'a' : ''}" href="#/standard/${code}" title="${esc(DATA.standards[code]?.name || '')}${kind === 'a' ? ' — assessed' : ''}">${code}${kind === 'a' ? ' ◆' : ''}</a>`;
const stdChips = std => Object.entries(std || {}).map(([c, k]) => stdChip(c, k)).join('');
const fileLink = f => `<a class="file ${f.ok ? '' : 'missing'}" href="${f.href}" target="_blank" rel="noopener" title="${esc(f.dir)}"><span class="ext ${f.ext}">${f.ext}</span><span>${esc(f.name)}${f.ok ? '' : ' <em class="small">(missing)</em>'}</span></a>`;
const webLink = ([name, url]) => `<a class="file" href="${esc(url)}" target="_blank" rel="noopener"><span class="ext web">web</span><span>${esc(name)}</span></a>`;
const lessonName = l => `Day ${l.day}`;
const lessonsInPart = pid => L.filter(l => l.part === pid);
const deck = name => name ? DATA.decks[name] : null;

function lessonCard(l){
  const d = deck(l.deck);
  return `<a class="lcard" href="#/lesson/${l.id}">
    <div class="n"><small>DAY</small>${esc(String(l.day))}${taught[l.id] ? '<span class="t">✓</span>' : ''}</div>
    <div class="b"><div class="ti">${esc(l.title)}</div>
      ${l.targets[0] ? `<div class="tg">“${esc(l.targets[0])}”</div>` : `<div class="tg">${esc(l.target_note || l.sq)}</div>`}
      <div class="card-line">${esc(l.card)}${l.sub ? ' · deck: ' + esc(l.sub) : ''}</div>
      <div class="chips">${stdChips(l.std)}
        ${d ? `<span class="chip deck">▶ ${d.slides.length} slides</span>` : '<span class="chip none">no deck</span>'}
        ${l.plan.length ? `<span class="chip plan">lesson plan</span>` : ''}
        ${(l.docs || []).length ? `<span class="chip plan">📄 ${l.docs.length} guide${l.docs.length > 1 ? 's' : ''} & pages</span>` : ''}
        ${l.cp ? `<span class="chip cp">${esc(cpById[l.cp]?.kind.split(' (')[0] || 'assessment')}</span>` : ''}
        ${(l.sg || []).length ? `<span class="chip" style="background:var(--gold-light);color:#8a5a12">small group</span>` : ''}
      </div></div></a>`;
}

// ---------- slide viewer ----------
let viewerCount = 0;
function viewerHTML(name, opts = {}){
  const d = deck(name);
  if (!d) return `<div class="empty">No deck for this lesson yet.<br><span class="small">Name the .pptx “Math U2 L## …” (## = the day), put it in <b>Resources/OneDrive</b> or <b>Resources/Math Unit 2 Resources/Current MAth U2 Slide Decks</b>, then run <code>python3 build_hub.py --export</code> in Outputs/_hub.</span></div>`;
  if (!d.slides.length) return `<div class="empty">Slides for <b>${esc(d.name)}</b> haven’t been exported yet.<br>run <code>python3 build_hub.py --export</code> in Outputs/_hub.</div>`;
  const id = 'v' + (++viewerCount);
  const hasNotes = d.slides.some(s => s.notes);
  return `<div class="viewer ${d.landscape ? '' : 'portrait'}" id="${id}" data-deck="${esc(name)}" data-i="0" tabindex="0" aria-label="Slide viewer: ${esc(d.name)}">
    <div class="vtop"><span class="ttl">${esc(opts.title || d.name.replace(/\.pptx$/, ''))}</span>
      ${hasNotes ? `<button class="vbtn ${opts.notes === false ? '' : 'on'}" data-act="notes">Speaker notes</button>` : ''}
      <button class="vbtn" data-act="full">⛶ Present</button>
      ${d.pdf ? `<a class="vbtn" href="${d.pdf}" target="_blank">PDF</a>` : ''}
      ${d.pptx ? `<a class="vbtn" href="${d.pptx}">Open .pptx</a>` : ''}</div>
    <div class="stage"><img alt=""><button class="arrow l" data-act="prev" aria-label="Previous slide">‹</button><button class="arrow r" data-act="next" aria-label="Next slide">›</button><span class="counter"></span></div>
    ${hasNotes ? `<div class="spk" ${opts.notes === false ? 'hidden' : ''}><div class="lab">Speaker notes</div><div class="txt"></div></div>` : ''}
    <div class="thumbs">${d.slides.map((s, i) => `<button data-go="${i}" title="${i + 1}. ${esc(s.title)}" aria-label="Slide ${i + 1}"><span class="th" style="width:${d.tw / 2}px;height:${d.th / 2}px;background-image:url('${d.sprite}');background-size:${d.slides.length * d.tw / 2}px ${d.th / 2}px;background-position:-${i * d.tw / 2}px 0"></span></button>`).join('')}</div>
  </div>`;
}
function showSlide(v, i){
  const d = deck(v.dataset.deck), n = d.slides.length;
  i = Math.max(0, Math.min(n - 1, i)); v.dataset.i = i;
  const s = d.slides[i];
  const img = v.querySelector('.stage img'); img.src = s.img; img.alt = `Slide ${i + 1}: ${s.title}`;
  v.querySelector('.counter').textContent = `${i + 1} / ${n}`;
  const t = v.querySelector('.spk .txt'); if (t) t.textContent = s.notes || '— no notes on this slide —';
  v.querySelectorAll('.thumbs button').forEach((b, j) => b.classList.toggle('on', j === i));
  const on = v.querySelector(`.thumbs button[data-go="${i}"]`); if (on) on.scrollIntoView({block:'nearest', inline:'nearest'});
  if (i + 1 < n) { const pre = new Image(); pre.src = d.slides[i + 1].img; }
}
let docCount = 0;
function docsHTML(docs){
  const ok = (docs || []).filter(([, f]) => f.ok && f.ext === 'pdf');
  const other = (docs || []).filter(([, f]) => !(f.ok && f.ext === 'pdf'));
  if (!ok.length) return `<div class="empty">No teacher guide or student pages for this day in the project yet.<br><span class="small">Add the PDFs to <b>Resources/Math Unit 2 Resources</b> and list them under this day in <code>_hub/hub_data.py</code>.</span></div>${other.map(([, f]) => fileLink(f)).join('')}`;
  const id = 'doc' + (++docCount);
  return `<div class="docbar"><div class="tabs">${ok.map(([n, f], i) => `<button class="${i ? '' : 'on'}" data-doc="${id}" data-src="${f.href}">${esc(n)}</button>`).join('')}</div>
    <a id="${id}-open" href="${ok[0][1].href}" target="_blank" rel="noopener">Open in new tab ↗</a></div>

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-doc]'); if (!b) return;
  b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById(b.dataset.doc).src = b.dataset.src;
  document.getElementById(b.dataset.doc + '-open').href = b.dataset.src;
});
function initViewers(){ document.querySelectorAll('.viewer').forEach(v => showSlide(v, 0)); }
document.addEventListener('click', e => {
  const v = e.target.closest('.viewer'); if (!v) return;
  const b = e.target.closest('[data-act],[data-go]'); if (!b) return;
  const i = +v.dataset.i;
  if (b.dataset.go !== undefined) showSlide(v, +b.dataset.go);
  else if (b.dataset.act === 'prev') showSlide(v, i - 1);
  else if (b.dataset.act === 'next') showSlide(v, i + 1);
  else if (b.dataset.act === 'notes') { const s = v.querySelector('.spk'); s.hidden = !s.hidden; b.classList.toggle('on', !s.hidden); }
  else if (b.dataset.act === 'full') { try { const r = document.fullscreenElement ? document.exitFullscreen() : (v.requestFullscreen || v.webkitRequestFullscreen).call(v); if (r && r.catch) r.catch(() => {}); } catch (err) {} }
  v.focus({preventScroll:true});
});
document.addEventListener('keydown', e => {
  const v = document.fullscreenElement || (document.activeElement?.classList.contains('viewer') ? document.activeElement : null);
  if (!v || !v.classList.contains('viewer')) return;
  if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); showSlide(v, +v.dataset.i + 1); }
  if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); showSlide(v, +v.dataset.i - 1); }
});

function renderNav(route){
  const cur = location.hash || '#/';
  const a = (href, html, cls = '') => `<a class="${cls} ${cur === href ? 'on' : ''}" href="${href}">${html}</a>`;
  let h = `<div class="nav-sec">Unit</div>${a('#/', '🏠 Unit overview')}`;
  h += `<div class="nav-sec">Lessons</div>`;
  for (const p of DATA.parts) {
    const ls = lessonsInPart(p.id);
    const done = ls.filter(l => taught[l.id]).length;
    h += a('#/part/' + p.id, `<span class="dot" style="background:${pcolor(p.id)}"></span>${esc(p.label)}<span class="tick">${done}/${ls.length}</span>`, 'partlink');
    const open = route.part === p.id;
    if (open) for (const l of ls) h += a('#/lesson/' + l.id, `<span class="num">${esc(String(l.day))}</span><span>${esc(l.sub || l.title)}</span>${taught[l.id] ? '<span class="tick">✓</span>' : ''}`, 'les');
  }
  h += `<div class="nav-sec">Across the unit</div>
    ${a('#/standards', '🎯 Standards & success criteria')}${a('#/assessments', '📌 Checkpoints & screener')}${a('#/groups', '👥 Small-group tasks')}
    ${a('#/texts', '📚 Shared texts & resources')}${a('#/files', '🗂 All files & decks')}`;
  $('#nav').innerHTML = h;
}

  return `<div class="view"><div class="crumb"><a href="#/">Unit overview</a> › Small-group tasks</div>

    ${DATA.groups.length ? '' : `<div class="empty" style="margin-top:16px">No small-group tasks in the project yet.<br><span class="small">Once the OneDrive folder is downloaded, they are added to <code>SMALL_GROUPS</code> in <code>_hub/hub_data.py</code> and linked to their days and standards.</span></div>`}
    ${DATA.parts.map(p => { const gs = DATA.groups.filter(g => g.part === p.id); return gs.length ? `<section><h3><span class="dot" style="background:${pcolor(p.id)};width:12px;height:12px"></span>${esc(p.label)}</h3><div class="grid g2">${gs.map(g => `<a class="slink" href="#/group/${g.id}" style="background:#fff;border:1px solid var(--rule);padding:12px 14px"><b>${esc(g.title)}</b><small>${esc(g.desc.slice(0, 140))}${g.desc.length > 140 ? '…' : ''}</small><div class="chips" style="margin-top:6px">${g.std.map(s => stdChip(s)).join('')}</div></a>`).join('')}</div></section>` : ''; }).join('')}
  </div>`;
}
function viewGroup(id){
  const g = sgById[id]; if (!g) return notFound();
  const p = partById[g.part];
  return `<div class="view"><div class="crumb"><a href="#/">Unit overview</a> › <a href="#/groups">Small-group tasks</a> › ${esc(g.title)}</div>
    <div class="eyebrow2" style="color:${pcolor(p.id)}">${esc(p.label)}${g.lessons.length ? ' · ' + g.lessons.map(id => `<a href="#/lesson/${id}">Day ${byId[id].day}</a>`).join(', ') : ''}</div>
    <h2 class="big">${esc(g.title)}</h2><div class="lead">${esc(g.desc)}</div>
    <div class="chips" style="margin-top:10px">${g.std.map(s => stdChip(s)).join('')}</div>
    <section class="two"><div class="card"><div class="k eyebrow2" style="margin-bottom:6px">What’s inside</div>
      <table class="rub"><tbody>${g.groups.map(r => `<tr>${r.filter(Boolean).map(c => `<td>${byId[c] ? `<a href="#/lesson/${c}">${esc(c)}</a>` : esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div><div class="side-block"><h4>Files</h4>${g.files.map(fileLink).join('')}</div></div></section>
    ${g.decks.map(d => `<section><h3>${esc(d.replace(/\.pptx$/, ''))}</h3>${viewerHTML(d, {notes: false})}</section>`).join('')}
  </div>`;
}

function viewTexts(){
  return `<div class="view"><div class="crumb"><a href="#/">Unit overview</a> › Shared texts & resources</div>
    <h2 class="big">Shared texts & resources</h2><div class="lead">Shared and mentor texts, then routines, displays and Bridges pages used across the unit.</div>
    <section><h3>Shared & mentor texts</h3>${DATA.texts.length ? '' : '<div class="empty">No shared or mentor texts in the project yet. They come in with the OneDrive folder.</div>'}<div class="grid g2">${DATA.texts.map(t => { const used = L.filter(l => (l.texts || []).includes(t.id)); return `<a class="slink" href="#/text/${t.id}" style="background:#fff;border:1px solid var(--rule);padding:12px 14px"><b>${esc(t.title)}</b>${t.author ? ` <span class="muted">— ${esc(t.author)}</span>` : ''}<small>${esc(t.kind)} · ${esc(t.where)}${used.length ? ' · ' + used.map(lessonName).join(', ') : ''}</small></a>`; }).join('')}</div></section>
    <section><h3>Teaching resources</h3><div class="grid g2">${DATA.resources.map(r => { const used = L.filter(l => (l.res || []).includes(r.id)); return `<div class="card" id="r-${r.id}"><b>${esc(r.title)}</b><div class="small muted">${esc(r.kind)}${used.length ? ' · ' + used.map(l => `<a href="#/lesson/${l.id}">${esc(lessonName(l))}</a>`).join(', ') : ''}</div>
      ${r.body.map(b => `<p class="small" style="margin-top:6px">${esc(b)}</p>`).join('')}<div style="margin-top:8px">${r.files.map(fileLink).join('')}${r.links.map(webLink).join('')}</div></div>`; }).join('')}</div></section>
  </div>`;
}
function viewText(id){
  const t = textById[id]; if (!t) return notFound();
  const used = L.filter(l => (l.texts || []).includes(id));
  const cps = DATA.checkpoints.filter(c => c.text === id);
  const pdfs = t.files.filter(f => f.ext === 'pdf' && f.ok);
  return `<div class="view"><div class="crumb"><a href="#/">Unit overview</a> › <a href="#/texts">Shared texts & resources</a> › ${esc(t.title)}</div>
    <div class="eyebrow2">${esc(t.kind)}</div><h2 class="big">${esc(t.title)}</h2>${t.author ? `<div class="lead">${esc(t.author)}</div>` : ''}
    <section class="two"><div class="card"><div class="row"><div class="k">Role in the unit</div>${esc(t.role)}</div><div class="row"><div class="k">Where it lives</div>${esc(t.where)}</div>
      ${t.copyright ? `<div class="flag">Copyrighted text — display or print from your original copy.</div>` : ''}</div>
      <div><div class="side-block"><h4>Used in</h4>${used.map(l => `<a class="slink" href="#/lesson/${l.id}"><b>${esc(lessonName(l))} — ${esc(l.title)}</b></a>`).join('') || '<div class="small muted">Not linked to a lesson.</div>'}${cps.map(c => `<a class="slink" href="#/assessments"><b>${esc(c.title)}</b><small>assessment text</small></a>`).join('')}</div>
      <div class="side-block"><h4>Files & links</h4>${t.files.map(fileLink).join('')}${t.links.map(webLink).join('') || (t.files.length ? '' : '<div class="small muted">No digital copy in the project.</div>')}</div></div></section>
    ${pdfs.length ? `<section><h3>Read it here</h3>${pdfs.length > 1 ? `<div class="tabs">${pdfs.map((f, i) => `<button class="${i ? '' : 'on'}" onclick="this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on');document.getElementById('pdfv').src='${f.href}'">${esc(f.name)}</button>`).join('')}</div>` : ''}<div class="pdfwrap"><iframe id="pdfv" src="${pdfs[0].href}" title="${esc(t.title)}"></iframe></div></section>` : ''}
  </div>`;
}

function viewFiles(){
  const allFiles = [];
  const add = (where, fs) => fs.forEach(f => allFiles.push([where, f]));
  L.forEach(l => add('Day ' + l.day, l.plan.concat(l.docs.map(d => d[1])))); DATA.unitFiles.forEach(([n, f]) => add(n, [f]));
  DATA.checkpoints.forEach(c => add(c.title, c.files)); DATA.rubrics.forEach(r => add(r.title, r.files));
  DATA.groups.forEach(g => add(g.title, g.files)); DATA.texts.forEach(t => add(t.title, t.files)); DATA.resources.forEach(r => add(r.title, r.files));
  const missing = allFiles.filter(([, f]) => !f.ok);
  const decks = Object.values(DATA.decks);
  const deckUse = name => L.filter(l => l.deck === name).map(l => 'Day ' + l.day).concat(DATA.groups.filter(g => g.decks.includes(name)).map(g => g.title));
  return `<div class="view"><div class="crumb"><a href="#/">Unit overview</a> › All files & decks</div>
    <h2 class="big">All files & decks</h2><div class="lead">Everything the hub links to. Files open from the project folder on this Mac.</div>
    ${missing.length ? `<div class="flag">${missing.length} linked file(s) not found: ${missing.map(([w, f]) => esc(f.name)).join(', ')}</div>` : ''}
    <section><h3>Slide decks <span class="count">${decks.length} decks · ${decks.reduce((s, d) => s + d.slides.length, 0)} slides</span></h3>
      <div class="grid g2">${decks.map(d => `<div class="file" style="cursor:default"><span class="ext pptx">pptx</span><span style="flex:1">${d.pptx ? `<a href="${d.pptx}">${esc(d.name)}</a>` : esc(d.name)}<br><span class="small muted">${d.slides.length} slides · ${deckUse(d.name).join(', ') || '<b>not assigned to a lesson</b>'}</span></span></div>`).join('')}</div></section>
    <section><h3>Teacher guides, student pages & lesson plans</h3>${L.filter(l => l.plan.length || l.docs.length).map(l => `<div style="margin-bottom:8px"><div class="small"><a href="#/lesson/${l.id}"><b>${esc(lessonName(l))}</b></a> ${esc(l.title)}</div>${l.docs.map(([n, f]) => fileLink(f)).join('')}${l.plan.map(fileLink).join('')}</div>`).join('')}</section>
    <section><h3>Unit documents</h3>${DATA.unitFiles.map(([n, f]) => fileLink(f)).join('')}</section>
    ${DATA.package ? `<section class="note"><b>Editable decks.</b> The .pptx files aren’t in this copy of the hub. Every slide and its speaker notes are shown here; ask Keith for the PowerPoint files.</section>` : ''}
    <section class="note" ${DATA.package ? 'hidden' : ''}><b>Adding or updating slides.</b> Name the .pptx “Math U2 L## …” where ## is the day (L01, L20), put it in <i>Resources/OneDrive</i> or the Current Slide Decks folder, then in Terminal run <code>cd "Outputs/_hub" &amp;&amp; python3 build_hub.py --export</code>. Changed decks re-export automatically; hidden slides are left out. Keynote needs a moment to load big decks; the script waits about 1 second per MB and retries once.</section>
    <section><h3>My lesson notes</h3><div class="card"><p class="small">Notes and “taught” ticks are saved in this browser only. Download them to keep a copy in the project.</p><button class="vbtn" style="background:var(--purple-deep);margin-top:8px" id="exportNotes">Download notes (.md)</button></div></section>
  </div>`;
}
const notFound = () => `<div class="view"><h2 class="big">Page not found</h2><a href="#/">Back to the overview</a></div>`;

// ---------- router ----------
function route(){
  const parts = (location.hash.replace(/^#\/?/, '') || '').split('/');
  const [kind, id] = parts;
  let html, r = {};
  if (!kind) html = viewHome();
  else if (kind === 'part') { html = viewPart(id); r.part = id; }
  else if (kind === 'lesson') { html = viewLesson(id); r.part = byId[id]?.part; }
  else if (kind === 'standards') html = viewStandards();
  else if (kind === 'standard') html = viewStandard(id);
  else if (kind === 'assessments') html = viewAssessments();
  else if (kind === 'groups') html = viewGroups();
  else if (kind === 'group') html = viewGroup(id);
  else if (kind === 'texts') html = viewTexts();
  else if (kind === 'text') html = viewText(id);
  else if (kind === 'files') html = viewFiles();
  else html = notFound();
  viewerCount = 0; docCount = 0;
  $('#main').innerHTML = html;
  renderNav(r);
  initViewers();
  bindLesson(kind === 'lesson' ? id : null);
  $('#side').classList.remove('open');
  const title = { lesson: byId[id] ? 'Day ' + byId[id].day + ' · ' + byId[id].title : '', part: partById[id]?.label, standard: id }[kind];
  document.title = (title ? title + ' — ' : '') + 'Math Unit 2 Hub';
  window.scrollTo(0, 0);
}
function bindLesson(id){
  const tb = $('#taughtBox');
  if (tb) tb.onchange = () => { if (tb.checked) taught[id] = new Date().toLocaleDateString(undefined, {month:'short', day:'numeric'}); else delete taught[id]; store.set('taught', taught); route(); };
  const nb = $('#noteBox');
  if (nb) nb.oninput = () => { notes[id] = nb.value; store.set('notes', notes); };
  const ex = $('#exportNotes');
  if (ex) ex.onclick = () => {
    const md = '# Math Unit 2 — lesson notes\n\n' + L.map(l => `## Day ${l.day} · ${l.title}\nTaught: ${taught[l.id] || '—'}\n\n${notes[l.id] || ''}\n`).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([md], {type:'text/markdown'})); a.download = 'Math_U2_lesson_notes.md'; a.click();
  };
}

// ---------- search ----------
const index = [
  ...L.map(l => ({h:'#/lesson/' + l.id, t:`Day ${l.day} · ${l.title}`, s:partById[l.part].label, x:['Day ' + l.day, l.card, l.title, ...l.targets, l.desc, l.tp, l.work, l.conf, l.assess, l.sq, l.case, l.asset, Object.keys(l.std).join(' ')].join(' ')})),
  ...DATA.texts.map(t => ({h:'#/text/' + t.id, t:t.title, s:'Text · ' + (t.author || t.kind), x:[t.title, t.author, t.role].join(' ')})),
  ...DATA.groups.map(g => ({h:'#/group/' + g.id, t:g.title, s:'Small-group task', x:[g.title, g.desc, g.groups.flat().join(' ')].join(' ')})),
  ...DATA.resources.map(r => ({h:'#/texts', t:r.title, s:'Resource', x:[r.title, r.kind, ...r.body].join(' ')})),
  ...DATA.stdOrder.map(c => ({h:'#/standard/' + c, t:`${c} — ${DATA.standards[c].name}`, s:'Standard', x:c + ' ' + DATA.standards[c].name + ' ' + DATA.standards[c].s3})),
  ...DATA.checkpoints.map(c => ({h:'#/assessments', t:c.title, s:'Assessment', x:c.title + ' ' + c.what.join(' ')})),
];
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase(), box = $('#results');
  if (q.length < 2) { box.style.display = 'none'; return; }
  const words = q.split(/\s+/);
  const hits = index.filter(i => words.every(w => (i.t + ' ' + i.x).toLowerCase().includes(w))).slice(0, 12);
  box.innerHTML = hits.map(i => `<a href="${i.h}">${esc(i.t)}<small>${esc(i.s)}</small></a>`).join('') || '<a>No matches</a>';
  box.style.display = 'block';
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#results').style.display = 'none'; });
$('#results').addEventListener('click', () => { $('#results').style.display = 'none'; $('#q').value = ''; });
$('#menuBtn').onclick = () => $('#side').classList.toggle('open');
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
