: "PURPOSE\nLesson Synthesis, IM L13 and L14 combined. Students compare the two situation types and connect area to multiplication and division.\n\nTIMING\n6 minutes.\n\nCLICKS\nClick 1: equal-size groups picture. Click 2: area picture. Click 3: question 1. Click 4: question 2.\n\nTEACHER SAYS (IM L13, verbatim)\n“Today we solved problems involving division of whole numbers. We thought about the kinds of division problems we were solving—whether we were trying to find the number of groups or the amount in each group.”\n\nTEACHER SAYS (IM L14, verbatim)\n“Today we used division to find side lengths of rectangles. For each rectangle, we knew the area and the length of one side and we used division to find the length of the other.”\n\nCOMPARE (suggested, not IM)\n“How are the two pictures alike? How are they different?” (Sample: Alike, both split a total into 7 equal parts and use a division equation with a divisor of 7. Different, the paletas picture shows 7 separate groups of 12; the mural is one rectangle 7 tiles wide and 27 tiles long with an area of 189.)\n\nQUESTIONS (IM L14, verbatim)\nClick 3. “What is the relationship between the side lengths and the area of a rectangle?” (The area is the product of the two side lengths.)\nClick 4. “How do we find the missing side length?” (Divide the area by the side length that we do know, or multiply one side length by different numbers until we find the area. We could divide or multiply in parts to find the missing side length.)\n\nOPTIONAL (IM L13 synthesis, if time allows)\nDisplay: “One-hundred four students are put into groups” with 104 ÷ 8 = ?. “In this situation, what questions could the equation represent?” (How many students are in each group if 104 students are put into 8 equal groups? How many groups can be made if 104 students are put into groups of 8?) “What does the value of 104 ÷ 8 mean?” (It depends on the question being answered: either the number of students or the number of groups.)\n\nSPLIT SCREEN\nBack to: As mathematicians, how is dividing into equal groups related to the multiplication we've already learned? “Where did being flexible help you start a division problem?”\n\nCONFERRING (card)\nCan students explain what makes a situation \"equal groups\" versus \"area,\" not just label it?"}, {"img": "_hub/slides/Math_U2_L15_Equal_Groups_and_Area_Division/s014.jpg", "title": "Cool Down", "notes": "PURPOSE\nIM L14 Cool-down, Sticky Notes on the Door (verbatim). One task, 5 minutes, independent. Addressing 4.MD.A.3, 4.NBT.B.6, 4.OA.A.3.\n\nTIMING\n5 minutes.\n\nCLICKS\nNone.\n\nABOUT THE VISUAL\nThe door picture is drawn for this deck (IM has no image for this cool-down).\n\nANSWER (IM)\n26 square notes. Sample: “I know that 9 × 20 = 180 and 9 × 6 = 54. 180 + 54 = 234, so it takes 20 + 6, or 26 notes to cover the height of the door.”\n\nRESPONDING TO STUDENT THINKING (IM)\nStudents show they understand the problem as a division or unknown side length problem, but find a solution other than 26 square sticky notes.\n\nNEXT-DAY SUPPORT (IM)\nAfter the Warm-up in the next lesson, pair students up to discuss their responses. (IM L13 adds: give students access to base-ten blocks. Day 16 uses base-ten blocks anyway.)\n\nPRIOR-UNIT SUPPORT (IM)\nGrade 3, Unit 2, Section A Concepts of Area Measurement.\n\nFORMATIVE ASSESSMENT (card)\nIM L13–L14 situation-sorting and diagramming tasks. Check: can students explain what makes this situation “area,” not just label it?"}]}, "Math U2 L16_Base_Ten_Blocks_and_Diagrams.pptx": {"name": "Math U2 L16_Base_Ten_Blocks_and_Diagrams.pptx", "slug": "Math_U2_L16_Base_Ten_Blocks_and_Diagrams", "pptx": null, "pdf": null, "sprite": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/sprite.jpg", "tw": 192, "th": 108, "landscape": true, "slides": [{"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s001.jpg", "title": "Base-Ten Blocks and Diagrams to Divide", "notes": "PURPOSE\nOpen Day 16: IM Unit 6, Lessons 15 and 16 combined. Blocks first (L15), then diagrams (L16): the same concrete-to-representational progression Part 1 used for multiplication.\n\nTIMING\n1 minute. Lesson: Warm-up 6 · Activity 1 10 · Activity 2 10 · Activity 3 13 · Lesson Synthesis 6 · Cool-down 5 = 50 minutes.\n\nCUT TO 50 MINUTES (from 70)\n• Activity 1: the MLR7 visual display and gallery walk are cut (about 10 minutes). Groups still answer IM’s “How was finding each quotient the same? How was it different?” at their tables.\n• Lesson Synthesis: the L15 Division Reflection (“How was using the base-ten blocks helpful…?”) is cut (4 minutes).\n• Warm-up: shortened from 8 to 6 minutes. The third synthesis question (can we tell if C and D are the same value?) moves to the notes as optional.\n• Activity 2 and Activity 3: work times trimmed by 1–2 minutes each (Activity 3 uses 4 minutes per question instead of IM’s 4–5 and 5).\n\nSPLIT-SCREEN (verbatim from the Day 16 sequence card)\n• WHAT: As mathematicians, how can breaking a dividend into place-value chunks — hundreds, tens, ones — make a division problem easier?\n• HOW (Researchers · Observant): As researchers, how can being observant of the patterns in our base-ten diagram help us divide more efficiently?\n\nWHAT WAS CHOSEN FROM IM L15 AND L16 (kept from the previous version of this deck)\n• Warm-up: L16 Which Three Go Together: Base-Ten Diagrams (replaces L15 What Do You Know about Base-Ten Blocks; its 324 question is an optional bridge).\n• Activity 1: L15 Activity 1, Blocks to Divide (488 ÷ 4, 104 ÷ 8), without the MLR7 display and gallery walk.\n• Activity 2: L16 Activity 1, Divide with Diagrams or Blocks (Priya: 64 ÷ 4, 117 ÷ 3).\n• Activity 3: L16 Activity 2, Help Noah Get Unstuck (235 ÷ 5, 432 ÷ 6).\n• Lesson Synthesis: L16 synthesis (712 ÷ 4).\n• Cool-down: L16 Find the Value of a Quotient (132 ÷ 4).\n• Not used: L15 Activity 2 (96 ÷ 4, 86 ÷ 2, 108 ÷ 9), the L15 Division Reflection cool-down, and the L15 Activity 1 display and gallery walk. L15 Activity 2 works as optional practice or a center.\n\nCARD DETAILS\n• Learning target: I can use base-ten blocks and diagrams to divide a multi-digit number.\n• Tags: NBT.6 · IM L15–L16. Addressing 4.NBT.B.6.\n• Conferring (card): Are students dividing each place-value chunk correctly before combining?\n• Assessment (card): IM L15–L16 block-and-diagram tasks.\n\nMATERIALS (IM)\nBase-ten blocks (each group of 3–4 needs 4 hundreds, 10 tens and 25 ones); math journals."}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s002.jpg", "title": "Learning Target", "notes": "PURPOSE\nThe learning target (verbatim from the Day 16 card) and the order of the day: blocks, then diagrams.\n\nTIMING\nUnder 1 minute (inside the Warm-up).\n\nCLICKS\nClick 1: First, base-ten blocks. Click 2: Then, base-ten diagrams.\n\nSUCCESS CRITERIA\nNot included: there is no Day 16 lesson plan and IM does not list success criteria.\n\nSUGGESTED TEACHER LANGUAGE (written for this deck)\n“Yesterday we found the missing side of a mural by breaking 189 into parts. Today we break a dividend into hundreds, tens and ones, first with blocks, then with drawings.”"}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s003.jpg", "title": "Warm Up", "notes": "PURPOSE\nIM L16 Warm-up, Which Three Go Together: Base-Ten Diagrams. Students analyze the shapes and the value each diagram shows, using language precisely (MP6). Building toward 4.NBT.B.6.\n\nTIMING\n3 minutes: 1 minute quiet think time, 2 minutes partner discussion (IM: 2–3).\n\nCLICKS\nNone.\n\nLAUNCH (IM, verbatim)\n• Groups of 2. Display image.\n“Pick 3 that go together. Be ready to share why they go together.”\n1 minute: quiet think time\n\nACTIVITY (IM)\n“Discuss your thinking with your partner.”\n2–3 minutes: partner discussion\n• Record responses.\n\nANTICIPATED RESPONSES (IM samples)\n• A, B, and C go together because they have a column with just a single square.\n• A, B, and D go together because they have tens.\n• A, C, and D go together because they show 111.\n• B, C, and D go together because they have 10 blocks.\n\nABOUT THE VISUAL\nRedrawn with shapes from the IM image: A = 1 hundred, 1 ten, 1 one. B = 11 tens, 1 one. C = 1 hundred, 11 ones. D = three groups of 3 tens and 7 ones. Check the piece counts against your IM page if you project the original.\n\nTEACHER MOVE\nListen for precise place-value language (MP6). Record each reason without ruling any grouping right or wrong.\n\nROSENSHINE\nPrinciple 1: Begin with a short review of previous learning."}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s004.jpg", "title": "Warm Up", "notes": "PURPOSE\nIM L16 Warm-up Activity Synthesis.\n\nTIMING\n3 minutes.\n\nCLICKS\nClick 1: question 2. (The legend and question 1 show first.)\n\nTEACHER SAYS (IM, verbatim)\n“How is it that A and C both show 111?” (If a small square represents 1, then a rectangle is 10 and a large square is 100. In A: 100 + 10 + 1 = 111. In C: 100 + 11 = 111.)\nClick 1. “How do we know that D also shows 111?” (Each group in D represents (3 × 10) + 7 or 37. Three groups of 37 makes 111.)\n• OPTIONAL, if time allows (cut from the slide to fit 50 minutes): “Suppose we don’t know what a small square represents except that it represents the same value in all diagrams. Can we tell if C and D represent the same value? How?” (Yes. We know that 10 small squares make 1 rectangle and 10 rectangles make 1 large square. In D, we’d have 21 small squares and 9 rectangles. Trading 10 small squares for a rectangle gives 10 rectangles and 11 small squares, which is equal to 1 large square and 11 small squares.)\n\nTEACHER MOVE\nPoint to the legend. Trading 10 small squares for 1 rectangle is the move students use all lesson. Name it: “exchange.”\n\nOPTIONAL BRIDGE (IM L15 Warm-up synthesis, verbatim)\n“Which blocks would we use to represent the number 324?” Then: “You have used base-ten blocks to represent large numbers. Today you are going to see how they can be helpful to divide larger numbers.”\n\nMLR8 (IM L16)\nUse verbal descriptions with gestures, drawings, or concrete objects to show how a base-ten block is equivalent to 10 ones blocks and how they are interchangeable."}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s005.jpg", "title": "Activity 1", "notes": "PURPOSE\nIM L15 Activity 1 launch. Students find quotients with base-ten blocks: one problem where decomposing a hundred or ten is not needed, and one where it is (MP7). Addressing 4.NBT.B.6.\n\nTIMING\nAbout 1 minute of the 10-minute activity.\n\nCLICKS\nNone.\n\nLAUNCH (IM, verbatim)\n• Groups of 3–4\n• Give each group at least 4 hundreds blocks, 10 tens blocks, and 25 ones blocks.\n“Work with your group to represent each expression with base-ten blocks, then find the quotient.”\n\nWHY THESE NUMBERS (IM)\nThere are not enough hundreds in 104 to divide into 8 equal groups but there are enough tens to put 1 ten in 8 equal groups. Then the 2 remaining tens can be broken into ones to complete the division."}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s006.jpg", "title": "Activity 1", "notes": "PURPOSE\nGet Ready · Do · Done send-off into Activity 1, Blocks to Divide (Ward & Jacobsen, GDD pp. 74–79).\n\nTIMING\nAbout 1 minute, then start the timer.\n\nCLICKS (right to left)\nClick 1: Done mat. Click 2: Do mat. Click 3: Get Ready mat.\n\nSTEP TIMES\nInferred. IM gives 5–6 minutes of group work for both problems; this slide splits it 3 + 3. The display and gallery walk are cut to fit 50 minutes. The ½ checkpoint is after 488 ÷ 4, about 3 minutes in.\n\nTEACHER SAYS (written for this deck; adjust to your words)\n“Future glasses on. Red mat: both quotients found with the blocks, each answer in your journal, and you can say how the two problems were the same and how they were different. Green mat: three minutes for each problem. Yellow mat: count your blocks before you start.”\n\nFUTURE-GLASSES PROMPT\n“Picture your table when you finish 104 ÷ 8. What is in each of the 8 groups?”\n\nIF–THEN OBSTACLE PROMPT\n“If there are not enough hundreds to give one to every group, then exchange a hundred for 10 tens. If your group runs short of blocks, then draw the rest.”\n\nTIMER\nSet the timer for the halfway point (3 minutes). At the ½ checkpoint: “488 ÷ 4 done? Move to 104 ÷ 8.”"}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s007.jpg", "title": "Activity 1", "notes": "PURPOSE\nIM L15 Activity 1 task (verbatim).\n\nTIMING\nAbout 6 minutes of group work (IM: 5–6), then the same/different question.\n\nCLICKS\nClick 1: the same/different question, after group work.\n\nACTIVITY (IM)\n5–6 minutes: group work time\nClick 1. “How was finding each quotient the same? How was it different?” (With the first one, you could just split the blocks into 4 groups. With the second one, you had to trade in some blocks to make 8 groups.)\n\nANSWERS (IM)\n1. 122. Students split the 4 hundreds into 4 groups and then do the same with the 8 tens and 8 ones. They see they have 1 hundred, 2 tens, and 2 ones in each group.\n2. 13. Students trade the hundred block in for 10 tens. They split the 10 tens into 8 groups and are left with 2 tens. They split the 2 tens into 20 ones and then split the 24 ones into 8 groups.\n\nADVANCING STUDENT THINKING (IM, verbatim)\n• If students find the value of each expression using only numbers and symbols, consider asking:\n“How did you find the value of this expression?”\n“How can you use base-ten blocks to represent the division and show your way of thinking about it?”\n\nCONFERRING (card)\nAre students dividing each place-value chunk correctly before combining? Watch for a group that splits the hundreds but forgets to share the tens and ones.\n\nROSENSHINE\nPrinciple 5: Guide student practice."}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s008.jpg", "title": "Activity 1", "notes": "PURPOSE\nActivity 1 Synthesis (IM L15). A drawn version of the IM sample responses, to show after two or three groups share what they did with the blocks.\n\nTIMING\nAbout 2 minutes.\n\nCLICKS\nClick 1: 488 ÷ 4. Click 2: 104 ÷ 8.\n\nABOUT THE VISUALS\nDrawn for this deck from the IM sample responses: “Students split the 4 hundreds into 4 groups and then do the same with the 8 tens and 8 ones. They see they have 1 hundred, 2 tens, and 2 ones in each group.” and “Students trade the hundred block in for 10 tens. They split the 10 tens into 8 groups and are left with 2 tens. They split the 2 tens into 20 ones and then split the 24 ones into 8 groups.”\n\nDISCUSSION PROMPT (IM, verbatim)\n“How was finding each quotient the same? How was it different?” (With the first one, you could just split the blocks into 4 groups. With the second one, you had to trade in some blocks to make 8 groups.)\n\nCUT FOR TIME\nThe IM MLR7 display and gallery walk are cut to fit 50 minutes. Point at one group’s blocks where a hundred was exchanged for 10 tens, and ask what the exchange did.\n\nBRIDGE TO ACTIVITY 2 (suggested)\n“Drawing every block takes a long time for bigger numbers. Next we use a faster drawing: a base-ten diagram.”\n\nCONFERRING (card)\nAre students dividing each place-value chunk correctly before combining?"}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s009.jpg", "title": "Activity 2", "notes": "PURPOSE\nIM L16 Activity 1 launch. Students use base-ten diagrams to find quotients, decomposing a higher-value piece into 10 of the lower-value pieces as needed. Addressing 4.NBT.B.6.\n\nTIMING\nAbout 1 minute of the 10-minute activity.\n\nCLICKS\nClick 1: “Why does this diagram represent 64?”\n\nLAUNCH (IM)\n• Groups of 4\n• Give students access to base-ten blocks.\n• Display the first diagram. Make sure students can explain why it represents 64.\n\nANTICIPATED RESPONSE (sample)\n“There are 6 rectangles, so 6 tens is 60, and 4 small squares is 4. 60 + 4 = 64.”\n\nABOUT THE VISUAL\nPriya’s diagram (6 tens, 4 ones) is redrawn with shapes from the IM image.\n\nMLR8 (IM)\nUse verbal descriptions along with gestures, drawings, or concrete objects to show how a base-ten block is equivalent to 10 ones blocks and how they are interchangeable. Advances: listening, representing."}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s010.jpg", "title": "Activity 2", "notes": "PURPOSE\nGet Ready · Do · Done send-off into Activity 2 (Ward & Jacobsen, GDD pp. 74–79).\n\nTIMING\nAbout 1 minute, then start the timer.\n\nCLICKS (right to left)\nClick 1: Done mat. Click 2: Do mat. Click 3: Get Ready mat.\n\nSTEP TIMES\nInferred. IM gives 5 minutes of independent work and 2 minutes of group discussion; this slide splits the 5 minutes into 2 (64 ÷ 4) and 3 (117 ÷ 3). The ½ checkpoint sits after 64 ÷ 4, about 2–3 minutes in.\n\nTEACHER SAYS (written for this deck; adjust to your words)\n“Future glasses on. Red mat: two quotients, a diagram that shows each equal group, and a mark where you exchanged a bigger piece for ten smaller ones. Green mat: two minutes for Priya, three for 117 divided by 3, then two minutes to share. Yellow mat: journal, pencil, blocks in the middle.”\n\nFUTURE-GLASSES PROMPT\n“Picture 4 equal groups for 64. What is inside each one?”\n\nIF–THEN OBSTACLE PROMPT\n“If you have tens left over that won’t share evenly, then exchange each one for 10 ones. If drawing is slow, then build it with blocks.”\n\nTIMER\nSet the timer for the halfway point (about 3 minutes). At the ½ checkpoint: “64 ÷ 4 done? Move to 117 ÷ 3.”"}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s011.jpg", "title": "Activity 2", "notes": "PURPOSE\nIM L16 Activity 1 task (verbatim).\n\nTIMING\nAbout 7 minutes: 5 minutes independent work, 2 minutes group discussion.\n\nCLICKS\nNone.\n\nACTIVITY (IM)\n5 minutes: independent work time\n2 minutes: group discussion\n• Monitor for students who see that a larger piece can be decomposed into 10 of the next smaller piece to help with distribution.\n\nANSWERS (IM)\n1. 16. Four of the 6 tens can be put into 4 groups of 1 ten. The other 2 tens can be decomposed into 20 ones. There are now 24 ones, which can be divided into 4 groups of 6. One ten and 6 ones make 16.\n2. 39. One hundred can be decomposed into 10 tens. Nine of the 11 tens can be put into 3 groups of 3 tens. There are now 2 tens which can be composed into 20 ones. There are now 27 ones, which can be divided into 3 groups of 9. Three tens and 9 ones make 39.\n\nABOUT THE VISUALS\nBoth diagrams are redrawn with shapes from the IM images: 64 as 6 tens and 4 ones; 117 as 1 hundred, 1 ten and 7 ones.\n\nCONFERRING (card)\nAre students dividing each place-value chunk correctly before combining?\n\nDIFFERENTIATION\nSupport: base-ten blocks to build the diagram before drawing. Extension: write an equation for each part, for example 40 ÷ 4 = 10 and 24 ÷ 4 = 6."}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s012.jpg", "title": "Activity 2", "notes": "PURPOSE\nIM L16 Activity 1 Synthesis.\n\nTIMING\nAbout 1–2 minutes.\n\nCLICKS\nClick 1: 64 ÷ 4. Click 2: 117 ÷ 3.\n\nTEACHER MOVES (IM)\n• Invite students to share their responses and reasoning.\n• Make sure students see that we can think of 64 ÷ 4 as putting 6 tens and 4 ones into 4 equal groups, and 117 ÷ 3 as putting 1 hundred 1 ten and 7 ones into 3 equal groups.\n• To divide the base-ten pieces, we can decompose a piece representing a larger place value with 10 of the next smaller place value.\n\nABOUT THE VISUALS\nThe grouped answers are redrawn from the IM student-response images: 4 groups of 1 ten and 6 ones; 3 groups of 3 tens and 9 ones.\n\nCONNECT TO EQUATIONS (IM L16 Next-Day Support)\nDuring the Activity Syntheses, connect diagrams to expressions or equations. Sample: 40 ÷ 4 = 10 and 24 ÷ 4 = 6, so 64 ÷ 4 = 16; 90 ÷ 3 = 30 and 27 ÷ 3 = 9, so 117 ÷ 3 = 39.\n\nROSENSHINE\nPrinciple 4: Provide models.\n\nPRIOR-UNIT SUPPORT (IM)\nGrade 2, Unit 5, Section A The Values of Three Digits."}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s013.jpg", "title": "Activity 3", "notes": "PURPOSE\nIM L16 Activity 2 launch. Students use base-ten representations and equal-size groups to find whole-number quotients, decomposing a hundred into 10 tens as needed (MP7), and make sense of Noah’s reasoning (MP3). Addressing 4.NBT.B.6.\n\nTIMING\nAbout 1 minute of the 13-minute activity.\n\nCLICKS\nNone.\n\nLAUNCH (IM)\n• Groups of 2\n• Give students access to base-ten blocks.\n• Display the first diagram.\n“How does the diagram represent 235?” (A large square represents 100. A rectangle represents 10. A small square represents 1.)\n\nABOUT THE VISUAL\n235 is redrawn as 2 hundreds, 3 tens and 5 ones from the IM image.\n\nUDL (IM, Engagement: Provide Access by Recruiting Interest)\nInvite students to share examples from their own lives in which they might need to divide three-digit numbers by one-digit numbers. Ask them to imagine and share why Noah might be dividing 235 by 5. Supports attention and social-emotional functioning."}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s014.jpg", "title": "Activity 3", "notes": "PURPOSE\nGet Ready · Do · Done send-off into Activity 3, Help Noah Get Unstuck (Ward & Jacobsen, GDD pp. 74–79).\n\nTIMING\nAbout 1 minute, then start the timer.\n\nCLICKS (right to left)\nClick 1: Done mat. Click 2: Do mat. Click 3: Get Ready mat.\n\nSTEP TIMES\nIM gives 4–5 minutes independent work on the first question, a pause for the class, then 5 minutes partner work on the last question. Trimmed to 4 and 4 to fit 50 minutes. The ½ checkpoint is the IM pause after question 1.\n\nTEACHER SAYS (written for this deck; adjust to your words)\n“Future glasses on. Red mat: you have shown how Noah can finish, with every exchange, and you have found 432 divided by 6. Green mat: four minutes on your own for Noah, a short class check, then four minutes with your partner. Yellow mat: journal, pencil, blocks between you.”\n\nFUTURE-GLASSES PROMPT\n“Picture Noah’s five boxes when they are full. What is in each one?”\n\nIF–THEN OBSTACLE PROMPT\n“If there are not enough hundreds or tens to share, then exchange them for 10 of the next smaller piece, just like Noah needs to. If you and your partner get different answers, then multiply to check.”\n\nTIMER\nSet the timer for the halfway point (4 minutes), when the class pauses after question 1."}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s015.jpg", "title": "Activity 3", "notes": "PURPOSE\nIM L16 Activity 2, question 1 (verbatim).\n\nTIMING\n4 minutes independent work (IM: 4–5), then a 1-minute pause.\n\nCLICKS\nNone.\n\nACTIVITY (IM)\n4–5 minutes: independent work time on the first question (4 in this deck)\n• Monitor for students who see the 2 hundreds as 20 tens and those who see them as 200 ones.\n• Pause after the first question. Make sure students see that the 2 hundreds can be decomposed into 20 tens (or 200 ones) and split into 5 equal groups, and the 3 tens can be decomposed into 30 ones and split into 5 groups. Complete the second diagram to illustrate this reasoning.\n\nANSWER (IM)\nNoah can exchange the 2 hundreds for 20 tens, which can make 5 groups of 4 tens. The other 3 tens can be exchanged for 30 ones. There are now 35 ones in total, which can make 5 groups of 7 ones with no remainder. Each group has 4 tens and 7 ones, which is 47.\n\nABOUT THE VISUAL\nNoah’s unfinished diagram is redrawn from the IM image: three boxes with 1 ten and 1 one, two boxes with 1 one.\n\nCONFERRING (card)\nAre students dividing each place-value chunk correctly before combining? Look for students who decompose the dividend incorrectly (IM Responding to Student Thinking).\n\nROSENSHINE\nPrinciple 6: Check for student understanding (the pause after question 1)."}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s016.jpg", "title": "Activity 3", "notes": "PURPOSE\nIM L16 Activity 2, question 2 (verbatim).\n\nTIMING\n4 minutes partner work time (IM: 5).\n\nCLICKS\nNone.\n\nANSWER (IM)\n432 can be represented by 4 hundreds, 3 tens, and 2 ones.\n• Exchange 4 hundreds for 40 tens. Now, there are 43 tens.\n• Use 42 tens to make 6 groups of 7 tens. There is 1 ten left over.\n• Exchange the 1 ten for 10 ones. There are now 12 ones.\n• Put the 12 ones into 6 groups of 2 ones.\n• Each group has 7 tens and 2 ones, or 72.\n\nNOTE\nThe previous version of this deck had “Talk like a mathematician” frames on this slide. They were not from IM and were removed. Add them back if your students need them.\n\nDIFFERENTIATION\nSupport: blocks first, then draw. Optional practice or a center for early finishers (IM L15 Activity 2): 96 ÷ 4 = 24, 86 ÷ 2 = 43, 108 ÷ 9 = 12.\n\nCONFERRING (card)\nAre students dividing each place-value chunk correctly before combining?"}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s017.jpg", "title": "Activity 3", "notes": "PURPOSE\nIM L16 Activity 2 Synthesis, with the IM sample response for 432 ÷ 6 laid out step by step.\n\nTIMING\nAbout 2 minutes.\n\nCLICKS\nClicks 1–4: steps 2 to 5, one at a time. Click 5: each group, 72. Click 6: the big idea.\n\nTEACHER MOVES (IM)\n• Select students to share their responses and reasoning for the last question. Display for all to see.\n• Highlight the idea that each unit can be decomposed into 10 units of a lower place value to make it possible to create equal-sized groups.\n\nABOUT THE SLIDE\nThe five steps are the IM sample response, lightly shortened. The bottom card restates the IM highlight in student language.\n\nCONNECT TO EQUATIONS (IM Next-Day Support)\nSample: 420 ÷ 6 = 70 and 12 ÷ 6 = 2, so 432 ÷ 6 = 72. Tomorrow (Day 17) records this chunking as partial quotients."}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s018.jpg", "title": "Lesson Wrap Up", "notes": "PURPOSE\nIM L16 Lesson Synthesis. Students finish a student’s partial work by decomposing hundreds into tens and tens into ones.\n\nTIMING\n6 minutes: 5 for 712 ÷ 4, 1 to return to the split screen.\n\nCLICKS\nClick 1: the decomposition. Click 2: the two facts. Click 3: the unfinished row disappears and the completed groups (1 hundred, 7 tens, 8 ones each) and 712 ÷ 4 = 178 appear in its place. Show these only after volunteers share.\n\nTEACHER SAYS (IM, verbatim)\n“Today we used base-ten diagrams and blocks to find quotients such as 712 ÷ 4. Here is a student’s unfinished work for finding 712 ÷ 4. How would you complete it?”\n\nDISPLAY (IM)\n“712 ÷ 4 means putting 7 hundreds + 1 ten + 2 ones into 4 equal groups.” Four boxes, each with 1 hundred.\n\nEXPECTED REASONING (IM)\n178. After putting 1 hundred in each group, there are 3 hundreds, 1 ten, and 2 ones left. The hundreds can be decomposed into tens and the tens can be decomposed into ones so that there’s enough to put into 4 groups. 28 ÷ 4 = 7, so 7 tens in each group. 32 ÷ 4 = 8, so 8 ones in each group. Each group: 1 hundred, 7 tens, 8 ones.\n\nCORRECTION\nThe previous version of this deck quoted the opening as “quotients such as 132 ÷ 4.” The IM guide says 712 ÷ 4; the script above is corrected.\n\nDAY 17 BRIDGE (suggested)\n400 ÷ 4 = 100, 280 ÷ 4 = 70, 32 ÷ 4 = 8, and 100 + 70 + 8 = 178. This is the chunking partial quotients record tomorrow.\n\nROSENSHINE\nPrinciple 7: Obtain a high success rate (students finish a partly complete model).\n\nSPLIT SCREEN (close, 1 minute)\nBack to: As mathematicians, how can breaking a dividend into place-value chunks — hundreds, tens, ones — make a division problem easier? “Where did being observant of the pattern in a diagram help you?”\n\nCUT FOR TIME\nThe L15 Division Reflection (“How was using the base-ten blocks helpful in your work today? How was it not helpful?”) is cut to fit 50 minutes. It works as a quick oral exit question if you have a spare minute."}, {"img": "_hub/slides/Math_U2_L16_Base_Ten_Blocks_and_Diagrams/s019.jpg", "title": "Cool Down", "notes": "PURPOSE\nIM L16 Cool-down, Find the Value of a Quotient (verbatim). One task, 5 minutes, independent. Addressing 4.NBT.B.6.\n\nTIMING\n5 minutes.\n\nCLICKS\nNone.\n\nANSWER (IM)\n33. I know that 132 = 100 + 32. I also know that 100 ÷ 4 = 25 and 32 ÷ 4 = 8, so 132 ÷ 4 is the sum of 25 and 8, which is 33.\n• The large square represents 1 hundred and can be decomposed into 10 tens. Now, we have 13 tens. Twelve of the tens can be put into 4 groups of 3 tens. The last ten can be decomposed into 10 ones. There are now 12 ones, or 4 groups of 3 ones. Three tens and 3 ones is 33.\n• I know that 120 ÷ 4 = 30 and 12 ÷ 4 = 3, so 132 ÷ 4 = 33.\n\nRESPONDING TO STUDENT THINKING (IM)\nStudents decompose the dividend incorrectly, resulting in errors.\n\nNEXT-DAY SUPPORT (IM)\nDuring the Activity Syntheses, connect diagrams to expressions or equations.\n\nPRIOR-UNIT SUPPORT (IM)\nGrade 2, Unit 5, Section A The Values of Three Digits.\n\nFORMATIVE ASSESSMENT (card)\nIM L15–L16 block-and-diagram tasks. Sort: diagram only, equations only, both. Note who needs more support before partial quotients on Day 17. The M4 Checkpoint (Day 19) asks students to explain division with equations, arrays, or models."}]}, "Math U2 L17_Partial_Quotients_Algorithm.pptx": {"name": "Math U2 L17_Partial_Quotients_Algorithm.pptx", "slug": "Math_U2_L17_Partial_Quotients_Algorithm", "pptx": null, "pdf": null, "sprite": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/sprite.jpg", "tw": 192, "th": 108, "landscape": true, "slides": [{"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s001.jpg", "title": "An Algorithm with Partial Quotients", "notes": "PURPOSE\nOpen Day 17 (Part 3: How do we divide multi-digit numbers, and what do we do with what's left over?). Day 17 combines IM Lesson 17 (An Algorithm with Partial Quotients) and IM Lesson 18 (Use an Algorithm with Partial Quotients).\n\nTIMING\nAbout 1 minute. Lesson total: 47 minutes (Warm-up 10 · Activity 1 15 · Activity 2 12 · Lesson Synthesis 5 · Cool-down 5).\n\nCLICKS\nNone.\n\nSOURCE: No Day 17 lesson plan is in Outputs, so content comes from the IM Grade 4 Unit 6 teacher guides for Lessons 17 and 18 (Day 17 - Lesson 17 T.pdf, Day 17 - Lesson 18 T.pdf). Quoted teacher language is IM's, verbatim. Lines marked 'Teacher says (deck)' were written for this deck.\n\nLESSON CONTENTS (two activities, kept under 50 minutes)\n• Warm-up: IM L17 Number Talk: Divide by 3.\n• Activity 1: IM L17 Activity 2, Tyler's Method. Priya's equations from IM L17 Activity 1 are shown as the launch, with IM's definition of \"partial quotient\".\n• Activity 2: IM L18 Activity 1, A Stack of Partial Quotients (Jada).\n• Lesson Synthesis: IM L17 Lesson Synthesis (738 ÷ 9).\n• Cool-down: IM L17 Cool-down, Subtract Groups (430 ÷ 5).\n• Set aside: IM L17 Activity 1 Problem 1 (students find 465 ÷ 5 their own way with base-ten blocks), IM L18 Warm-up, IM L18 Activity 2 (Andre and Elena's Work, four-digit dividends), IM L18 Activity 3 (optional), IM L18 Synthesis and Cool-down. Andre and Elena's Work is the best candidate for a center or Day 18 warm-up if you want four-digit practice.\n\nSPLIT-SCREEN (verbatim from the Day 17 card)\nWHAT: As mathematicians, how can breaking a division problem into smaller, friendlier chunks help us divide larger numbers?\nHOW: Thinkers · Persistent. As thinkers, how can being persistent through each partial quotient help us reach an accurate answer?\n\nTEACHER SAYS (deck)\n\"Read our WHAT question with me. Today we divide bigger numbers by breaking them into friendly chunks. Our HOW question is about sticking with every chunk until nothing is left to divide.\"\n\nPROBLEM-SOLVING CONFERRING (from the card)\nAre students choosing friendly, efficient chunks, or subtracting one at a time?\n\nASSESSMENT (from the card)\nIM L17–L18 partial-quotients tasks."}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s002.jpg", "title": "Learning Target", "notes": "PURPOSE\nName the learning target (verbatim from the Day 17 card) and preview the two recording methods students meet today: Priya's equations, then Tyler's and Jada's vertical stacks.\n\nTIMING\n30 seconds.\n\nCLICKS\nNone.\n\nTEACHER SAYS (deck)\n\"Read the target with me: I can use an algorithm with partial quotients to divide a multi-digit number. First we'll see partial quotients written as equations. Then we'll see them recorded in a stack.\"\n\nSUCCESS CRITERIA\nThere is no Day 17 lesson plan, so no success criteria are listed. Add a slide if you write them.\n\nCONNECTION\nYesterday (Day 16) students broke dividends into hundreds, tens and ones with base-ten blocks and diagrams. Today they record the same thinking with numbers only."}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s003.jpg", "title": "Warm Up", "notes": "PURPOSE\nIM L17 Warm-up, Number Talk: Divide by 3. Students use place-value structure to divide mentally (MP7) and explain precisely (MP6). The reasoning here (decomposing a dividend into friendly parts) is the reasoning behind partial quotients later in the lesson.\n\nTIMING\n10 minutes, across this slide and the next.\n\nCLICKS\nClick 1: 90 ÷ 3. Click 2: 96 ÷ 3. Click 3: 960 ÷ 3. Click 4: 954 ÷ 3. Reveal the next expression only after you have recorded answers and strategies for the one before.\n\nLAUNCH (IM)\n• Groups of 2.\n• Display one expression.\n• Teacher says (IM): \"Give me a signal when you have an answer and can explain how you got it.\"\n• 1 minute: quiet think time.\n\nACTIVITY (IM)\n• Record answers and strategy.\n• Keep expressions and work displayed.\n• Repeat with each expression.\n\nANTICIPATED RESPONSES (IM student responses)\n• 30: I know that 90 is 10 × 9 and 9 ÷ 3 is 3, so 90 ÷ 3 is 10 × 3, which is 30.\n• 32: Ninety is 30 × 3 and 6 is 2 × 3, so 96 is (30 × 3) + (2 × 3), which is (30 + 2) × 3 or 32 × 3.\n• 320: I know that 96 ÷ 3 is 32, so 960 ÷ 3 is 10 × 96 ÷ 3 or 10 × 32, which is 320.\n• 318: I know that 954 is 960 − 6, so it is (320 × 3) − (2 × 3), which is (320 − 2) × 3 or 318 × 3.\n\nMISCONCEPTION TO WATCH\nStudents who treat 960 ÷ 3 as 96 ÷ 3 with a zero \"added\" without explaining why. Ask: \"How many tens is 960? How many threes are in 96 tens?\"\n\nDIFFERENTIATION\nSupport: let students jot a quick note on a whiteboard before signalling. Extension: \"What is 957 ÷ 3? How does 954 ÷ 3 help?\"\n\nFORMATIVE ASSESSMENT\nWho uses the previous expression to find the next one? Those students are ready to see partial quotients as \"chunks\".\n\nROSENSHINE\nPrinciple 1: Begin with a short review of previous learning."}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s004.jpg", "title": "Warm Up", "notes": "PURPOSE\nWarm-up Activity Synthesis (IM L17). Make the chain of reasoning visible: each expression helps with the next.\n\nTIMING\nPart of the 10-minute Warm-up (about 3 minutes here).\n\nCLICKS\nThe question shows first. Click 1–4: one recorded answer and strategy at a time. Reveal each only after a student has explained it, so the slide confirms student thinking rather than replacing it.\n\nTEACHER SAYS (IM)\n\"How did each expression help you find the next one?\"\nConsider asking:\n• \"Who can restate ______'s reasoning in a different way?\"\n• \"Did anyone have the same strategy but would explain it differently?\"\n• \"Did anyone approach the expression in a different way?\"\n• \"Does anyone want to add on to____'s strategy?\"\n\nANTICIPATED RESPONSES\nThe four strategies on the slide are IM's student responses, shortened to fit. Full versions are in the previous slide's notes.\n\nLINK FORWARD (Teacher says, deck)\n\"954 ÷ 3 was easier because we broke it into parts we already knew. That's what we'll do all lesson.\"\n\nMLR\nMLR8 Discussion Supports: invite students to restate a classmate's strategy before adding their own."}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s005.jpg", "title": "Activity 1", "notes": "PURPOSE\nLaunch for Activity 1. Students meet Priya's way of recording 465 ÷ 5 as a series of division equations (from IM L17 Activity 1, Problem 2) and the term \"partial quotient\". This sets up Tyler's Method, which IM compares with Priya's.\n\nTIMING\nAbout 3 minutes of the 15-minute Activity 1.\n\nCLICKS\nPriya's work shows first. Click 1: question. Click 2: answer (after students respond). Click 3: vocabulary card.\n\nTEACHER SAYS (IM, L17 Activity 1 synthesis)\n\"How did Priya decompose the number 465?\" (By place value. 400 + 60 + 5)\n\"What does Priya do after writing the first three equations?\" (She adds up the quotients.)\n\"We can find a quotient in parts—dividing a portion of the dividend at a time—until there is no more (or until there is not enough) of the dividend to divide.\"\n\"Each quotient is called a partial quotient.\"\n\nANTICIPATED RESPONSES (IM student response)\n\"Priya divided 465 into 5 groups in smaller parts. First, she divided 400 by 5, which gave 80. Then she divided 60 by 5, which gave 12. Lastly, she divided 5 by 5, which is 1. The quotient is 80 + 12 + 1, which is 93.\"\n\nCHANGE FROM IM\nIM has students first find 465 ÷ 5 their own way with base-ten blocks (L17 Activity 1, Problem 1) before seeing Priya's work. That problem is set aside today to fit two activities into 50 minutes; Day 16 covered block and diagram division. If students need it, give 2 minutes for Problem 1 on whiteboards before this slide.\n\nMISCONCEPTION TO WATCH\nStudents who think 60 ÷ 5 should be a \"tens\" answer like 10 or 20. Ask: \"How many groups of 5 are in 60?\"\n\nCOLOUR CODE\nEach partial quotient keeps one colour all lesson (80 orange, 12 blue, 1 green), so students can match it in Tyler's stack on the next slide.\n\nMLR\nMLR8 Discussion Supports (IM): let students rehearse describing Priya's steps with a partner before sharing with the class.\n\nROSENSHINE\nPrinciple 4: Provide models."}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s006.jpg", "title": "Activity 1", "notes": "PURPOSE\nActivity 1 launch (IM L17 Activity 2, Tyler's Method). Display Priya's and Tyler's methods side by side so students can analyze Tyler's vertical recording.\n\nTIMING\nAbout 1 minute, inside Activity 1.\n\nCLICKS\nPriya's method shows first. Click 1: Tyler's method.\n\nLAUNCH (IM)\n• Groups of 4.\n• Display Priya and Tyler's methods.\n• Teacher says (IM): \"Tyler used a different method to record 465 ÷ 5. Analyze what is happening in his method. Think about how the two methods are alike and different.\"\n\nREADING TYLER'S STACK\nThe partial quotients (80, 12, 1) are stacked above 465, last one on top, and the total 93 is boxed. Each subtraction (400, 60, 5) is labelled with its multiplication (5 × 80, 5 × 12, 5 × 1). Colours match Priya's equations.\n\nDO NOT EXPLAIN YET\nLet students make sense of Tyler's work first. You clarify the numbers after the group discussion (slide \"What Tyler's Numbers Mean\").\n\nUDL\nAction and Expression: Internalize Executive Functions (IM). Invite students to verbalize their strategy for problem 2 before they begin, quietly to themselves or to a partner."}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s007.jpg", "title": "Activity 1", "notes": "PURPOSE\nGet Ready · Do · Done send-off into Activity 1, Tyler's Method (Ward & Jacobsen, GDD pp. 74–79). Students picture the finished work, plan the steps and time, then gather what they need.\n\nTIMING\nAbout 1 minute, then start the timer.\n\nCLICKS (right to left)\nClick 1: Done mat. Click 2: Do mat. Click 3: Get Ready mat.\n\nSTEP TIMES\nFrom IM L17 Activity 2: 3 minutes independent work on the first two questions, 3 minutes small-group discussion, a class share where you clarify Tyler's numbers, then 3 minutes independent work on 428 ÷ 4. The ½ checkpoint is the class share after the group discussion (about 6 minutes in).\n\nTEACHER SAYS (deck)\n\"Future glasses on. Red mat first: when you're done, you'll have a list of how Priya and Tyler are alike and different, a sentence about why Tyler subtracts, and 428 ÷ 4 written Tyler's way. Green mat: three minutes on your own, three minutes with your group, then we stop together before the last problem. Yellow mat: journal open, sitting with your group of 4.\"\n\nFUTURE-GLASSES PROMPT\n\"Picture your journal at the end of Activity 1. What does your 428 ÷ 4 look like? Where are the partial quotients?\"\n\nIF–THEN OBSTACLE PROMPT\n\"If you can't find a difference, then look at what Tyler writes that Priya doesn't, like the subtraction signs. If your group is quiet, then each person reads one item from their list.\"\n\nTIMER\nSet the timer for the halfway point (6 minutes, the end of the group discussion). At the ½ checkpoint: \"Pens down. Let's look at Tyler's numbers together.\""}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s008.jpg", "title": "Activity 1", "notes": "PURPOSE\nActivity 1 student work, questions 1 and 2 (IM L17 Activity 2). Students compare and contrast the two recordings and critique the reasoning of others (MP3).\n\nTIMING\n6 minutes: 3 minutes independent work, 3 minutes small-group discussion.\n\nCLICKS\nNone. Students need everything visible while they work.\n\nACTIVITY (IM)\n• 3 minutes: independent work time on the first two questions.\n• 3 minutes: small-group discussion.\n• Invite students to share their analyses on the two methods.\n• If not mentioned by students, highlight that both Priya and Tyler divided in parts, but reasoned and recorded differently. Both methods are simply two ways to record partial quotients, but they are not fundamentally different.\n  ◦ Priya recorded the partial quotients with division equations.\n  ◦ The partial quotients in Tyler's work are recorded as factors being multiplied by 5, and also listed above the dividend.\n  ◦ Tyler kept dividing in parts and subtracting until there's nothing left of the dividend to divide.\n\nANTICIPATED RESPONSES (IM student responses)\nAlike:\n• The 465 is decomposed into parts and each part is divided by 5 separately.\n• The partial quotients are 80, 12, and 1.\n• The 80, 12, and 1 are added up to get 93.\n• Both methods show 5 groups of 80, 5 groups of 12, and 5 groups of 1.\nDifferent:\n• Priya wrote division equations to show the divisor and partial quotients.\n• Tyler wrote multiplication expressions. He stacked the partial quotients vertically.\n• Tyler subtracted numbers several times. There is no subtraction in Priya's work.\n• Priya showed 5 groups of 80 in 400 ÷ 5 = 80. Tyler showed it in 5 × 80.\nQuestion 2: To keep track of what is left after he removed a partial amount that has been divided by 5. (For example, after dividing 400 by 5, he removed it from 465 to get 65.)\n\nPROBLEM-SOLVING CONFERRING (card)\nAre students choosing friendly, efficient chunks, or subtracting one at a time? Here: can they say what each chunk Tyler took away was worth?\n\nDIFFERENTIATION\nSupport: give a two-column T-chart (Alike / Different) to fill in. Extension: \"Could Tyler have used fewer steps? Show one.\"\n\nFORMATIVE ASSESSMENT\nListen for \"Tyler subtracts to see what's left.\" That is the idea students need before 428 ÷ 4."}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s009.jpg", "title": "Activity 1", "notes": "PURPOSE\n½ checkpoint and class share for Activity 1. IM: \"Clarify the meaning of the numbers in Tyler's method before students work on the last question.\"\n\nTIMING\nAbout 2–3 minutes.\n\nCLICKS\nClick 1–3: one partial quotient at a time, in the order Tyler took them away. Click 4: the sum.\n\nTEACHER SAYS (IM)\nHighlight that both Priya and Tyler divided in parts, but reasoned and recorded differently. \"Both methods are simply two ways to record partial quotients, but they are not fundamentally different.\"\n\nTEACHER SAYS (deck, for each click)\n\"Point to the 80. What did Tyler take away when he wrote 80? How much was left?\" Repeat for 12 and 1. \"Where is the quotient?\" (The boxed 93, the sum of the partial quotients.)\n\nMISCONCEPTION TO WATCH\nStudents read the stacked numbers 1, 12, 80 as the quotient \"11280\" or think the top number is the answer. Point out that the top line of the stack is the total, and the numbers under it are added.\n\nUDL\nRepresentation: the colours link each partial quotient to its subtraction. Invite students to shade matching pairs in their own work with coloured pencils (IM L18 suggests this for the next lesson).\n\nROSENSHINE\nPrinciple 6: Check for student understanding."}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s010.jpg", "title": "Activity 1", "notes": "PURPOSE\nActivity 1, question 3 (IM L17 Activity 2). Students record a new division Tyler's way.\n\nTIMING\n3 minutes independent work.\n\nCLICKS\nNone.\n\nACTIVITY (IM)\n• 3 minutes: independent work time to find the value of 428 ÷ 4.\n\nANTICIPATED RESPONSES (IM sample responses)\n• Partial quotients 100, 5, 2: 428 − 400 (4 × 100) = 28; 28 − 20 (4 × 5) = 8; 8 − 8 (4 × 2) = 0. Quotient 107.\n• Partial quotients 50, 50, 7: 428 − 200 (4 × 50) = 228; 228 − 200 (4 × 50) = 28; 28 − 28 (4 × 7) = 0. Quotient 107.\n\nMISCONCEPTION TO WATCH\nStudents who divide the 2 tens by 4 and get stuck, or write a quotient of 17 (dropping the zero in the tens place). Ask: \"How many groups of 4 are in 28?\"\n\nDIFFERENTIATION\nSupport: offer base-ten blocks or let students write Priya's equations first, then turn them into Tyler's stack. Extension: \"Find a second way to decompose 428.\"\n\nPROBLEM-SOLVING CONFERRING (card)\nAre students choosing friendly, efficient chunks, or subtracting one at a time?"}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s011.jpg", "title": "Activity 1", "notes": "PURPOSE\nActivity 1 Synthesis (IM L17 Activity 2). Show different ways to decompose 428 and confirm that Priya's equations and Tyler's stack record the same partial quotients.\n\nTIMING\nAbout 2 minutes. Ends Activity 1.\n\nCLICKS\nClick 1: way A (100, 5, 2). Click 2: way B (50, 50, 7). Click 3: algorithm statement.\n\nACTIVITY SYNTHESIS (IM)\n• Invite students to share their responses. Highlight the different ways to decompose 428 or the different partial quotients that could be used to find 428 ÷ 4.\n• Make sure students see that Priya's equations and Tyler's method are simply two ways to record partial quotients, but they are not fundamentally different.\n• Teacher says (IM): \"Tyler's vertical recording method is another type of algorithm.\"\n\nSAMPLE WORK\nBoth stacks are IM's sample responses, retyped. If a student used another decomposition, show theirs instead of or beside these.\n\nDISCUSSION PROMPT (deck)\n\"Way B took 50 twice. Could it have taken 100 once? Which is quicker?\"\n\nLINK TO THE HOW QUESTION\n\"Way B has more steps, and it still got to 107. Being persistent through each partial quotient gets you there, even when you take smaller chunks.\""}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s012.jpg", "title": "Activity 2", "notes": "PURPOSE\nActivity 2 launch (IM L18 Activity 1, A Stack of Partial Quotients). Students interpret a partial-quotients algorithm and then use it to divide.\n\nTIMING\nAbout 1 minute of the 12-minute Activity 2.\n\nCLICKS\nNone. Jada's work stays bare (no multiplication labels) so partners work out what each number means.\n\nLAUNCH (IM)\n• Groups of 2.\n• Display Jada's work.\n• Teacher says (IM): \"Talk with your partner about Jada's work and be ready to share your answers to the first question with the class.\"\n\nNOTE\nIM's printed sample response for 1b has a slip (it says 109 and 60 where it should say 112 and 63). The correct steps: 392 − 280 = 112, 112 − 49 = 63, 63 − 63 = 0. Use the numbers on the slide.\n\nMLR\nMLR2 Collect and Display (IM): direct attention to words collected and displayed from the previous lessons (partial quotient, dividend, divisor, quotient). Invite students to borrow language from the display, and update it during the lesson."}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s013.jpg", "title": "Activity 2", "notes": "PURPOSE\nGet Ready · Do · Done send-off into Activity 2, A Stack of Partial Quotients (Ward & Jacobsen, GDD pp. 74–79). This slide covers Activity 2 only.\n\nTIMING\nAbout 1 minute, then start the timer.\n\nCLICKS (right to left)\nClick 1: Done mat. Click 2: Do mat. Click 3: Get Ready mat.\n\nSTEP TIMES\nFrom IM L18 Activity 1: 2–3 minutes partner discussion, a class share of parts a and b, then 5–6 minutes independent work on problems 2 and 3. The deck splits the independent time 3 + 3. The ½ checkpoint is the class share after the partner talk.\n\nTEACHER SAYS (deck)\n\"Future glasses on. Red mat: you can explain every number in Jada's work, you've found 392 ÷ 7 a different way, and 702 ÷ 3 is done with a multiplication next to every subtraction. Green mat: three minutes with your partner, then we stop and share, then six minutes on your own. Yellow mat: sit beside your partner where you can both see Jada's work.\"\n\nFUTURE-GLASSES PROMPT\n\"Picture your 702 ÷ 3. How many partial quotients will be stacked above it? What will the box at the top say?\"\n\nIF–THEN OBSTACLE PROMPT\n\"If you get lost in the stack, then write the multiplication beside each subtraction before you subtract. If your partial quotients don't add up to the right answer, then multiply your answer by the divisor to check.\"\n\nTIMER\nSet the timer for the halfway point (3 minutes, the end of partner talk). At the ½ checkpoint: \"Eyes up. Let's share what Jada's numbers mean.\""}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s014.jpg", "title": "Activity 2", "notes": "PURPOSE\n½ checkpoint share for Activity 2 (IM L18 Activity 1). As students explain each value being subtracted, write the multiplication beside it.\n\nTIMING\nAbout 2 minutes.\n\nCLICKS\nClick 1: meaning of the numbers above 392. Clicks 2–4: 7 × 40, 7 × 7, 7 × 9 beside the matching subtraction. Click 5: meaning of the subtractions. Click 6: the sum.\n\nACTIVITY (IM)\n• Invite students to share their answers to parts a and b. As students explain what each of the values being subtracted represents, write a multiplication expression to represent each partial quotient. (7 × 40, 7 × 7, and 7 × 9)\n• Teacher says (IM): \"Complete the rest of the problems on your own.\"\n\nANTICIPATED RESPONSES (IM sample response, corrected)\na. First we make 7 groups of 40, then 7 groups of 7, and finally 9 groups of 7, for a total of 56 groups of 7.\nb. First, we subtract 7 groups of 40 (or 280) from the dividend, 392, leaving 112. Then we subtract 7 groups of 7 (or 49) from 112, leaving 63. Finally we subtract 9 groups of 7 (or 63), leaving 0. The quotient is 40 + 7 + 9, which is 56.\n\nMISCONCEPTION TO WATCH\n\"Why is it 7 × 7 and then 7 × 9? Shouldn't she take a bigger chunk?\" That question is good. Save it for the synthesis on efficient chunks.\n\nFORMATIVE ASSESSMENT\nWho can say \"40 groups of 7\" (not \"40 sevens subtracted\") for the first step? That language shows they see the divisor as the group size."}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s015.jpg", "title": "Activity 2", "notes": "PURPOSE\nActivity 2 independent work, problems 2 and 3 (IM L18 Activity 1).\n\nTIMING\n5–6 minutes independent work time (IM).\n\nCLICKS\nNone.\n\nANTICIPATED RESPONSES (IM sample responses)\nProblem 2: 392 − 350 (7 × 50) = 42; 42 − 42 (7 × 6) = 0. Partial quotients 50 and 6, quotient 56.\nProblem 3: 234. 702 − 600 (3 × 200) = 102; 102 − 90 (3 × 30) = 12; 12 − 12 (3 × 4) = 0. Partial quotients 200, 30, 4.\n\nMISCONCEPTION TO WATCH\n702 has a zero in the tens place. Students who divide place by place may write 7 hundreds ÷ 3 and get stuck on the 0 tens. Ask: \"What friendly multiple of 3 is close to 702?\"\n\nPROBLEM-SOLVING CONFERRING (card)\nAre students choosing friendly, efficient chunks, or subtracting one at a time? A student who takes away 3 × 10 over and over is accurate but slow. Ask: \"Could you take a bigger chunk? How many 3s are in 600?\"\n\nDIFFERENTIATION\nSupport: start with a list of helpful multiples of 3 (3 × 10, 3 × 100, 3 × 200). Extension: find 702 ÷ 3 two different ways and decide which is more efficient.\n\nUDL\nRepresentation: Access for Perception (IM L18). Offer coloured pencils to shade corresponding partial products and partial quotients.\n\nROSENSHINE\nPrinciple 5: Guide student practice."}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s016.jpg", "title": "Activity 2", "notes": "PURPOSE\nActivity 2 Synthesis (IM L18 Activity 1). Show variation in how students decomposed 392, and connect partial quotients to partial products.\n\nTIMING\nAbout 2 minutes. Ends Activity 2.\n\nCLICKS\nClick 1: 392 ÷ 7 with 50 and 6. Click 2: 702 ÷ 3, colour-coded. Click 3: summary statement.\n\nACTIVITY SYNTHESIS (IM)\n• Display responses that show variation in how students decomposed 392.\n• Highlight that there are countless ways of using partial quotients to divide a number, but it may be more efficient to divide larger groups than smaller groups. (For example, removing 50 groups of 7 or 350 once, instead of removing 70 five times. Removing smaller groups is just as valid.)\n• Invite students to share their answers and reasoning for the last problem. To help students see the relationship between corresponding partial products and partial quotients, consider illustrating them visually.\n\nSAMPLE WORK\nBoth stacks are IM sample responses, retyped and colour-coded the way IM's guide shows them (each partial quotient matches its subtraction). Swap in student work where you can.\n\nDISCUSSION PROMPT (deck)\n\"Compare Jada's 40, 7, 9 with 50, 6. Which took fewer steps? Why?\"\n\nLINK TO THE WHAT QUESTION\n\"How did breaking 702 into friendly chunks — 600, 90, 12 — help us divide a big number?\""}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s017.jpg", "title": "Lesson Wrap Up", "notes": "PURPOSE\nLesson Synthesis (IM L17). Students put \"partial quotient\" into their own words and think about choosing friendly multiples.\n\nTIMING\n5 minutes across this slide and the next.\n\nCLICKS\nThe first question shows. Click 1: 738 ÷ 9 and the \"how would we know\" question. Click 2: \"what are some ways\" question.\n\nTEACHER SAYS (IM)\n\"Today we learned to use an algorithm that uses partial quotients to divide numbers.\"\n\"How would you explain 'partial quotients' to a classmate who might be absent today?\" (We can find a quotient in parts—dividing a portion of the dividend at a time—until there is no more or until there is not enough of the dividend to divide. Each quotient is called a partial quotient.)\n\"Suppose we'd like to find the value of 738 ÷ 9 and know we could decompose the 738 into parts. How would we know what numbers to choose?\" (Look for multiples of 9. Try to start with the largest multiple of 9 and 10 within 738.)\n\"What are some ways to decompose 738 into multiples of 9?\" (720 + 18, or 450 + 270 + 18, among others.)\n\nSTRUCTURE\nTurn and talk for the first question, then take 2–3 shares.\n\nLINK TO THE HOW QUESTION (deck)\n\"When did you have to be persistent today, sticking with a stack until nothing was left to divide?\""}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s018.jpg", "title": "Lesson Wrap Up", "notes": "PURPOSE\nLesson Synthesis display (IM L17). Two recordings of 738 ÷ 9 side by side.\n\nTIMING\nAbout 2 minutes.\n\nCLICKS\nClick 1: the equations. Click 2: the vertical stack. Click 3: the question.\n\nTEACHER SAYS (IM)\n\"We saw two ways of recording partial quotients—by writing a series of equations and by recording the steps of division vertically. Where can we see the partial quotients in each one?\"\n\nANTICIPATED RESPONSES (samples)\n• In the equations, the partial quotients are the answers, 80 and 2.\n• In the stack, they're above 738, and the 82 in the box is their sum.\n• The colours match: 80 goes with 720, 2 goes with 18.\n\nFORMATIVE ASSESSMENT\nA student who can point to 80 and 2 in both recordings is ready for the Cool-down."}, {"img": "_hub/slides/Math_U2_L17_Partial_Quotients_Algorithm/s019.jpg", "title": "Cool Down", "notes": "PURPOSE\nIM L17 Cool-down, Subtract Groups. One task, 5 minutes, independent.\n\nTIMING\n5 minutes.\n\nCLICKS\nNone.\n\nSTUDENT RESPONSE (IM)\n86. Sample responses:\n• 400 is 80 groups of 5 and 30 is 6 groups of 5. Adding the groups of 5—80 and 6—gives the quotient.\n• 400 ÷ 5 = 80, 30 ÷ 5 = 6, 430 ÷ 5 = 86.\n• Vertical stack: 430 − 300 (5 × 60) = 130; 130 − 100 (5 × 20) = 30; 30 − 30 (5 × 6) = 0. 60 + 20 + 6 = 86.\n\nRESPONDING TO STUDENT THINKING (IM)\nStudents find correct partial quotients but don't find their sum, or don't connect the sum to the value of 430 ÷ 5.\nNext Day Support (IM): Launch the Warm-up or first activity by highlighting important notation from previous lessons.\n\nPRIOR-UNIT SUPPORT\nStudents who can't find partial quotients at all: revisit Day 16 base-ten diagrams (IM L15–L16), and Math Unit 1 multiplication facts for 5.\n\nSORT FOR TOMORROW\nPile 1: correct with a stack or equations. Pile 2: correct partial quotients, no sum. Pile 3: no partial quotients. Day 18 adds remainders, so Pile 3 needs a quick check-in before the Warm-up."}]}, "Math U2 L18_Dividing_with_Remainders.pptx": {"name": "Math U2 L18_Dividing_with_Remainders.pptx", "slug": "Math_U2_L18_Dividing_with_Remainders", "pptx": null, "pdf": null, "sprite": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/sprite.jpg", "tw": 192, "th": 108, "landscape": true, "slides": [{"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s001.jpg", "title": "Dividing with Remainders & Interpreting What They Mean", "notes": "PURPOSE\nOpen Day 18. Day 18 combines IM Lesson 19 (Divide with Remainders) and IM Lesson 20 (Interpret Remainders in Division Situations).\n\nTIMING\nAbout 1 minute. Lesson total: 48 minutes (Warm-up 8 · Activity 1 12 · Activity 2 15 · Lesson Synthesis 8 · Cool-down 5).\n\nCLICKS\nNone.\n\nSOURCE: No Day 18 lesson plan is in Outputs, so content comes from the IM Grade 4 Unit 6 teacher guides for Lessons 19 and 20 (Day 18 - Lesson 19 T.pdf, Day 18 - Lesson 20 T.pdf) and the Day 18 sequence card. Quoted teacher language is IM's, verbatim. Lines marked 'Teacher says (deck)' were written for this deck.\n\nLESSON CONTENTS (two activities, kept under 50 minutes)\n• Warm-up: IM L19 Notice and Wonder: Expressions and Equations.\n• Activity 1: IM L19 Activity 2, Is There a Remainder? The word \"remainder\" is introduced at the launch with IM's own definition (from L19 Activity 1 synthesis).\n• Activity 2: IM L20 Activity 1, Hearts and Seats.\n• Lesson Synthesis: IM L19 Lesson Synthesis (753 = 6 × 125 + 3), then the Day 18 card's discussion: what do we do with a remainder, and does it change with the story?\n• Cool-down: IM L19 Cool-down, Remainders (1,865 ÷ 4).\n• Set aside: IM L19 Activity 1 (182 ÷ 6 situations, posters and gallery walk, 25 min), IM L20 Warm-up (Choral Count), IM L20 Activity 2 (Save for a Garden; write a story for 711 ÷ 3 or 3,128 ÷ 8), IM L20 Synthesis and Cool-down (Miscounting?).\n\nSPLIT-SCREEN (verbatim from the Day 18 card)\nWHAT: As mathematicians, what should we do with a remainder — and does the answer change depending on the story?\nHOW: Communicators · Respectful. As communicators, how can being respectful — really listening to a classmate's reasoning — help us hear a new way to think about a remainder?\n\nTEACHER SAYS (deck)\n\"Yesterday every division came out even. Today some won't. Our HOW question asks us to really listen, because two people can make sense of the same leftover in different ways.\"\n\nPROBLEM-SOLVING CONFERRING (card)\nCan students justify what to do with a remainder for a specific context, not just calculate it?\n\nASSESSMENT (card)\nIM L19–L20 tasks."}, {"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s002.jpg", "title": "Learning Target", "notes": "PURPOSE\nName the learning target (verbatim from the Day 18 card) and its two halves: calculating with remainders (IM L19), then deciding what they mean in a story (IM L20).\n\nTIMING\n30 seconds.\n\nCLICKS\nNone.\n\nTEACHER SAYS (deck)\n\"Read the target with me. Two jobs today: first divide when it doesn't come out even, then decide what the leftover means in the story.\"\n\nSUCCESS CRITERIA\nNo Day 18 lesson plan, so no success criteria are listed.\n\nNOTATION (IM)\nIM does not write remainders as \"20 R 5\". A result with a remainder is related to a multiplication equation, for example 145 = 7 × 20 + 5. The deck follows IM."}, {"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s003.jpg", "title": "Warm Up", "notes": "PURPOSE\nIM L19 Warm-up, Notice and Wonder: Expressions and Equations. Students look for structure in division expressions and equations (MP7) and revisit factors and multiples. Prepares them for division with remainders.\n\nTIMING\n8 minutes (IM lists 10; trimmed by taking fewer shares).\n\nCLICKS\nNone. IM displays the whole table at once.\n\nLAUNCH (IM)\n• Groups of 2.\n• Display the table.\n• Teacher says (IM): \"What do you notice? What do you wonder?\"\n• 1 minute: quiet think time.\n\nACTIVITY (IM)\n• Teacher says (IM): \"Discuss your thinking with your partner.\"\n• 1 minute: partner discussion.\n• Share and record responses.\n\nANTICIPATED RESPONSES (IM)\nStudents may notice:\n• All the division expressions have a divisor of 5. (IM's guide prints \"dividend\"; the 5 is the divisor.)\n• 100 and 105 are the only dividends that are multiples of 5.\n• Each time the dividend goes up one, you add one more in the equation.\n• In each row, the total in the equation is the same as the dividend.\nStudents may wonder:\n• Why do some equations have addition and some don't?\n• Why is it adding more each time?\n• What do the equations have to do with the expressions?\n\nACTIVITY SYNTHESIS (IM)\nTeacher says (IM): \"Today, we are going to work with dividing numbers that don't have a whole number quotient.\"\n\nLOOK AT 105 (deck prompt)\nIf no one raises it: \"Look at 105 = 20 × 5 + 5. Could we make another group of 5?\" (Yes: 105 = 21 × 5. The extra can never be 5 or more.)\n\nROSENSHINE\nPrinciple 1: Begin with a short review of previous learning (factors and multiples, Math Unit 1)."}, {"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s004.jpg", "title": "Activity 1", "notes": "PURPOSE\nActivity 1 launch. Give the leftovers from the Warm-up a name before students decide whether expressions have remainders.\n\nTIMING\nAbout 2 minutes of the 12-minute Activity 1.\n\nCLICKS\nThe equation shows first. Click 1: what it means. Click 2: the word \"remainder\".\n\nTEACHER SAYS (IM, from L19 Activity 1 synthesis)\n\"This problem had a remainder. When we divide and end up with leftovers we call them remainders, because they represent what is remaining after we divide into equal groups.\"\n\nTEACHER SAYS (deck)\n\"Look at 101 ÷ 5 from our Warm-up. 101 is 20 groups of 5 with 1 left over. Is 1 enough to make another group of 5? No. That 1 is the remainder.\"\n\nCHANGE FROM IM\nIM introduces \"remainder\" at the end of L19 Activity 1 (182 ÷ 6 situations, posters, gallery walk, 25 minutes). That activity is set aside to fit 50 minutes, so the term is introduced here with IM's definition and a Warm-up example.\n\nMLR\nMLR8 Discussion Supports (IM): to support the transfer of new vocabulary to long-term memory, invite students to chorally repeat phrases that include the word \"remainder\" in unison, 1–2 times. (\"101 divided by 5 is 20 with a remainder of 1.\")\n\nMISCONCEPTION TO WATCH\nA remainder bigger than the divisor (\"20 groups with 6 left\"). Ask: \"Could you make one more group?\"\n\nROSENSHINE\nPrinciple 2: Present new material in small steps."}, {"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s005.jpg", "title": "Activity 1", "notes": "PURPOSE\nGet Ready · Do · Done send-off into Activity 1, Is There a Remainder? (Ward & Jacobsen, GDD pp. 74–79). This slide covers Activity 1 only.\n\nTIMING\nAbout 1 minute, then start the timer.\n\nCLICKS (right to left)\nClick 1: Done mat. Click 2: Do mat. Click 3: Get Ready mat.\n\nSTEP TIMES\nFrom IM L19 Activity 2: 2 minutes quiet think time, 2 minutes partner discussion, selected students share reasoning, then 3–4 minutes independent work on problem 2. The ½ checkpoint is the class share after the partner talk.\n\nTEACHER SAYS (IM launch)\n\"We are going to figure out if division expressions will result in a remainder. Look at the first problem and be prepared to share your reasoning with your partner.\"\n\nTEACHER SAYS (deck, for the mats)\n\"Future glasses on. Red mat: every expression marked remainder or no remainder with a reason, and two quotients found. Green mat: two minutes alone, two minutes with your partner, we share, then four minutes to find two values. Yellow mat: sit beside your partner, journal open.\"\n\nFUTURE-GLASSES PROMPT\n\"Picture your journal page at the end. Which two expressions will you have solved, and where will you show the leftover?\"\n\nIF–THEN OBSTACLE PROMPT\n\"If you can't tell without dividing, then think about multiples: is the dividend even? Does it end in 0 or 5? If a quotient gets long, then use partial quotients and take big chunks.\"\n\nTIMER\nSet the timer for the halfway point (4 minutes, end of partner talk). At the ½ checkpoint: \"Eyes up. Who will share their reasoning for a?\""}, {"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s006.jpg", "title": "Activity 1", "notes": "PURPOSE\nActivity 1, problem 1 (IM L19 Activity 2). Students use factors and multiples to decide if a division will have a remainder, without finding the value.\n\nTIMING\n4 minutes: 2 minutes quiet think time, 2 minutes partner discussion.\n\nCLICKS\nNone.\n\nACTIVITY (IM)\n• Monitor for students who use numerical reasoning to identify whether the expressions will have remainders.\n• Invite selected students to share their reasoning for the first problem.\n\nANTICIPATED RESPONSES (IM)\na. It will have a remainder. Since 753 isn't even, 6 cannot be a factor.\nb. It will not have a remainder. 900 is a multiple of 9 and 18 is a multiple of 9.\nc. It will have a remainder. Since 1,263 is odd, it is not a multiple of 2.\nd. It will not have a remainder. Since 2,630 ends in 0, it is a multiple of 5.\n\nUDL\nEngagement: Develop Effort and Persistence (IM). Differentiate the degree of difficulty or complexity. Begin with an expression with more accessible values, for example 22 ÷ 5.\n\nMISCONCEPTION TO WATCH\n\"753 ÷ 6 has no remainder because 7 + 5 + 3 = 15 and 15 is a multiple of 3.\" Being a multiple of 3 is not enough for 6; it must also be even.\n\nFORMATIVE ASSESSMENT\nWho explains with multiples (\"753 is odd, so it can't be a multiple of 6\") rather than dividing? Ask them to share first.\n\nHOW QUESTION\nPartners listen fully before adding on: \"Say back what your partner said, then add your idea.\""}, {"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s007.jpg", "title": "Activity 1", "notes": "PURPOSE\n½ checkpoint share for Activity 1 (IM L19 Activity 2): reasoning for problem 1.\n\nTIMING\nAbout 2 minutes.\n\nCLICKS\nClick 1–4: one expression at a time, after a student has explained it. IM asks for shares on the first problem; reveal b–d only as far as time allows.\n\nTEACHER SAYS (IM)\nInvite selected students to share their reasoning for the first problem.\n\"Now, find the value of 2 expressions, one with a remainder and one without.\"\n\nDISCUSSION PROMPT (deck)\n\"Who reasoned about 918 ÷ 9 a different way? Say back what your classmate said before you add on.\"\n\nANTICIPATED RESPONSES\nThe reasons on the slide are IM's student responses, shortened.\n\nMLR\nMLR8 Discussion Supports: \"___ is (is not) a multiple of ___ because ___.\""}, {"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s008.jpg", "title": "Activity 1", "notes": "PURPOSE\nActivity 1, problem 2 (IM L19 Activity 2). Students divide up to four-digit numbers, one with a remainder and one without.\n\nTIMING\n3–4 minutes independent work time (IM).\n\nCLICKS\nNone.\n\nANTICIPATED RESPONSES (IM, with partial quotients written out)\na. 125 with a remainder of 3. Subtract 600 (6 × 100), 120 (6 × 20), 30 (6 × 5); 3 left.\nb. 102. 900 ÷ 9 = 100 and 18 ÷ 9 = 2, and 100 + 2 = 102.\nc. 631 with a remainder of 1. Subtract 1,200 (2 × 600), 60 (2 × 30), 2 (2 × 1); 1 left.\nd. 526. Subtract 2,000 (5 × 400), 500 (5 × 100), 100 (5 × 20), 30 (5 × 6); 0 left.\n\nPROBLEM-SOLVING CONFERRING (card)\nToday's question is \"Can students justify what to do with a remainder?\" During this calculation block, also check: do they stop subtracting when what's left is smaller than the divisor?\n\nMISCONCEPTION TO WATCH\nStudents keep subtracting past zero or write a remainder of 6 for 753 ÷ 6 (stopping one group early).\n\nDIFFERENTIATION\nSupport: start with b (no remainder, friendly numbers) and a. Extension: all four, then write a multiplication equation for each.\n\nROSENSHINE\nPrinciple 5: Guide student practice."}, {"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s009.jpg", "title": "Activity 1", "notes": "PURPOSE\nActivity 1 Synthesis. Show one quotient with a remainder and one without, recorded with partial quotients (the card's mini-lesson: \"dividing with remainders using partial quotients\").\n\nTIMING\nAbout 2 minutes. Ends Activity 1.\n\nCLICKS\nClick 1: 753 ÷ 6. Click 2: 2,630 ÷ 5.\n\nACTIVITY SYNTHESIS (IM)\nTeacher says (IM): \"In the Lesson Synthesis, let's represent quotients that have leftovers when we take away as many equal groups as we can from a number.\"\n\nSAMPLE WORK\nBoth stacks use IM's sample partial quotients, retyped and colour-coded. Show student work instead where you have it.\n\nDISCUSSION PROMPTS (deck)\n• \"Why did we stop at 3 in 753 ÷ 6?\" (3 is less than 6, so there aren't enough to make another group of 6.)\n• \"How does the last line of each stack tell us whether there is a remainder?\"\n\nLINK\nTomorrow's Checkpoint asks students to explain why there is a remainder. Listen for \"not enough to make another group.\""}, {"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s010.jpg", "title": "Activity 2", "notes": "PURPOSE\nActivity 2 launch (IM L20 Activity 1, Hearts and Seats). Students interpret quantities in situations, represent them, solve, and interpret the solution in context (MP2). Dividends are three-digit.\n\nTIMING\nAbout 1 minute of the 15-minute Activity 2.\n\nCLICKS\nNone.\n\nLAUNCH (IM)\n• Groups of 2.\n\nTEACHER SAYS (deck)\n\"Two story problems today. Both have leftovers. Your job is to decide what the leftover means in each story.\"\n\nUDL\nAction and Expression: Develop Expression and Communication (IM). Develop fluency with multiplication by 4 and 9. Provide a partially completed two-column table for each factor, and suggest that students record times tables that might be helpful before getting started (9 × 1 = 9, 9 × 2 = 18 … 9 × 10 = 90 in one column; 9 × 10 = 90, 9 × 20 = 180 … 9 × 100 = 900 in the other). Repeat for 4."}, {"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s011.jpg", "title": "Activity 2", "notes": "PURPOSE\nGet Ready · Do · Done send-off into Activity 2, Hearts and Seats (Ward & Jacobsen, GDD pp. 74–79). This slide covers Activity 2 only.\n\nTIMING\nAbout 1 minute, then start the timer.\n\nCLICKS (right to left)\nClick 1: Done mat. Click 2: Do mat. Click 3: Get Ready mat.\n\nSTEP TIMES\nFrom IM L20 Activity 1: 5–6 minutes independent work time, then 2–3 minutes partner discussion. The deck splits the independent time 3 + 3 across the two problems. The ½ checkpoint is at the end of independent work.\n\nTEACHER SAYS (deck)\n\"Future glasses on. Red mat: both problems solved with work shown, a sentence saying which artist you agree with and why, and the number of rows and the seats in the short row. Green mat: three minutes on hearts, three on seats, then three minutes with your partner. Yellow mat: journal open, times-table helper if you want it.\"\n\nFUTURE-GLASSES PROMPT\n\"Picture the hearts problem when you're done. What will your sentence say about the 2 extra hearts?\"\n\nIF–THEN OBSTACLE PROMPT\n\"If you and your partner disagree about the hearts, then each explain your thinking before deciding. Both answers can make sense if you say what you're assuming. If 378 ÷ 4 feels big, then start with 4 × 90.\"\n\nTIMER\nSet the timer for the halfway point (6 minutes, end of independent work). At the ½ checkpoint: \"Turn to your partner. Listen to their whole reason before you share yours.\""}, {"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s012.jpg", "title": "Activity 2", "notes": "PURPOSE\nActivity 2, problem 1 (IM L20 Activity 1). Interpret a remainder in context: is the answer 94 or 95 boxes?\n\nTIMING\nAbout 3 minutes of the independent work time.\n\nCLICKS\nNone.\n\nACTIVITY (IM)\n• 5–6 minutes: independent work time (both problems).\n• 2–3 minutes: partner discussion.\n• Monitor for students who appropriately interpret remainders based on the situation.\n\nANTICIPATED RESPONSES (IM sample responses)\n• I agree with the first artist. 378 ÷ 4 is 94 with a remainder of 2. The artists can't put the 2 extra hearts in a box and sell half a box, so they only need 94 boxes.\n• I agree with the second artist. If all the hearts are to be put in a box, there will be 94 boxes of 4 and 1 box with only 2 hearts. This means they will need 95 boxes.\n\nMISCONCEPTION TO WATCH\nStudents who find 94 R2 and answer \"94.2 boxes\" or \"94 boxes and 2\", without saying what happens to the 2 hearts.\n\nDIFFERENTIATION\nSupport: the times-table helper for 4; draw a few boxes to start. Extension: \"How many more hearts would they need to fill the 95th box?\"\n\nPROBLEM-SOLVING CONFERRING (card)\nCan students justify what to do with a remainder for a specific context, not just calculate it? Ask: \"What happens to the 2 hearts in your answer?\""}, {"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s013.jpg", "title": "Activity 2", "notes": "PURPOSE\nActivity 2, problem 2 (IM L20 Activity 1). Here the remainder answers its own question: it is the number of seats in the short row.\n\nTIMING\nAbout 3 minutes of the independent work time, then 2–3 minutes partner discussion for both problems.\n\nCLICKS\nNone.\n\nANTICIPATED RESPONSE (IM)\nThere are 28 rows of 9 and 1 row of 6. Sample reasoning: 258 divided by 9 is 28 with a remainder of 6.\n\nDIAGRAM NOTE\nThe seat drawing is a sketch drawn for the deck: three full rows, \"⋮\" for the rest, and a dashed short row. It does not show the answer.\n\nMISCONCEPTION TO WATCH\nStudents who say \"29 rows\" and stop. Ask: \"Is the 29th row a row of 9?\"\n\nDIFFERENTIATION\nSupport: times-table helper for 9 (9 × 20 = 180, 9 × 30 = 270). Extension: \"How many people could sit if the short row were full?\"\n\nFORMATIVE ASSESSMENT\nCompare the two problems: who notices the remainder was \"extra\" for hearts but \"the answer\" for seats? Invite them to share in the synthesis."}, {"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s014.jpg", "title": "Activity 2", "notes": "PURPOSE\nActivity 2 Synthesis (IM L20 Activity 1). Connect each answer to an equation and to what the remainder means in the story.\n\nTIMING\nAbout 3 minutes. Ends Activity 2.\n\nCLICKS\nClick 1: hearts equation. Click 2: the two readings, 94 and 95. Click 3: the assumption statement. Click 4: seats equation. Click 5: seats answer.\n\nACTIVITY SYNTHESIS (IM)\n• Invite students to share their responses and reasoning.\n• For the first problem, highlight that both 94 and 95 boxes are plausible if they could be defended and the assumptions are made clear. (For example, students might say that the artists could have two leftover hearts rather than trying to sell them in boxes, so 94 boxes are enough.)\n• \"What equation could we write to describe the relationship between the number of hearts and the number of full boxes?\" (One possible equation: (94 × 4) + 2 = 378.)\n• For the last problem, ask: \"What equation could we write to describe the relationship between the number of rows and the number of seats?\" (One possible equation: (28 × 9) + 6 = 258.)\n\nHOW QUESTION (Teacher says, deck)\n\"Who heard a classmate's reason for the other artist and thought, 'That makes sense too'? That's what really listening sounds like.\"\n\nLINK TO THE CARD\nThe card's discussion (round up, leave it out) comes next in the Lesson Synthesis."}, {"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s015.jpg", "title": "Lesson Wrap Up", "notes": "PURPOSE\nLesson Synthesis, part 1 (IM L19). Students read and write equations that show a remainder.\n\nTIMING\nAbout 3 minutes of the 8-minute Lesson Synthesis.\n\nCLICKS\nThe equation shows first. Click 1: first question. Click 2: second question. Click 3: the 1,263 equation.\n\nTEACHER SAYS (IM)\n\"Today, we saw that sometimes when you divide numbers, you get a remainder.\"\nDisplay 753 = 6 × 125 + 3.\n\"How does this equation show that 753 ÷ 6 has a remainder?\" (It shows 753 is not a multiple of 6. It also shows 6 and 125 make a factor pair for 750, and 753 is 3 more than that.)\n\"How can we write an equation to show that 1,263 ÷ 2 has a remainder?\" (1,263 = 2 × 631 + 1)\n\nNOTATION\nIM writes 753 = 6 × 125 + 3 without brackets. The slide adds brackets to match the hearts and seats equations; both mean the same thing."}, {"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s016.jpg", "title": "Lesson Wrap Up", "notes": "PURPOSE\nLesson Synthesis, part 2, from the Day 18 sequence card: \"Discuss rounding up, dropping the remainder, or expressing it as a fraction, matched to context — round up for 'how many buses do we need,' drop it for 'how many full teams can we make.'\"\n\nTIMING\nAbout 5 minutes.\n\nCLICKS\nThe question shows first. Click 1: add one more group. Click 2: leave it out.\n\nTEACHER SAYS (deck)\n\"Back to our WHAT question: what should we do with a remainder, and does the answer change depending on the story? Turn to your partner. Listen to their whole answer, then say it back before you add yours.\"\n\nTEACHER SAYS (IM L20 synthesis, optional if time)\n\"What if the remainder was four flowers left over after all the flower pots were filled, what would we do then?\" (We could put more flowers in some pots or just give the extra flowers away.)\n\nANTICIPATED RESPONSES (samples)\n• Buses: 5 kids left still need a ride, so we need one more bus.\n• Teams: 3 kids can't make a full team, so we leave them out of the count (they could join other teams).\n• Seats: the leftover was the answer to the question, the short row.\n\nTHIRD OPTION ON THE CARD\nThe card also names \"expressing it as a fraction\". Grade 4 IM does not use fractional remainders in Unit 6, and the deck leaves it off the slide. Mention it only if a student raises sharing something that can be cut (a pizza, a ribbon).\n\nLINK TO TOMORROW\nDay 19 is the M4 Checkpoint. Students will decide what to do with a leftover in a story and explain why there is a remainder."}, {"img": "_hub/slides/Math_U2_L18_Dividing_with_Remainders/s017.jpg", "title": "Cool Down", "notes": "PURPOSE\nIM L19 Cool-down, Remainders. One task, 5 minutes. Checks the first half of the target: dividing with a remainder using partial quotients.\n\nTIMING\n5 minutes.\n\nCLICKS\nNone.\n\nSTUDENT RESPONSE (IM)\n466 groups with a remainder of 1. Sample: 1,865 − 1,600 (4 × 400) = 265; 265 − 200 (4 × 50) = 65; 65 − 40 (4 × 10) = 25; 25 − 24 (4 × 6) = 1. 400 + 50 + 10 + 6 = 466, 1 left over.\n\nRESPONDING TO STUDENT THINKING (IM)\nStudents use many partial quotients and lose track of the answer.\nNext Day Support (IM): Launch Warm-up or the first activity by highlighting important notation from previous lessons.\n\nWHY THIS COOL-DOWN\nThe IM L20 Cool-down (Miscounting? Is 194 a multiple of 6?) is set aside. Day 19's Review (is 295 a multiple of 8?) practises the same reasoning, and this Cool-down gives y
