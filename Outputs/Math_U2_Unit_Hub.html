 Do · Done (Ward & Jacobsen)."}, {"img": "_hub/slides/Math_U2_L11_Partial_Products_and_the_Standard_Algorithm/s005.jpg", "title": "Activity 1", "notes": "PURPOSE: Activity 1, Problem 1. Students are introduced to the standard algorithm by comparing it to the partial products algorithm they know. No regrouping is needed here. They build an argument for what Kiran did (MP3).\n\nTIMING: 3 minutes partner discussion, then a pause for whole-class discussion.\n\nCLICKS: Both algorithms show first. Click 1: question a. Click 2: question b.\n\nTEACHER SAYS:\n“Make sense of Kiran and Diego's algorithms. Talk to your partner about how they are alike and different, and how Kiran might have found his answer.”\n\nANTICIPATED RESPONSES:\n• Alike: they both have the same result. Kiran's way doesn't show his steps, but you can see the partial products in Diego's way.\n• Kiran was doing the same process as Diego in terms of finding partial products, but he added the products in his head after finding each partial product.\n\nWATCH FOR / MISCONCEPTIONS:\n• The two algorithms are redrawn from the IM guide with typed digits. Check against your teacher guide.\n\nDIFFERENTIATION AND SUPPORT:\n• Groups of 2. Invite students to share conjectures on how Kiran might have reasoned. Alternatively, poll students on scenarios A–D (see notes on the next slide).\n• MLR8 Discussion Supports: create a visual display of Diego's algorithm. As students share their strategies, annotate the display: next to each step, write the multiplication expression used to find each partial product.\n\nCALLOUTS: IM Activity 1. MP3 construct viable arguments."}, {"img": "_hub/slides/Math_U2_L11_Partial_Products_and_the_Standard_Algorithm/s006.jpg", "title": "Activity 1", "notes": "PURPOSE: Demonstrate Kiran's process. Kiran reasoned about 3 × 3, 3 × 1 and 3 × 7 while paying attention to the place value of each digit, instead of 3 × 3, 3 × 10 and 3 × 700.\n\nTIMING: About 3 minutes.\n\nCLICKS: Clicks 1–3: one digit at a time with its partial product in Diego's layout. Click 4: Kiran adds in his head, and the total.\n\nTEACHER SAYS:\n“Kiran had multiplied 3 by each digit in 713, but instead of reasoning about 3 × 3, 3 × 10, and 3 × 700, Kiran reasoned about 3 × 3, 3 × 1, and 3 × 7, while paying attention to the place value of each digit.”\n“Because the 3 in 713 means 3 ones, he wrote the result of 3 × 3 or 9 in the ones place.”\n“Because the 1 means 1 ten, he wrote the result of 3 × 1 in the tens place.”\n“Because the 7 means 7 hundreds, he wrote the result of 3 × 7 in the hundreds place.”\n\nDISCUSSION PROMPTS:\n• Scenarios to poll on, if you want them (IM guide): A: Kiran found (3 × 700) + (3 × 13) mentally and wrote down the result of 2,100 + 39. B: Kiran used the same method as Diego but added the 9, 30, and 2,100 mentally, without writing them down. C: Kiran drew a diagram and did the computation on another sheet of paper and wrote the result here. D: Kiran multiplied the single-digit 3 with each digit in 713 and wrote each partial product in a single line.\n\nDIFFERENTIATION AND SUPPORT:\n• The colors match Diego's partial products so students can trace each one.\n\nCALLOUTS: Rosenshine Principle 4: provide models."}, {"img": "_hub/slides/Math_U2_L11_Partial_Products_and_the_Standard_Algorithm/s007.jpg", "title": "Activity 1", "notes": "PURPOSE: Problem 2. Students try Kiran's way on two new products. Kiran's way is the standard algorithm; they are not required to use it.\n\nTIMING: 3 minutes independent work time, 2 minutes partner discussion.\n\nTEACHER SAYS:\n“Try using Kiran's algorithm to find the value of the last two products.”\n\nANTICIPATED RESPONSES:\n• 212 × 4 = 848.\n• 3 × 4,132 = 12,396.\n\nWATCH FOR / MISCONCEPTIONS:\n• Students who write 3 × 4,132 as 3 × 4 = 12 and put the 12 in one column. 12,396 needs 3 × 4,000 = 12,000.\n\nDIFFERENTIATION AND SUPPORT:\n• Consider demonstrating the process of Kiran's strategy to find 3 × 4,132 in the synthesis. Then say: Kiran's strategy is called the 'standard algorithm for multiplication.' We'll take a closer look at this algorithm in the next activity.\n\nFORMATIVE ASSESSMENT: Select students to share and explain their calculations of the last two products."}, {"img": "_hub/slides/Math_U2_L11_Partial_Products_and_the_Standard_Algorithm/s008.jpg", "title": "Activity 2", "notes": "PURPOSE: Get Ready · Do · Done send-off into Activity 2 (Ward & Jacobsen, GDD pp. 74–79).\n\nTIMING: 2 minutes, then start the timer.\n\nCLICKS: Click 1: Done. Click 2: Do. Click 3: Get Ready. (Right to left.)\n\nTEACHER SAYS:\n“Put on your future glasses. When you are done, you have written how Kiran's and Diego's algorithms are alike and different, found the 12 in Kiran's algorithm, solved 512 × 3 with Kiran's way, and checked it a second way.”\n“Now the Do mat. With your partner, 3 to 4 minutes. Then we pause. Then 512 × 3 on your own, 3 minutes. Then check a second way and talk with your partner.”\n“Last, Get Ready. Activity 2 page, pencil, blank paper. Clear everything else.”\n“If you get stuck where the 1 goes, then ask: what is 12 made of?”\n“Timer is set for the halfway point.”\n\nDIFFERENTIATION AND SUPPORT:\n• Set the timer for the halfway point, not the end (GDD p. 79).\n• Engagement (Internalize Self-Regulation), from the IM guide: in the synthesis, give students a chance to self-assess. Remind them what multiplication they did before this unit and ask them to list the new strategies they have learned in this section.\n• The Do times come from the IM guide. There is no Day 11 lesson plan in the project yet.\n\nCALLOUTS: EF: Get Ready · Do · Done (Ward & Jacobsen)."}, {"img": "_hub/slides/Math_U2_L11_Partial_Products_and_the_Standard_Algorithm/s009.jpg", "title": "Activity 2", "notes": "PURPOSE: Activity 2, Problem 1. Students compare the standard algorithm with a partial products algorithm where regrouping is needed. The 1 above the tens column is the new convention.\n\nTIMING: 3–4 minutes partner work time, then a brief class discussion.\n\nCLICKS: Both algorithms show first. Click 1: question a. Click 2: question b.\n\nTEACHER SAYS:\n“Work with your partner on the first problem.”\n(Pause) In Kiran's algorithm, why is a 1 written above the 2 in the tens column?\n“Where have we seen this notation before?”\n\nANTICIPATED RESPONSES:\n• Alike: they both multiply the same numbers and have the same answer. Different: one shows all the place values and the other has a small one on top.\n• The 12 is decomposed into 10 + 2. The 2 is in the ones place and the 10 is a 1 added to the tens place.\n• The 1 represents 1 ten from the number 12. It helps us remember to add it to the tens place because we are doing a lot of calculations in our heads.\n• When we add using the standard algorithm, we use this notation to show that we have more than 9 ones, tens or hundreds, and so on, in a given place; we add each group of 10 units to the place value to the left.\n\nWATCH FOR / MISCONCEPTIONS:\n• Students who think the little 1 is 1 more, not 1 ten. Ask: how many tens are in 12?\n\nCALLOUTS: Rosenshine Principle 4: provide models. Connects to the standard algorithm for addition from earlier in the year."}, {"img": "_hub/slides/Math_U2_L11_Partial_Products_and_the_Standard_Algorithm/s010.jpg", "title": "Activity 2", "notes": "PURPOSE: Problem 2. Students use the standard algorithm on a new problem and check with a method they trust (partial products, a diagram, or another method).\n\nTIMING: 3 minutes independent work time, 1–2 minutes partner discussion.\n\nCLICKS: Click 1: part b, after students have tried part a.\n\nTEACHER SAYS:\n“Kiran's used the standard algorithm for multiplication. Try using it to find 512 × 3.”\n“In the Lesson Synthesis, let's compare ways we kept track of the partial products.”\n\nANTICIPATED RESPONSES:\n• a. 1,536. b. Students check using an algorithm showing partial products, a diagram, or another method.\n\nWATCH FOR / MISCONCEPTIONS:\n• Students who write 3 × 2 = 6, 3 × 1 = 3, 3 × 5 = 15 and leave the 15 as one column. The 15 goes in the thousands and hundreds places.\n\nFORMATIVE ASSESSMENT: Problem-Solving Conferring: can students point to where the standard algorithm's steps match the partial products?\n\nCALLOUTS: MP8 look for and express regularity."}, {"img": "_hub/slides/Math_U2_L11_Partial_Products_and_the_Standard_Algorithm/s011.jpg", "title": "Lesson Wrap Up", "notes": "PURPOSE: Lesson Synthesis. Students compare the standard algorithm with partial products on 3 × 512 and hear that they will study it more in IM Grade 5.\n\nTIMING: 10 minutes.\n\nCLICKS: 3 × 512 shows first. Click 1: the question. Click 2: the partial-products reasoning. Click 3: the standard algorithm reasoning, step by step.\n\nTEACHER SAYS:\n“Today we compared the standard algorithm for multiplication to an algorithm that uses partial-products. Let's see how we'd find 3 × 512.”\n“How would you find the value of the product?”\n\nDISCUSSION PROMPTS:\n• Where is the 36 in the standard algorithm? (The 6 in the ones place and the 3 in the tens place.)\n\nANTICIPATED RESPONSES:\n• I know that 500 × 3 is 1,500 and 12 × 3 is 36 and 1,500 + 36 = 1,536. Three times 2 is 6, so that goes in the ones place. 3 times 1 is 3, so that goes in the tens place. 3 times 5 is 15, so that goes in the thousands and hundreds place.\n\nDIFFERENTIATION AND SUPPORT:\n• Assure students that they are not expected to use a particular method for multi-digit multiplication in IM Grade 4. Explain that they will study this algorithm more in IM Grade 5. Invite them to try to use it to multiply as we continue to work through lessons.\n\nFORMATIVE ASSESSMENT: Revisit the learning target. Can students point to where a step of the standard algorithm matches a partial product?\n\nCALLOUTS: Rosenshine Principle 6: check for understanding."}, {"img": "_hub/slides/Math_U2_L11_Partial_Products_and_the_Standard_Algorithm/s012.jpg", "title": "Cool Down", "notes": "PURPOSE: Cool-down. Students choose any way to multiply and show their reasoning.\n\nTIMING: 5 minutes.\n\nTEACHER SAYS:\n“Find the value of each product. Explain or show your reasoning.”\n\nANTICIPATED RESPONSES:\n• 1. 3,192. Sample: (4 × 700) + (4 × 90) + (4 × 8) = 2,800 + 360 + 32 = 3,192. Or: 798 is 2 less than 800, so 4 groups of 798 is 4 × 2 less than 4 × 800, or 8 less than 3,200, which is 3,192.\n• 2. 22,912. Sample: (8 × 2,000) + (8 × 800) + (8 × 60) + (8 × 4) = 16,000 + 6,400 + 480 + 32 = 22,912.\n\nWATCH FOR / MISCONCEPTIONS:\n• Responding to Student Thinking (IM): students may decompose the multi-digit factors by place value and correctly find the partial products but make computation errors when adding them.\n\nDIFFERENTIATION AND SUPPORT:\n• Next Day Support (IM): before the Warm-up, invite students to work in small groups to discuss a correct response to this Cool-down.\n• Prior-Unit Support: Days 9–10, partial products algorithms.\n\nFORMATIVE ASSESSMENT: Sort: correct with any method / correct partial products, addition error / place value error.\n\nCALLOUTS: Standard 4.NBT.B.5."}]}, "Math U2 L12_Doubling & Halving.pptx": {"name": "Math U2 L12_Doubling & Halving.pptx", "slug": "Math_U2_L12_Doubling_Halving", "pptx": null, "pdf": null, "sprite": "_hub/slides/Math_U2_L12_Doubling_Halving/sprite.jpg", "tw": 192, "th": 108, "landscape": true, "slides": [{"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s001.jpg", "title": "Doubling, Halving and the Strategy Forum", "notes": "PURPOSE: Open Day 12 (Bridges Supplement: Doubling & Halving, and a Strategy Forum) and set the split-screen intentions.\n\nTIMING: 1 minute\n\nTEACHER SAYS:\n“Today we ask what happens to a product when we double a factor or cut it in half. Then we hold a math forum. Being responsive means that what a classmate shows can change how you think about a problem.”\n\nDISCUSSION PROMPTS:\n• WHAT (Day 12 card): As mathematicians, what happens to a product when we double one factor — or cut it in half — and which of our recording methods shows that most clearly?\n• HOW (Communicators · Responsive): As communicators, how can being responsive to a classmate’s strategy in the forum help us understand a new way to think about a problem?\n\nCALLOUTS: Standards: addressing 4.NBT.5; building on 3.OA.5; building toward 5.NBT.5. Day 12 is practice, nothing is scored. Duration 60 minutes: Warm-up 10, Activity 1 15, Activity 2 20, Lesson Synthesis 10, Cool-down 5."}, {"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s002.jpg", "title": "Learning Target", "notes": "PURPOSE: Name the learning target. Connect to the Essential Question: How can we change the factors in a multiplication problem so it is easier to solve, and how do we know the product stays the same?\n\nTIMING: 1 minute\n\nCLICKS: Click 1: the Problem-Solving Conferring focus from the card (can students explain WHY a strategy worked?).\n\nTEACHER SAYS:\n“Read the target with me. Today your job is to explain why a strategy works, not only to get an answer.”\n\nFORMATIVE ASSESSMENT: Day 12 is practice. Nothing is scored. Forum notes tell you who needs support before the M3 Checkpoint on Day 14.\n\nCALLOUTS: Learning target taken verbatim from the Day 12 card. Rosenshine Principle 1: review/orient."}, {"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s003.jpg", "title": "Success Criteria", "notes": "PURPOSE: Success criteria for today. Students come back to these in the synthesis.\n\nTIMING: 1 minute\n\nTEACHER SAYS:\n“These are the five things we are looking for today. Which one are you most curious about?”\n\nFORMATIVE ASSESSMENT: Criteria 1 and 2: Warm-up and Activity 1 journal work, partner talk. Criterion 3: conferring and forum. Criterion 4: written sentence at the end of Activity 2 (part b of the M3 Checkpoint in practice form). Criterion 5: forum participation.\n\nCALLOUTS: Executive Functioning / UDL: criteria as a visible checklist."}, {"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s004.jpg", "title": "Warm Up", "notes": "PURPOSE: Number Talk, Bridges Session 3 problem string, Part 1 (Building On 3.OA.5). The second problem doubles a factor and the third halves one. Students watch what happens to the product each time. Looking for the same thing in each step is MP8.\n\nTIMING: 10 minutes: about 1 minute solo per problem, then 1–1½ minutes to share 2–3 strategies per problem.\n\nCLICKS: Reveal one problem at a time. Click 1: 4 × 6. Click 2: 8 × 6. Click 3: 8 × 3. Click 4: sentence frame. Show a column only after students solve on their own; record student strategies as arrays under the document camera. The arrays on the slide are samples.\n\nTEACHER SAYS:\n“Today we start with three problems, one at a time. Solve each one on your own in your journal. Then I’ll ask two or three of you to share, and I’ll draw your thinking as an array.”\n“What happened to the 4 when we went from 4 × 6 to 8 × 6? What happened to the product?”\n“What happened to the 6 when we went from 8 × 6 to 8 × 3? What happened to the product?”\n“Why does the product double when one factor doubles? Use the array to show me.”\n\nANTICIPATED RESPONSES:\n• 4 × 6 = 24. “4 rows of 6: 6, 12, 18, 24.”\n• 8 × 6 = 48. “8 is double 4, so I stacked two 4 × 6 arrays. 24 + 24 = 48.” One factor doubled (4 → 8) and the product doubled (24 → 48).\n• 8 × 3 = 24. “The 6 got cut in half, so I cut the 8 × 6 array into two 8 × 3 arrays. Each one is 24.” One factor was cut in half (6 → 3) and the product was cut in half (48 → 24).\n• Two 4-by-6 arrays fit together to make the 8-by-6 array. That is two groups of 24.\n\nDIFFERENTIATION AND SUPPORT:\n• Grid paper (TM T1) on every desk. Base ten pieces on the back table.\n• MLR8 Discussion Supports: sentence frames on the board: “When one factor doubles, the product ___.” “I know because ___.”\n• ELL (Bridges): model “half” and “halving” by cutting a piece of paper in half, or by sketching an array and cutting it in half.\n• Challenge (Bridges): find the most efficient strategy you can, then look back and think of one that is even more efficient.\n\nFORMATIVE ASSESSMENT: Listen for who says the product doubled or halved, and who gives a reason.\n\nCALLOUTS: Rosenshine Principles 2, 3, 4 (Principle 4: provide models; each student share is recorded as an array)."}, {"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s005.jpg", "title": "Warm Up", "notes": "PURPOSE: Warm-up synthesis. Students name what happens to the product when one factor doubles or is cut in half. Record the Big Idea on chart paper and leave it up through the M3 Checkpoint on Day 14.\n\nTIMING: About 2 minutes inside the 10-minute Warm-up.\n\nCLICKS: Click 1: doubling. Click 2: halving. Click 3: the Big Idea. Ask the question and take student answers before each click.\n\nTEACHER SAYS:\n“What happened to the 4 when we went from 4 × 6 to 8 × 6? What happened to the product?”\n“What happened to the 6 when we went from 8 × 6 to 8 × 3? What happened to the product?”\n\nDIFFERENTIATION AND SUPPORT:\n• Add double, half, halve, factor, product, array and “stays the same” to a running word list (MLR2 Collect and Display) and point to it during partner talk.\n\nCALLOUTS: Rosenshine Principle 3: ask questions. MP8."}, {"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s006.jpg", "title": "Activity 1", "notes": "PURPOSE: Get Ready · Do · Done send-off into Activity 1 (Ward & Jacobsen, GDD pp. 74–79). It covers the student work in this activity only; a second GDD slide comes before Activity 2.\n\nTIMING: 2 minutes, then start the timer.\n\nCLICKS: Click 1: Done. Click 2: Do. Click 3: Get Ready. (Right to left.)\n\nTEACHER SAYS:\n“Put on your future glasses. When you are done, you have an answer and an array for each problem, you decided true or false with a reason, and you can say the big idea in your own words.”\n“Now the Do mat. Problem string first: solve each problem alone, then we share, about 7 minutes. We pause at the halfway point. Then true or false with a partner, then say the big idea.”\n“Last, Get Ready. Journal and pencil, grid paper on your desk. Sit beside your partner. Base ten pieces are on the back table.”\n“If you get stuck, then reread the problem, look at the diagram or the steps above it, and ask your partner what each number is worth.”\n“I will set the timer for the halfway point.”\n\nDIFFERENTIATION AND SUPPORT:\n• Step times follow the Activity 1 timing in the Day 12 plan.\n• Set the timer for the halfway point, not the end (GDD p. 79).\n• Do times come from the plan: about 7 minutes for the string, 4 for the equations, 3 to wrap up.\n\nCALLOUTS: EF: Get Ready · Do · Done (Ward & Jacobsen)."}, {"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s007.jpg", "title": "Activity 1", "notes": "PURPOSE: Bridges Session 3 problem string, Part 2. Students see that when one factor doubles and the other is cut in half, the product stays the same. Spend the least time on 8 × 6 (about 1 minute) and the most on 4 × 12 (about 3 minutes). About 7 minutes for the string.\n\nTIMING: 7 minutes\n\nCLICKS: One row per click, one problem at a time: students solve alone, then 2–3 share, then reveal the row and the answer. Click 5: the comparison question. The arrays on the slide are samples; record student strategies on grid paper.\n\nTEACHER SAYS:\n“In the Warm-up, one factor changed each time. Now both factors will change. As each problem comes up, look back at the one before it. What changed? What stayed the same?”\n“How do the arrays for 4 × 12 and 8 × 6 show that the product is the same?”\n\nANTICIPATED RESPONSES:\n• 4 × 12 = 48. A: “I split 12 into 10 and 2. 4 × 10 = 40 and 4 × 2 = 8. 40 + 8 = 48.” B: “I cut the 8 × 6 array into two 4 × 6 arrays and slid one next to the other. 24 + 24 = 48.”\n• 2 × 24 = 48. “2 × 20 = 40 and 2 × 4 = 8.” Another student: “4 × 12 became 2 × 24. I cut the 4 in half and doubled the 12.”\n• 1 × 48 = 48. “Any number times 1 is itself.” Another: “I cut the 2 in half and doubled the 24.”\n• We cut the 8 × 6 array into two 4 × 6 arrays and slid them next to each other. We did not add or remove any squares.\n\nWATCH FOR / MISCONCEPTIONS:\n• Bridges notes most fourth graders will not see the double-half relationship at 4 × 12. That is fine. By 2 × 24 and 1 × 48 they begin to understand.\n• Before moving on, make sure students are comfortable with the Warm-up. If not, repeat with 3 × 10 and 6 × 10.\n\nDIFFERENTIATION AND SUPPORT:\n• Optional recording: write first factors in one column and second factors in the next with “× ½” arrows on the left and “× 2” arrows on the right (8, 4, 2, 1 and 6, 12, 24, 48).\n\nCALLOUTS: Rosenshine Principle 2: present new material in small steps with student practice after each step."}, {"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s008.jpg", "title": "Activity 1", "notes": "PURPOSE: Students judge three equations true or false. Deciding 3 × 14 = 6 × 7 without finding both products first is reasoning abstractly (MP2). Explaining to a partner is constructing a viable argument (MP3). About 4 minutes for the equations and 3 minutes to wrap up the string.\n\nTIMING: 7 minutes\n\nCLICKS: The three equations show at the start. Click 1–3: each verdict, after students turn and talk. Click 4: how to make the last equation true. Click 5: say the big idea.\n\nTEACHER SAYS:\n“True or false? How do you know?”\n“How could we change 5 × 12 = 10 × 24 to make it true?”\n“Work with your partner to say the big idea from this string in your own words.”\n“If no student gives a clear summary, say it yourself, short and plain: When one factor doubles and the other is cut in half, the product stays the same. Add it under the first Big Idea on the chart.”\n“There will be more time to think about this. You do not have to have it all today.”\n\nANTICIPATED RESPONSES:\n• 4 × 12 = 2 × 24: True. Both are 48.\n• 3 × 14 = 6 × 7: True. 3 × 14 = 42 and 6 × 7 = 42.\n• 5 × 12 = 10 × 24: False. 60 and 240. To make it true: change the 24 to 6 (5 × 12 = 10 × 6 = 60); or change the left side to 20 × 12 = 240; or change the 12 to 48 (5 × 48 = 240).\n• Why is 3 × 14 = 6 × 7 true even though no number matches? The 3 doubled and the 14 was cut in half, so the product stays 42.\n• When would doubling one factor and halving the other help? When it turns a hard problem into one I know. 5 × 16 is hard for me. 10 × 8 is easy.\n\nWATCH FOR / MISCONCEPTIONS:\n• Students who think doubling both factors keeps the product the same. Ask them to draw 2 × 3 and 4 × 6. Are they the same size? (6 and 24: the second is four times as big.)\n• If students say the products are the same “because they are both 48” but cannot say why: What happened to the first factor? The second? Show me on the array where the squares from 8 × 6 went.\n• Teacher background, not for students: Bridges uses 3½ × 8 as a double/half example. That uses a mixed number, which is beyond Grade 4. Use whole numbers.\n\nFORMATIVE ASSESSMENT: Listen for which students say the product stays the same without a reason (mark them on your clipboard).\n\nCALLOUTS: Rosenshine Principles 2, 5, 6. MP2, MP3."}, {"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s009.jpg", "title": "Activity 1", "notes": "PURPOSE: Keep the first Big Idea on chart paper, then add the second one after a student, or you, says it. The chart stays up through the M3 Checkpoint on Day 14.\n\nTIMING: About 1 minute (end of Activity 1).\n\nCLICKS: Click 1: the second Big Idea, once a student has said it in their own words. Click 2: a quick check with new numbers (not from the plan; optional, delete it if you prefer).\n\nTEACHER SAYS:\n“When one factor doubles and the other is cut in half, the product stays the same.”\n\nDIFFERENTIATION AND SUPPORT:\n• Ask the student who explains most clearly to model their thinking with an array so others can see it.\n\nCALLOUTS: Rosenshine Principle 6: check for understanding. The “Try it” prompt is an optional extra check with new whole numbers."}, {"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s010.jpg", "title": "Activity 2", "notes": "PURPOSE: Get Ready · Do · Done send-off into Activity 2 (Ward & Jacobsen, GDD pp. 74–79). It covers the 7 minutes of partner work before the forum.\n\nTIMING: 2 minutes, then start the timer.\n\nCLICKS: Click 1: Done. Click 2: Do. Click 3: Get Ready. (Right to left.)\n\nTEACHER SAYS:\n“Put on your future glasses. When you are done, both of your pages are filled in, you have an estimate and a strategy for each problem, and you can say why your strategy works.”\n“Now the Do mat. Problem 1 first: what is it asking, estimate, then solve. We will pause at the halfway point. Then Problem 2.”\n“Last, Get Ready: journal, pencil, grid paper and your page. Sit beside your partner. Tools are on your desk and on the back table.”\n“If you get stuck, then outline the coop with grid paper or base ten pieces and find the total of the pieces.”\n“I will set the timer for the halfway point.”\n\nDIFFERENTIATION AND SUPPORT:\n• The Do step times are a suggested split of about 7 minutes of partner work (plan: pairs solve Problem 1, then Problem 2). Adjust to your class.\n• Set the timer for the halfway point, not the end (GDD p. 79).\n• Pick your three forum pairs during this time (see Before the Lesson in the plan).\n\nCALLOUTS: EF: Get Ready · Do · Done (Ward & Jacobsen)."}, {"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s011.jpg", "title": "Activity 2", "notes": "PURPOSE: Launch for the Strategy Forum. Display only the first row of SB 66 and have a student read problem 1 aloud. Students first work out what is being asked and estimate before solving. Read the story wording from your own copy of SB 66; the slide follows the plan.\n\nTIMING: 3 minutes of launch, then about 7 minutes of pair work (Problem 1, then Problem 2).\n\nCLICKS: Click 1: what is it asking. Click 2: estimate. Click 3: the efficiency reminder.\n\nTEACHER SAYS:\n“Turn to your partner. What is this problem asking us to do?”\n“Now estimate. About how big is the coop? Tell your partner your estimate and how you got it.”\n“You are looking for an efficient strategy, and you can use any strategy you have learned this year. Tools are on your desk and on the back table. Both partners fill in their own page.”\n\nANTICIPATED RESPONSES:\n• About 130, because 10 × 13 = 130 and 12 is a little more than 10.\n• About 120, because 12 × 10 = 120 and 13 is a little more than 10.\n• Area diagram (12 = 10 + 2, 13 = 10 + 3): 100 + 30 + 20 + 6 = 156 square feet.\n• Two partial products: 12 × 10 + 12 × 3 = 120 + 36 = 156.\n• Standard algorithm in rows: 13 × 2 = 26, 13 × 10 = 130, 26 + 130 = 156.\n• Ratio table: 1 × 13 = 13, 2 × 13 = 26, 10 × 13 = 130. 130 + 26 = 156.\n\nWATCH FOR / MISCONCEPTIONS:\n• Monitor for repeated addition or skip counting by 13; a 12-by-13 array broken into four parts; two partial products or the standard algorithm; a pair who notice 12 × 13 and 6 × 26 have the same product and say why.\n\nDIFFERENTIATION AND SUPPORT:\n• Problem-Solving Conferring (from the card): Can students explain WHY a strategy worked, not just that it did? Try: “You split 12 into 10 and 2. Why does that work? Show me where 2 × 13 is in your picture.” “Both of your answers are 156. What would you tell a friend about why?” “How do you know 6 × 26 covers the same area as 12 × 13?”\n• Support (Bridges): if students use repeated addition, model it on a ratio table and ask whether they could skip to the × 10 entry. Larger numbers: outline the coop with base ten area pieces or grid paper. If they forget the units in the bottom right corner of an array, encourage linear pieces.\n• Challenge (Bridges): ask for a new strategy or understanding; show a ratio table jump to 10 × n; ask for fewer, bigger chunks (leave one factor whole and split only the other).\n• Record each pair’s strategy on your Forum Planner.\n\nFORMATIVE ASSESSMENT: Conferring: explains why / describes steps only / not yet.\n\nCALLOUTS: Rosenshine Principles 3, 8, 9. MLR7 Compare and Connect."}, {"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s012.jpg", "title": "Activity 2", "notes": "PURPOSE: Problem 2. The Maggie’s Chickens teacher notes give Problem 2 as 6 × 26. Read the story wording from your own copy of SB 66. The answers are the same on purpose: 12 was halved to 6 and 13 was doubled to 26.\n\nTIMING: About 3 minutes of the pair work time.\n\nCLICKS: Click 1: fill in the first two columns before solving. Click 2: the compare question, only when pairs are ready for it.\n\nTEACHER SAYS:\n“Fill in the first two columns of the table before you solve.”\n\nANTICIPATED RESPONSES:\n• 6 × 20 = 120 and 6 × 6 = 36. 120 + 36 = 156.\n• A student who spots the pattern: “12 × 13 and 6 × 26 are the same. The 12 was cut in half to make 6 and the 13 doubled to make 26.”\n\nDIFFERENTIATION AND SUPPORT:\n• Bridges asks you to encourage speculation about why and not to rush the thinking. If a pair only guesses, accept the guess and say: “We’ll keep testing this.”\n\nCALLOUTS: Connects to the Big Idea chart. MP8."}, {"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s013.jpg", "title": "Activity 2", "notes": "PURPOSE: Strategy Forum. Only some pairs present, but everyone takes part. Forums are times for learning and everyone is respectful at all times. Connect to today’s HOW intention: being responsive to a classmate’s strategy.\n\nTIMING: About 8 minutes.\n\nCLICKS: Click 1: what presenters do. Click 2: what everyone does.\n\nTEACHER SAYS:\n“Review the forum procedure. Only some pairs will present, but everyone takes part: add to what presenters share, ask questions, talk with a partner, and think about how to use what is shared on other problems. Forums are times for learning. Everyone is respectful at all times.”\n\nDISCUSSION PROMPTS:\n• Call presenters in the order you planned: an area diagram or grid-paper array; a recording with two partial products; one pair that connects 12 × 13 to 6 × 26. A ratio table is a bonus.\n• Record every strategy on chart paper or under the document camera.\n• If a student solved a problem without a model, follow with a student whose work models the same thinking and make the connection explicit.\n• Challenge (Bridges): Which is most efficient for these numbers? What is true about certain numbers that makes them fit certain strategies?\n\nDIFFERENTIATION AND SUPPORT:\n• Support (Bridges): ask students to question presenters when they do not understand. Ask all students to justify their answers, so students who are struggling learn that being questioned is the norm and does not mean they are wrong.\n• ELL (Bridges): chances to ask for clarification or rephrasing, visual models, and a same-language peer if available.\n\nCALLOUTS: Rosenshine Principle 8/9: guided and independent practice. MP3."}, {"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s014.jpg", "title": "Activity 2", "notes": "PURPOSE: Written efficiency judgment. This is part b of the M3 Checkpoint in practice form, on different numbers. After the forum students return to their seats with their journals.\n\nTIMING: About 2 minutes.\n\nCLICKS: Click 1: the sentence frame. Click 2: the reason prompt. Click 3: the second frame for ELL and learning support.\n\nTEACHER SAYS:\n“Look at the strategies we shared for 12 × 13. Finish this sentence in your journal: ‘I think ______ is the most efficient strategy, because…’ Give a reason that is about the numbers or the steps.”\n\nANTICIPATED RESPONSES:\n• “I think two partial products is the most efficient strategy, because it uses fewer steps. I only had to do 12 × 10 = 120 and 12 × 3 = 36, then add.”\n• “I think the area diagram is the most efficient, because it breaks 12 and 13 into tens and ones, and I only use basic facts like 2 × 3 = 6.”\n• “I think doubling and halving is the most efficient for 12 × 13, because I can switch to 6 × 26 and split the 26 into 20 and 6.”\n\nWATCH FOR / MISCONCEPTIONS:\n• If a student writes “it’s easy” or “it’s the one I always use,” ask “Easy because…?” until the reason is about the numbers or the steps.\n\nDIFFERENTIATION AND SUPPORT:\n• Provide the second frame (“The strategy with the fewest steps was ______. I know because ______.”) for ELL and learning support. Accept a spoken answer that you write down.\n• Collect the Maggie’s Chickens pages and journal pages and file them as work samples.\n\nFORMATIVE ASSESSMENT: Sort: reason about numbers or steps / reason without numbers (“easy”) / no reason.\n\nCALLOUTS: Rosenshine Principle 6: check for understanding."}, {"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s015.jpg", "title": "Activity 2", "notes": "PURPOSE: Activity 2 synthesis. Connect the forum to the Big Idea chart.\n\nTIMING: About 2 minutes at the end of Activity 2.\n\nCLICKS: Ask each question and take student answers; then click to show a sample answer for that row. Each click shows the question with its answer, so ask the question aloud first.\n\nTEACHER SAYS:\n“What is the same about all the strategies we saw for 12 × 13?”\n“Which of these recording methods was fastest for 12 × 13? Which one made the most sense to you?”\n“Problem 1 and problem 2 have the same answer. Why do you think that is?”\n“Which recording method shows that most clearly?”\n\nANTICIPATED RESPONSES:\n• Two partial products took the fewest steps: 120 + 36. The area diagram showed why: I could see all four pieces.\n• If students can only guess, accept the guess and say: “We’ll keep testing this.”\n\nDIFFERENTIATION AND SUPPORT:\n• If students only describe steps (“I did 10 times 12 and then 3 times 12”), ask: “Why 10 and 3? What do those numbers tell us about 13?” and “Where is 12 × 3 in the array?” (the strip on the right side: 12 rows by 3 columns).\n\nCALLOUTS: Rosenshine Principle 3. MP3, MP8."}, {"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s016.jpg", "title": "Lesson Wrap Up", "notes": "PURPOSE: Lesson synthesis. Students reflect on strategies, name which one they will try next, and connect to today’s HOW intention.\n\nTIMING: 10 minutes: about 4 minutes journal, 3 minutes partner talk, 1 minute raise-hands, 2 minutes responsive discussion.\n\nCLICKS: The journal prompt shows first. Click 1: partner talk. Click 2: raise your hand statements.\n\nTEACHER SAYS:\n“Take out your journals. Turn to a fresh page and write the heading ‘Multiplication Strategies.’ It’s so interesting how you used these different strategies and all came up with the same answer. I’d like you to consider which of these strategies makes the most sense to you and which seems the most efficient. Which one will you try the next time you find a problem like this?”\n“Turn to a partner. Tell them your current favorite strategy for multiplication and how you would teach it to a parent.”\n“Raise your hand if you tried a new strategy today. Raise your hand if you worked through confusion to make sense of something hard. Raise your hand if you had an estimate that was close to your actual answer.”\n“Today we asked how being responsive to a classmate’s strategy helps us. Who can tell us about a time today when something a classmate said or showed changed how you thought about a problem?”\n\nANTICIPATED RESPONSES:\n• I didn’t think of cutting the array in half until someone showed us. Then I could see why 12 × 13 and 6 × 26 matched.\n\nWATCH FOR / MISCONCEPTIONS:\n• Listen for the words double, half, factor and product, and for “because.”\n\nCALLOUTS: Rosenshine Principles 6, 10. Leave the Big Idea chart up through the M3 Checkpoint on Day 14."}, {"img": "_hub/slides/Math_U2_L12_Doubling_Halving/s017.jpg", "title": "Cool Down", "notes": "PURPOSE: Cool-down, Make It Easier. Addressing 4.NBT.5. Independent. The task comes from the question Bridges closes Session 3 with: which factor could you change to make 5 × 16 easier to solve, and why?\n\nTIMING: 5 minutes, independent.\n\nCLICKS: The problem shows first. Click 1: the three steps.\n\nANTICIPATED RESPONSES:\n• 5 × 16 = 10 × 8 = 80. “I doubled the 5 to make 10 and cut the 16 in half to make 8. 10 × 8 is easy: 80. The product stays the same because one factor doubled and the other was cut in half.”\n• Also correct: 5 × 16 = 20 × 4 = 80 (doubling the 5 twice and halving the 16 twice).\n\nWATCH FOR / MISCONCEPTIONS:\n• Next Day Support. If a student doubles both factors (10 × 32 = 320): at the start of Day 13 display 2 × 3 and 4 × 6 as arrays. Ask: Which array is bigger? How many times as big? Then ask what would have to happen to one factor to keep the product the same.\n• Next Day Support. If a student cuts one factor in half but does not double the other (5 × 8 = 40): return to the Warm-up, 8 × 6 = 48 and 8 × 3 = 24. Ask what happened to the product when the 6 was cut in half. Have the student build 5 × 16 and 5 × 8 as arrays.\n• Next Day Support. If a student finds 80 but cannot say why: ask them to draw a 5-by-16 array, cut it in half, and slide the piece to make a 10-by-8 array. Then say what stayed the same (the squares).\n\nDIFFERENTIATION AND SUPPORT:\n• Prior-Unit Support: Grade 3 multiplication properties (IM Grade 3, Unit 3: Properties of Multiplication and Division). Within this unit, return to the array building from Day 7 (Bridges SB p. 52–53).\n\nFORMATIVE ASSESSMENT: Collect to see who is ready for the M3 Checkpoint on Day 14.\n\nCALLOUTS: Rosenshine Principles 6, 9."}]}, "Math U2 L13_Solve-Problems-Involving-Multiplication.pptx": {"name": "Math U2 L13_Solve-Problems-Involving-Multiplication.pptx", "slug": "Math_U2_L13_Solve_Problems_Involving_Multiplication", "pptx": null, "pdf": null, "sprite": "_hub/slides/Math_U2_L13_Solve_Problems_Involving_Multiplication/sprite.jpg", "tw": 192, "th": 108, "landscape": true, "slides": [{"img": "_hub/slides/Math_U2_L13_Solve_Problems_Involving_Multiplication/s001.jpg", "title": "Solve Problems Involving Multiplication", "notes": "PURPOSE\nOpen Day 13 (IM Grade 4, Unit 6, Lesson 12: Solve Problems Involving Multiplication) and share the split-screen intentions. This is the last practice day before tomorrow’s M3 Checkpoint.\n\nTIMING\n1 minute. Lesson total: Warm-up 10 · Activity 1 25 · Activity 2 10 · Lesson Synthesis 10 · Cool-down 5 (IM timeline).\n\nSPLIT-SCREEN (verbatim from the Day 13 sequence card)\n• WHAT: As mathematicians, how do we decide which strategy is the most efficient one for a given problem?\n• HOW (Researchers · Resourceful): As researchers, how can being resourceful — drawing on every strategy we've learned this part — help us pick the best tool for a new problem?\n\nTEACHER SAYS\nNo lesson plan exists for Day 13, so there is no scripted opener. IM student-facing learning goal (verbatim): “Let’s solve problems using what we learned about multiplication of whole numbers.”\n\nCARD DETAILS\n• Learning target: I can choose an efficient strategy to solve a multi-step multiplication problem, and explain my choice.\n• Tags: NBT.5 · IM L12. Addressing 4.MD.A.2, 4.NBT.B.5 (IM).\n• Problem-Solving Conferring (card): Final efficiency-reasoning support before tomorrow's Checkpoint.\n• Assessment (card): IM L12 multi-step problem set with strategy justification.\n\nMATERIALS (IM)\nTools for creating a display (Activity 1). UDL (Action and Expression): colored pencils, grid paper, base-ten blocks, and a visual display of strategies from this section.\n\nNOTE\nContent source: IM G4 U6 L12 Teacher Guide (no Day 13 lesson plan in Outputs). Return to the split screen in the Lesson Synthesis: Did we find an answer? Did being resourceful help us?"}, {"img": "_hub/slides/Math_U2_L13_Solve_Problems_Involving_Multiplication/s002.jpg", "title": "Learning Target", "notes": "PURPOSE\nName the Day 13 learning target (verbatim from the sequence card) and the IM student-facing goal.\n\nTIMING\n1 minute.\n\nCLICKS\nNone. Everything shows at once.\n\nSUGGESTED TEACHER LANGUAGE (written for this deck; not from a plan)\n“Read the target with me. Tomorrow is the Checkpoint, so today you choose the strategy and you tell us why.”\n\nSUCCESS CRITERIA\nNot included: there is no Day 13 lesson plan and IM does not list success criteria.\n\nCONFERRING (card)\nFinal efficiency-reasoning support before tomorrow's Checkpoint. Keep a list today of students who use only one strategy, or who say “it was easier” without saying what made it easier. The Day 14 plan uses that list for last-chance conferring."}, {"img": "_hub/slides/Math_U2_L13_Solve_Problems_Involving_Multiplication/s003.jpg", "title": "Warm Up", "notes": "PURPOSE\nIM Warm-up (What Do You Know about _____?). Elicit what students know about 1 year as a measure of time. The reasoning helps later in the lesson when students solve problems that involve time in years. Building Toward 4.MD.A.2.\n\nTIMING\n10 minutes.\n\nCLICKS\nClick 1: “What does a year measure?” Click 2: “What are some aspects of time that are related to a year?” (Activity Synthesis.)\n\nLAUNCH (IM)\n• Display: “1 year”\n“What do you know about 1 year?”\n1 minute: quiet think time\n\nACTIVITY (IM)\nRecord responses.\n\nANTICIPATED RESPONSES (IM samples)\n• It is 365 days long.\n• It is 12 months long.\n• Sometimes 1 year has an extra day.\n• It is the time it takes the earth to make a rotation around the sun.\n\nACTIVITY SYNTHESIS (IM, verbatim)\nClick 1. “What does a year measure?” (time)\nClick 2. “What are some aspects of time that are related to a year?” (seasons, months, weeks, days)\n\nWATCH FOR\nStudents who say a year is always 365 days. Keep “sometimes 1 year has an extra day” on the board; Activity 1 uses leap years.\n\nFORMATIVE ASSESSMENT\nListen for 365, 366, 12 months, 7 days in a week and 24 hours in a day. These are the conversions students need today.\n\nRESPONDING TO STUDENT THINKING (IM Next-Day Support from L11)\nBefore the Warm-up, consider showing an anonymous L11 cool-down. Ask what the student did well and what they need to do to improve it."}, {"img": "_hub/slides/Math_U2_L13_Solve_Problems_Involving_Multiplication/s004.jpg", "title": "Activity 1", "notes": "PURPOSE\nActivity 1 launch (IM L12). Students estimate before solving. Addressing 4.MD.A.2, 4.NBT.B.5.\n\nTIMING\nAbout 4 minutes of the 25-minute activity.\n\nCLICKS\nClick 1: the three ranges appear together, after 1 minute of think time. Click 2: “Explain your estimate. Would you revise it?”\n\nLAUNCH (IM, verbatim teacher language)\n• Groups of 2–4. Give each group tools for creating a visual display.\n“Today we’ll solve some problems that involve measurements.”\n“Before we solve any problem, let’s do some estimation.”\n• Read the first problem as a class.\n“Estimate: About how many days old is the baby elephant?”\n1 minute: quiet think time\n• Display the ranges and poll the class: 280 to 299 · 300 to 349 · 350 to 400. (Alternatively, post each range in a different part of the classroom and ask students to stand by the range that reflects their estimate.)\n• Select a student who selected each range to explain their estimate. Then ask students if they’d revise their estimate.\n\nANTICIPATED REASONING (samples, not from IM)\n“50 weeks would be 350 days, so 48 weeks is a little less.” (300 to 349)\n“A year is 52 weeks, so 48 weeks is almost a year, close to 365.” (350 to 400)\n\nANSWER (IM)\n48 × 7 = 336 days, in the 300 to 349 range.\n\nMISCONCEPTION WATCH\nStudents who multiply 48 by 4 or by 30 (weeks for months). Ask: “How many days are in 1 week?”\n\nMP\nMP2: reason quantitatively and abstractly about units of time."}, {"img": "_hub/slides/Math_U2_L13_Solve_Problems_Involving_Multiplication/s005.jpg", "title": "Activity 1", "notes": "PURPOSE\nGet Ready · Do · Done send-off into Activity 1 (Ward & Jacobsen, GDD pp. 74–79). Students picture the finished work, plan the steps and time, then gather materials.\n\nTIMING\n1–2 minutes, then start the work timer.\n\nCLICKS (right to left)\nClick 1: Done mat. Click 2: Do mat. Click 3: Get Ready mat.\n\nSTEP TIMES\nInferred from the IM timing, since there is no Day 13 lesson plan: 5 minutes independent work, 5 minutes group work, 3 minutes to make the display, 5 minutes gallery walk (IM Activity 1, Launch and MLR7 steps). The ½ checkpoint sits after step 2, about 9–10 minutes in.\n\nTEACHER SAYS (written for this deck; adjust to your words)\n“Put on your future glasses. Look at the red mat first: when you are done, all three problems are answered with units, and your group has a display someone else can follow. Now the green mat: five minutes on problems 1 and 2 by yourself, five minutes with your group on problem 3, then three minutes to make your display and five minutes to walk. Last, the yellow mat: what do you need, and where will it go?”\n\nFUTURE-GLASSES PROMPT\n“Close your eyes for a second. What does your page look like when you are finished? Where is the answer to problem 3, and what unit is next to it?”\n\nIF–THEN OBSTACLE PROMPT\n“If you get stuck on how many days are in a week or a year, then check the Warm-up list on the board. If your group disagrees on an answer, then each person shows a different strategy and you compare.”\n\nTIMER\nSet the timer for the halfway point (about 9 minutes), not the end. At the ½ checkpoint, ask: “Are problems 1 and 2 done? Has your group started problem 3?” Look for time robbers and replan (GDD p. 79).\n\nIM IN-ACTIVITY LANGUAGE (verbatim)\n“Take a few quiet minutes to solve the first two problems. Then, discuss your responses with your group and work on the last problem together.”\n\nUDL\nAction and Expression (IM): colored pencils, grid paper, base-ten blocks and the section strategy display are available."}, {"img": "_hub/slides/Math_U2_L13_Solve_Problems_Involving_Multiplication/s006.jpg", "title": "Activity 1", "notes": "PURPOSE\nActivity 1 student task (IM L12, verbatim). Students apply multi-digit multiplication and unit conversion to measurement problems. Addressing 4.MD.A.2, 4.NBT.B.5. MLR7 Compare and Connect (advances representing, conversing).\n\nTIMING\n10 minutes: 5 minutes independent work, 5 minutes group work.\n\nCLICKS\nNone. Students need all three problems in view.\n\nTEACHER SAYS (IM, verbatim)\n“Take a few quiet minutes to solve the first two problems. Then, discuss your responses with your group and work on the last problem together.”\n\nACTIVITY (IM)\n5 minutes: independent work time\n5 minutes: group work time\n• Monitor for the different representations and strategies used to solve the problems.\n• Assign one problem to each group (for the display on the next slide).\n\nANSWERS (IM)\n1. 48 × 7 = 336\n2. 366 × 3 = 1,098\n3. 7 days more than a common year (or 6 days more than a leap year). Samples: 12 × 31 = 372, and 372 is 7 more than 365 and 6 more than 366. Or: in a common year, four months are 30 days long and one is 28 days long. Making these five months 31 days each means adding (4 × 1) + 3, or 7 days. In a leap year, (4 × 1) + 2, or 6 days.\n\nMISCONCEPTION WATCH\n• Problem 2: using 365 instead of 366.\n• Problem 3: answering 372 (the new total) instead of how many MORE days. Ask: “What is the question asking for?”\n• Partial products: losing place value, for example 3 × 300 recorded as 9 (IM Responding to Student Thinking).\n\nDIFFERENTIATION\nSupport: grid paper and base-ten blocks; a strategy display from Days 9–12 as a reference (IM UDL, Action and Expression). Extension: solve problem 3 two ways and say which way was more efficient.\n\nCONFERRING (card)\nFinal efficiency-reasoning support before tomorrow's Checkpoint. Ask: “Which strategy did you use for 366 × 3? Why that one for these numbers?”\n\nMP\nMP1 make sense of problems and persevere; MP2 reason quantitatively and abstractly."}, {"img": "_hub/slides/Math_U2_L13_Solve_Problems_Involving_Multiplication/s007.jpg", "title": "Activity 1", "notes": "PURPOSE\nMLR7 Compare and Connect (IM L12 Activity 1). Groups make a display of the problem they were assigned, then compare strategies on a gallery walk.\n\nTIMING\n8 minutes: 3 minutes group work, 5 minutes gallery walk.\n\nCLICKS\nClick 1: the gallery walk card and its time. (The display card shows first.)\n\nTEACHER SAYS (IM, verbatim)\n“Create a visual display to show how you solved the problem assigned to your group. Organize your work so that it can be followed by others.”\n\nACTIVITY (IM)\n3 minutes: group work time\n5 minutes: gallery walk\n• Prompt students to make note of the different strategies they see and any solutions that they question.\n\nLOOK FOR\nArea diagrams, partial products and the standard algorithm on the same problem. Choose 2–3 displays to point to in the synthesis.\n\nUDL / EF\nPost the two jobs (strategies, solutions you question) so students have a recording structure during the walk.\n\nMLR7\nAdvances: representing, conversing."}, {"img": "_hub/slides/Math_U2_L13_Solve_Problems_Involving_Multiplication/s008.jpg", "title": "Activity 1", "notes": "PURPOSE\nActivity 1 Synthesis, part 1 (IM L12). Connect strategies for multiplying a multi-digit number by a one-digit number.\n\nTIMING\nAbout 3 minutes of the 25-minute activity.\n\nCLICKS\nClick 1: 48 × 7 as an area diagram. Click 2: 366 × 3 as partial products. Show each only after students have shared their own strategies.\n\nTEACHER SAYS (IM, verbatim)\n“Most of the problems can be solved by multiplication. What is the same between the solutions and multiplication strategies that you saw? What’s different?”\n30 seconds quiet think time, then 1 minute partner discussion.\n• Record students’ responses, or display students’ diagrams and representations.\n“What are some common strategies for multiplying a multi-digit number by a one-digit number (48 and 7, or 366 and 3)?”\n\nABOUT THE VISUALS\nThe two recordings are typed samples drawn for this deck. IM gives only the equations 48 × 7 = 336 and 366 × 3 = 1,098. Use your students’ displays first. Colours follow the partial-products palette from Days 9–11 (ones green, tens gold, hundreds red).\n\nANTICIPATED RESPONSES (samples)\n“We all multiplied. Some people drew a rectangle and some people wrote partial products.”\n“For 366 × 3 I did 300 × 3, 60 × 3 and 6 × 3 and added them.”\n“Some groups used the standard algorithm because it was shorter.”\n\nMISCONCEPTION WATCH\nA partial product recorded without its place value (18, 18, 9 instead of 18, 180, 900).\n\nROSENSHINE\nPrinciple 4: Provide models, after students have tried the problems."}, {"img": "_hub/slides/Math_U2_L13_Solve_Problems_Involving_Multiplication/s009.jpg", "title": "Activity 1", "notes": "PURPOSE\nActivity 1 Synthesis, part 2 (IM L12). Strategies for multiplying 2 two-digit numbers, then back to what the answer to problem 3 means.\n\nTIMING\nAbout 2 minutes.\n\nCLICKS\nClick 1: 12 × 31 area diagram (sample). Click 2: what 372 means for problem 3.\n\nTEACHER SAYS (IM, verbatim)\n“What are some strategies you saw for multiplying 2 two-digit numbers (12 and 31)?”\n\nANSWER (IM)\n12 × 31 = 372, and 372 is 7 more than 365 and 6 more than 366. Problem 3 asks how many MORE days: 7 more than a common year (or 6 more than a leap year).\n\nABOUT THE VISUAL\nThe area diagram is a typed sample drawn for this deck, decomposing 31 as 30 + 1 and 12 as 10 + 2. IM gives the equation only.\n\nANTICIPATED RESPONSES (samples)\n“I split 12 into 10 and 2 and 31 into 30 and 1, so four partial products.”\n“I did 12 × 30 = 360 and then one more 12.”\n\nDISCUSSION PROMPT (card focus)\nEfficiency reasoning before tomorrow’s Checkpoint: “Which of these strategies was quickest for 12 × 31? What about these numbers made it quick?”\n\nFORMATIVE ASSESSMENT\nNote who can name WHY a strategy fit the numbers (Day 14 conferring list)."}, {"img": "_hub/slides/Math_U2_L13_Solve_Problems_Involving_Multiplication/s010.jpg", "title": "Activity 2", "notes": "PURPOSE\nGet Ready · Do · Done send-off into Activity 2, Coin Collection (Ward & Jacobsen, GDD pp. 74–79).\n\nTIMING\n1 minute, then start the timer.\n\nCLICKS (right to left)\nClick 1: Done mat. Click 2: Do mat. Click 3: Get Ready mat.\n\nSTEP TIMES\nInferred: IM gives 6–7 minutes of independent work and 2–3 minutes of group discussion. The split of the independent time between problems 1–2 (4 min) and problem 3 (3 min) is my estimate. The ½ checkpoint sits after step 1, about 4–5 minutes in.\n\nTEACHER SAYS (written for this deck; adjust to your words)\n“Future glasses on. On the red mat: two answers with the right unit, and a story problem you wrote yourself for 8 times 1,049, solved. Green mat: four minutes for problems 1 and 2, three minutes for your own story, then three minutes to share. Yellow mat: pencil and notebook, and clear your desk.”\n\nFUTURE-GLASSES PROMPT\n“Picture your story problem. Who is in it? What is being counted 8 times?”\n\nIF–THEN OBSTACLE PROMPT\n“If you are not sure how many pennies a nickel is worth, then ask your group before you start multiplying. If you finish early, then check your answer to problem 2 a second way.”\n\nTIMER\nSet the timer for the halfway point (about 5 minutes). At the ½ checkpoint: “Problems 1 and 2 done? Start your story.”"}, {"img": "_hub/slides/Math_U2_L13_Solve_Problems_Involving_Multiplication/s011.jpg", "title": "Activity 2", "notes": "PURPOSE\nActivity 2 (IM L12, verbatim task). More practice using multiplication in context (MP2), including a four-digit factor, and writing a new problem to fit an expression. Addressing 4.MD.A.2, 4.NBT.B.5.\n\nTIMING\n10 minutes: 6–7 minutes independent work, 2–3 minutes group discussion.\n\nCLICKS\nNone.\n\nLAUNCH (IM)\nGroups of 2–4.\n\nACTIVITY (IM)\n6–7 minutes: independent work time\n2–3 minutes: group discussion\n• Monitor for and select different ways students represented the situations and solved the problems.\n\nANSWERS (IM)\n1. 2,074 × 5 = 10,370\n2. 2,074 × 4 = 8,296 (1 fewer group of 2,074 than in 10,370, or 10,370 − 2,074)\n3. Sample: The local library had 1,049 books checked out each day for 8 days. How many books were checked out in total? 8 × 1,000 + 8 × 40 + 4 × 9 = 8,392\n\nMISCONCEPTION WATCH\n• Problem 1: multiplying by 10 or by 25 (dime or quarter). A nickel is worth 5 pennies.\n• Problem 3: 8 × 1,049 recorded as 8 × 1,000 + 8 × 49 with 8 × 49 = 352 is correct; watch for 8 × 1,000 + 8 × 4 + 8 × 9 (place value lost in the 40).\n\nDIFFERENTIATION\nSupport: give a story starter for problem 3 (“___ each day for 8 days”). Extension: write a second story where 8 × 1,049 is a comparison (“8 times as many”).\n\nACTIVITY SYNTHESIS (IM, verbatim)\n“In the Lesson Synthesis, let’s compare some different strategies.”\n\nCONFERRING (card)\nFinal efficiency-reasoning support before tomorrow's Checkpoint. Ask: “You used the answer to problem 1 for problem 2. Why was that efficient?”"}, {"img": "_hub/slides/Math_U2_L13_Solve_Problems_Involving_Multiplication/s012.jpg", "title": "Lesson Wrap Up", "notes": "PURPOSE\nLesson Synthesis, part 1 (IM L12). Students share their Activity 2 responses and compare strategies.\n\nTIMING\nAbout 6 of the 10 minutes.\n\nCLICKS\nClick 1: partial products. Click 2: standard algorithm. Show them after students share their own work.\n\nTEACHER SAYS (IM, verbatim)\n“Today we used what we have learned about multiplication to solve problems involving measurement.”\n\nIM MOVES\n• Invite selected students to share their responses to the problems in the last activity. As each student shares, ask if others in the class solved it the same way and if they approached it differently.\n• Prompt students to explain what their numerical solutions represent in each situation. (10,370 is the number of pennies; 8,296 is the number of nickels after 4 years.)\n\nABOUT THE VISUALS\nBoth recordings are typed samples for 2,074 × 5 drawn for this deck (IM gives 2,074 × 5 = 10,370). In the standard algorithm the small 2 and 3 are the regrouped tens and hundreds: 5 × 4 = 20 (write 0, regroup 2 tens); 5 × 7 tens = 35 tens, plus 2 = 37 tens (write 7, regroup 3 hundreds); 5 × 0 hundreds + 3 = 3 hundreds; 5 × 2 thousands = 10 thousands. The zero hundreds produces no partial product in the left recording.\n\nDISCUSSION PROMPTS (samples)\n“Where is the 350 from the partial products inside the standard algorithm?”\n“Which recording would you choose for a four-digit number? Why?”\n\nMISCONCEPTION WATCH\nForgetting to add the regrouped 2 tens to 35 tens (writing 10,350).\n\nROSENSHINE\nPrinciple 4: Provide models; Principle 6: Check for student understanding."}, {"img": "_hub/slides/Math_U2_L13_Solve_Problems_Involving_Multiplication/s013.jpg", "title": "Lesson Wrap Up", "notes": "PURPOSE\nLesson Synthesis, part 2 (IM L12). Students check their solutions and name the method they chose and why. This is the efficiency reasoning the Day 14 Checkpoint asks for.\n\nTIMING\nAbout 4 minutes.\n\nCLICKS\nClick 1: the second question.\n\nTEACHER SAYS (IM, verbatim)\n“How would you know if your solutions were correct?”\nClick 1. Consider asking: “When you had to multiply numbers, which method did you rely on the most? What made you choose that method?”\n\nANTICIPATED RESPONSES\n• IM: “I used another strategy to see if I got the same answer. I estimated first so that I had an idea how big or small the answer would be. I checked with my groupmates.”\n• Sample (not from IM): “I used partial products for 2,074 × 5 because one of the digits is a zero, so there were only three parts.”\n\nSPLIT SCREEN\nReturn to the title slide question: As mathematicians, how do we decide which strategy is the most efficient one for a given problem? Then: “Where did being resourceful help you today?”\n\nFORMATIVE ASSESSMENT\nListen for reasons tied to the numbers or the steps (“fewer steps,” “breaks into facts I know”) versus “it was easy.” Students with the second kind of reason join the Day 14 last-chance conferring group.\n\nSUGGESTED CENTERS (IM)\nFive in a Row: Multiplication (3–5), Stage 3: Two-Digit Factors (Addressing). Compare (1–5), Stage 3: Multiply within 100 (Supporting)."}, {"img": "_hub/slides/Math_U2_L13_Solve_Problems_Involving_Multiplication/s014.jpg", "title": "Cool Down", "notes": "PURPOSE\nIM L12 Cool-down, Leap Year (verbatim). Addressing 4.MD.A.2, 4.NBT.B.5. One task, 5 minutes, independent.\n\nTIMING\n5 minutes.\n\nCLICKS\nNone.\n\nANSWER (IM)\n696 hours. IM sample: 29 × 24 with partial products 36 (4 × 9), 80 (4 × 20), 180 (20 × 9), 400 (20 × 20); 36 + 80 + 180 + 400 = 696.\n\nRESPONDING TO STUDENT THINKING (IM)\nStudents who use an algorithm that uses partial products may neglect to consider the place value of the digits they are multiplying and end up with some incorrect partial products.\n\nNEXT-DAY SUPPORT (IM)\nBefore the Warm-up, select a student’s Cool-down from the previous lesson (name anonymous). Ask students to identify what the student did well and what the student needs to do to improve the cool-down. On Day 14 (Checkpoint day) do this during last-chance conferring with your own numbers, not the Checkpoint’s.\n\nPRIOR-UNIT SUPPORT\nDay 11 (IM L11) partial products beside the standard algorithm; Days 9–10 (IM L9–L10) partial products.\n\nFORMATIVE ASSESSMENT\nSort cool-downs: correct with a chosen strategy; correct product but missing the unit (hours); place-value error in a partial product. Use the third pile for tomorrow’s last-chance conferring group."}]}, "Math U2 L14_Checkpoint_Multiplication_Strategies.pptx": {"name": "Math U2 L14_Checkpoint_Multiplication_Strategies.pptx", "slug": "Math_U2_L14_Checkpoint_Multiplication_Strategies", "pptx": null, "pdf": null, "sprite": "_hub/slides/Math_U2_L14_Checkpoint_Multiplication_Strategies/sprite.jpg", "tw": 192, "th": 108, "landscape": true, "slides": [{"img": "_hub/slides/Math_U2_L14_Checkpoint_Multiplication_Strategies/s001.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L14_Checkpoint_Multiplication_Strategies/s002.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L14_Checkpoint_Multiplication_Strategies/s003.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L14_Checkpoint_Multiplication_Strategies/s004.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L14_Checkpoint_Multiplication_Strategies/s005.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L14_Checkpoint_Multiplication_Strategies/s006.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L14_Checkpoint_Multiplication_Strategies/s007.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L14_Checkpoint_Multiplication_Strategies/s008.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L14_Checkpoint_Multiplication_Strategies/s009.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L14_Checkpoint_Multiplication_Strategies/s010.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L14_Checkpoint_Multiplication_Strategies/s011.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L14_Checkpoint_Multiplication_Strategies/s012.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L14_Checkpoint_Multiplication_Strategies/s013.jpg", "title": "", "notes": ""}, {"img": "_hub/slides/Math_U2_L14_Checkpoint_Multiplication_Strategies/s014.jpg", "title": "", "notes": ""}]}, "Math U2 L15_Equal_Groups_and_Area_Division.pptx": {"name": "Math U2 L15_Equal_Groups_and_Area_Division.pptx", "slug": "Math_U2_L15_Equal_Groups_and_Area_Division", "pptx": null, "pdf": null, "sprite": "_hub/slides/Math_U2_L15_Equal_Groups_and_Area_Division/sprite.jpg", "tw": 192, "th": 108, "landscape": true, "slides": [{"img": "_hub/slides/Math_U2_L15_Equal_Groups_and_Area_Division/s001.jpg", "title": "Situations Involving Equal-Size Groups & Area", "notes": "PURPOSE\nOpen Day 15, the Part 3 opener: IM Unit 6, Lessons 13 and 14 combined into one lesson of under 50 minutes. Share the split-screen intentions.\n\nTIMING\n1 minute. Lesson: Launch 3 · Warm-up 5 · Activity 1 14 · Activity 2 14 · Lesson Synthesis 6 · Cool-down 5 = 47 minutes, plus about 3 minutes for transitions.\n\nSPLIT-SCREEN (verbatim from the Day 15 sequence card)\n• WHAT: As mathematicians, how is dividing into equal groups related to the multiplication we've already learned?\n• HOW (Self Managers · Flexible): As self managers, how can being flexible — trying our multiplication tools on a new operation — help us get started with division?\n\nPART 3 QUESTION (sequence)\nHow do we divide multi-digit numbers, and what do we do with what’s left over?\n\nWHAT WAS CHOSEN FROM IM L13 AND L14 (kept from the previous version of this deck)\n• Warm-up: Estimation Exploration, Area of a Soccer Field (L14). It previews the area side of the day.\n• Activity 1: Paletas for a Class Party (L13 Activity 1). Both meanings of division, plus dividend, divisor and quotient.\n• Activity 2: Elena’s Mural (L14 Activity 1). Unknown side length of a rectangle.\n• Lesson Synthesis: L13 and L14 synthesis questions combined.\n• Cool-down: Sticky Notes on the Door (L14).\n• Not used: Lots of Paletas warm-up (L13), More Snacks for a Class Party (L13 Activity 2), Tyler’s Mural (L14 Activity 2), Cleaning Desks cool-down (L13).\n\nCARD DETAILS\n• Learning target: I can identify whether a division situation involves equal-size groups or area, and represent it with a diagram.\n• Tags: NBT.6 · IM L13–L14. IM also addresses 4.MD.A.3 and 4.OA.A.3 (L14).\n• Conferring (card): Can students explain what makes a situation \"equal groups\" versus \"area,\" not just label it?\n• Assessment (card): IM L13–L14 situation-sorting and diagramming tasks.\n\nMATERIALS (IM)\nGrid paper; connecting cubes, counters or square tiles for students who want to act out or draw (L13 UDL).\n\nNEXT-DAY LINK FROM DAY 14 (plan)\nStart students who rated part (b) a 1 or 2 in your first conferring group today and offer the frame “___ because ___.”"}, {"img": "_hub/slides/Math_U2_L15_Equal_Groups_and_Area_Division/s002.jpg", "title": "Learning Target", "notes": "PURPOSE\nLaunch: the learning target (verbatim from the Day 15 card) and a preview of the two situation types in the card’s lesson description.\n\nTIMING\nAbout 2–3 minutes (Launch).\n\nCLICKS\nClick 1: Equal-size groups. Click 2: Area.\n\nSUGGESTED TEACHER LANGUAGE (no plan exists for Day 15)\n“In Part 1 and Part 2 we multiplied with base-ten and area diagrams. Today we try those same tools on division. Division shows up in two kinds of situations: sharing a total into equal-size groups, and finding a missing side of a rectangle when we know the area.”\n\nSUCCESS CRITERIA\nNot included: there is no Day 15 lesson plan, and IM does not list success criteria. The previous version of this deck had criteria written for the deck; they were removed.\n\nHOW (Learning Asset)\nBeing flexible means trying a tool we already know (multiplication, multiples of 10, area diagrams) on a new operation."}, {"img": "_hub/slides/Math_U2_L15_Equal_Groups_and_Area_Division/s003.jpg", "title": "Warm Up", "notes": "PURPOSE\nIM L14 Warm-up, Estimation Exploration: Area of a Soccer Field. Elicit how the side lengths of a rectangle relate to its area, to prepare for the unknown side length in Elena’s Mural. Building on 3.MD.C.7, 4.NBT.B.5; building toward 4.MD.A.3, 4.NBT.B.6.\n\nTIMING\n5 minutes (IM: 10; shortened for the combined lesson).\n\nCLICKS\nClick 1: the synthesis question.\n\nLAUNCH (IM, verbatim)\n• Groups of 2. Display the image.\n“What is an estimate that’s too high? Too low? About right?”\n1 minute: quiet think time\n\nACTIVITY (IM, verbatim)\n“Discuss your thinking with your partner.”\n1 minute: partner discussion\n• Record responses.\n\nANTICIPATED RESPONSES (IM)\nToo low: 40–50 meters. About right: 55–60 meters. Too high: 60 meters.\n\nACTIVITY SYNTHESIS (IM, verbatim)\nClick 1. “How did you make your estimate? How did you know it’s reasonable?” (I know that the area is about 2,300 and one of the side lengths is 40. I know that 40 × 60 = 2,400 and 40 × 50 = 2,000, so the estimate is between 50 and 60, but closer to 60.)\n“Is anyone’s estimate less than 40 meters? Is anyone’s estimate greater than 60 meters?”\n“Based on this discussion does anyone want to revise their estimate?”\n\nABOUT THE VISUAL\nThe field is redrawn with shapes from the IM image: 40 meters on the short side, “? meters” on the long side, area 2,280 square meters.\n\nMISCONCEPTION WATCH\nStudents who add 40 and 2,280, or estimate near 2,280. Ask: “Is 2,280 a length or an area? How do you know?”\n\nDIFFERENTIATION\nOffer a list of multiples of 40 (40, 80, 120, …) to students who need a scaffold."}, {"img": "_hub/slides/Math_U2_L15_Equal_Groups_and_Area_Division/s004.jpg", "title": "Activity 1", "notes": "PURPOSE\nIM L13 Activity 1 launch with MLR5 Co-craft Questions (advances writing, reading, representing). Students recall division from Grade 3 and connect it to treats they enjoy. Building on 3.OA.A.2; building toward 4.NBT.B.6.\n\nTIMING\nAbout 5 of the 14-minute activity.\n\nCLICKS\nClick 1: the situation and question 1. Click 2: “How are these questions alike? How are they different?”\n\nLAUNCH (IM, verbatim)\n• Groups of 2\n“What are some of your favorite treats or snacks from home?”\n30 seconds: quiet think time\n1 minute: partner discussion\n\nMLR5 CO-CRAFT QUESTIONS (IM)\nClick 1. Display the opening paragraph and the first question.\n“Write a list of mathematical questions that could be asked about this situation.”\n2 minutes: independent work time (shorten to about 1½ for the combined lesson)\n2–3 minutes: partner discussion (shorten to about 1)\n• Invite several students to share one question with the class. Record responses.\nClick 2. “How are these questions alike?” (The questions involve multiplying or dividing.) “How are they different?” (The questions can be answered using different operations.)\n“Let’s look at the next question in the activity.”\n\nANTICIPATED QUESTIONS (IM samples)\n• How many people are coming to the party?\n• How many flavors of paletas are there?\n• How many paletas of each flavor did Diego’s aunt buy?\n• How many flavors of paletas did she buy?\n• How much money does she have to spend on paletas?\n\nMISCONCEPTION WATCH\nSome questions cannot be answered with the information given (such as cost). Accept them during co-craft, then ask which ones the situation can answer.\n\nUDL (IM, Action and Expression)\nGive students access to concrete manipulatives (connecting cubes, counters, or square tiles) and grid paper. Supports conceptual processing and attention.\n\nROSENSHINE\nPrinciple 1: Begin with a short review. The alike/different talk reconnects students to Grade 3 equal groups."}, {"img": "_hub/slides/Math_U2_L15_Equal_Groups_and_Area_Division/s005.jpg", "title": "Activity 1", "notes": "PURPOSE\nGet Ready · Do · Done send-off into Activity 1’s quiet work (Ward & Jacobsen, GDD pp. 74–79). It comes right after the co-craft launch and before the equation slide.\n\nTIMING\nAbout 1 minute, then start the timer.\n\nCLICKS (right to left)\nClick 1: Done mat. Click 2: Do mat. Click 3: Get Ready mat.\n\nSTEP TIMES\nInferred. IM gives 3–4 minutes of quiet work for questions 2 and 3; this deck splits it 2 + 2. The ½ checkpoint is at 2 minutes, after question 2.\n\nTEACHER SAYS (written for this deck; adjust to your words)\n“Future glasses on. On the red mat: at least one question that fits 84 divided by 7, an answer to one of your questions, and a picture or equation that shows how you know. Green mat: two minutes for question 2, two minutes for question 3. Yellow mat: pencil, journal and cubes if you want them.”\n\nFUTURE-GLASSES PROMPT\n“Picture your journal page. Where is your question? Where is your picture of the paletas?”\n\nIF–THEN OBSTACLE PROMPT\n“If you are not sure what the 84 or the 7 stands for, then act it out with cubes. If you finish early, then write a question for the other meaning of division.”\n\nTIMER\nSet the timer for the halfway point (2 minutes). At the ½ checkpoint: “You should have a question written. Move to question 3.”"}, {"img": "_hub/slides/Math_U2_L15_Equal_Groups_and_Area_Division/s006.jpg", "title": "Activity 1", "notes": "PURPOSE\nIM L13 Activity 1, questions 2 and 3 (verbatim). Students connect an equation to the situation and divide a two-digit number by a one-digit divisor in a way that makes sense to them.\n\nTIMING\nAbout 4–6 minutes (IM: 3–4 minutes quiet work time).\n\nCLICKS\nNone.\n\nADVANCING STUDENT THINKING (IM, verbatim)\n• If students are unsure how to represent 84 ÷ 7 = ? with a question about the class party situation, consider asking:\n“If you were to act out the meaning of this equation, what would the 84 represent? What would the 7 represent? What would the ? represent?”\n“How can you use what you shared to write a question that matches the equation?”\n\nANTICIPATED RESPONSES (IM samples)\n• Diego’s aunt is buying 84 paletas in 7 flavors. How many paletas of each flavor is she buying?\n• Diego’s aunt is buying 84 paletas. There are 7 paletas of each flavor. How many flavors are there?\n• 84 ÷ 7 = 12. I know that 7 groups of 10 is 70 and 7 groups of 2 is 14, so 7 groups of 12 is 84.\n10 × 7 = 70 and 2 × 7 = 14, so 12 × 7 = 84.\n• 70 ÷ 7 = 10 and 14 ÷ 7 = 2, so 84 ÷ 7 = 12.\n\nMISCONCEPTION WATCH\nReading 84 ÷ 7 as “7 ÷ 84,” or assuming the answer must be the number of flavors. Ask what each number stands for.\n\nCONFERRING (card)\nCan students explain what makes a situation \"equal groups\" versus \"area,\" not just label it? Ask: “What makes this an equal-groups problem?” Listen for “the same number of paletas of each flavor.”\n\nDIFFERENTIATION\nSupport: counters or a drawn array with 7 rows. Extension: write a question for each meaning of division for the same equation.\n\nROSENSHINE\nPrinciple 5: Guide student practice; check understanding as you circulate."}, {"img": "_hub/slides/Math_U2_L15_Equal_Groups_and_Area_Division/s007.jpg", "title": "Activity 1", "notes": "PURPOSE\nIM L13 Activity 1 Synthesis, part 1. Two questions students wrote for the same equation, one for each meaning of division.\n\nTIMING\nAbout 1½ minutes.\n\nCLICKS\nClick 1: first question. Click 2: second question. Click 3: “What does the 84 represent in both problems?”\n\nTEACHER MOVES (IM)\n• Display two questions that students wrote for the equation 84 ÷ 7 = ?. Use your students’ questions if you have them; the two on the slide are IM samples.\n“What does the 84 represent in both problems?” (The amount being divided into equal groups.)\n\nLABELS\nThe headings “How many in each group?” and “How many groups?” come from the IM L13 goals (“how many in each group” and “how many groups” problems).\n\nCONFERRING (card)\nCan students explain what makes a situation \"equal groups\" versus \"area,\" not just label it?"}, {"img": "_hub/slides/Math_U2_L15_Equal_Groups_and_Area_Division/s008.jpg", "title": "Activity 1", "notes": "PURPOSE\nIM L13 Activity 1 Synthesis, part 2. Re-introduce dividend and divisor; quotient is familiar from Grade 3. Highlight equal-size groups and reasoning that relates multiplication and division.\n\nTIMING\nAbout 1½ minutes.\n\nCLICKS\nClick 1: dividend. Click 2: divisor. Click 3: quotient. Click 4: the equal-groups picture.\n\nTEACHER SAYS (IM, verbatim)\n“In mathematics, the number being divided is known as the dividend, and the number by which the dividend is divided is known as the divisor. The result of the division is known as the quotient.”\n\nTHEN (IM)\nInvite students to share their strategies for the last question. Highlight strategies that show equal-size groups and reasoning that relates multiplication and division (7 groups of 10 is 70 and 7 groups of 2 is 14, so 7 groups of 12 is 84).\n\nABOUT THE VISUAL\nThe seven circles of 12 are drawn for this deck from the IM sample reasoning (“7 groups of 12 is 84”).\n\nCHECK FOR UNDERSTANDING\n“Turn to your partner. In 84 ÷ 7, which number is the dividend? Which is the divisor?” (Rosenshine Principle 6.) Add the three words to the math word wall.\n\nPRIOR-UNIT SUPPORT (IM L13)\nGrade 3, Unit 4, Section A What Is Division?\n\nBRIDGE\n“Division can also show up when we know an area and one side of a rectangle.”"}, {"img": "_hub/slides/Math_U2_L15_Equal_Groups_and_Area_Division/s009.jpg", "title": "Activity 2", "notes": "PURPOSE\nIM L14 Activity 1 launch (Elena’s Mural; IM PLC Activity). Students find one side of a rectangle from the area and the other side. Addressing 4.MD.A.3, 4.NBT.B.6.\n\nTIMING\nAbout 1 minute.\n\nCLICKS\nClick 1: What do we know? Click 2: What do we need to find?\n\nLAUNCH (IM)\n• Groups of 2\n• Explain what a mural is or show an image.\n\nNOTE\nThe “What do we know / need to find” cards are a launch scaffold written for this deck, not IM text. The facts in them are from the IM task.\n\nUDL (IM, Representation: Internalize Comprehension)\nIn the synthesis, invite students to identify what information and thinking was most helpful. Record their language and pictures and keep the display up as a reference."}, {"img": "_hub/slides/Math_U2_L15_Equal_Groups_and_Area_Division/s010.jpg", "title": "Activity 2", "notes": "PURPOSE\nGet Ready · Do · Done send-off into Elena’s Mural (Ward & Jacobsen, GDD pp. 74–79).\n\nTIMING\nAbout 1 minute, then start the timer.\n\nCLICKS (right to left)\nClick 1: Done mat. Click 2: Do mat. Click 3: Get Ready mat.\n\nSTEP TIMES\nInferred. IM gives 5 minutes of independent work and 2 minutes of partner discussion. The previous version of this deck used 6 and 3 for the combined lesson; this slide splits the 6 independent minutes into 4 (question 1) and 2 (question 2). The ½ checkpoint is after question 1, about 4–5 minutes in.\n\nTEACHER SAYS (written for this deck; adjust to your words)\n“Future glasses on. When you are done, your page shows how many tiles long the mural is, a picture or equations that prove it, and at least one equation. Four minutes for question 1, two for question 2, then three minutes with your partner. Get your grid paper and journal side by side.”\n\nFUTURE-GLASSES PROMPT\n“Picture the mural. Seven rows of tiles. What does your drawing of it look like?”\n\nIF–THEN OBSTACLE PROMPT\n“If counting 189 tiles feels too slow, then think about multiples of 7: what is 7 × 10? If your partner’s answer is different, then multiply 7 by your answer to check.”\n\nTIMER\nSet the timer for the halfway point (about 4–5 minutes). At the ½ checkpoint: “Do you have the length? Move to your equations.”"}, {"img": "_hub/slides/Math_U2_L15_Equal_Groups_and_Area_Division/s011.jpg", "title": "Activity 2", "notes": "PURPOSE\nIM L14 Activity 1 task (verbatim). The grid shows the mural; the size of the product discourages counting tiles, so students find multiples of 7 or decompose 189 (MP2).\n\nTIMING\nAbout 9 minutes: 6 independent, 3 partner (IM: 5 and 2).\n\nCLICKS\nNone.\n\nACTIVITY (IM)\n5 minutes: independent work time\n2 minutes: partner discussion\n• Monitor for students who use multiples of 10 and 7 and then either add or subtract multiples of 7 to reach 189.\n\nABOUT THE VISUAL\nThe grid is 7 rows by 27 columns, redrawn from the IM image. IM: “The use of tiles as a context and the presence of a grid allow students to see more concretely the relationship between a product and a factor, but the size of the product discourages students to count the tiles to find the unknown factor.”\n\nANSWERS (IM)\n1. 27 tiles long. “If the length is 20 tiles, the mural would need 140 tiles, leaving 49 tiles. Seven times 7 is 49, so the length must be 20 + 7 or 27 tiles.” Or: “I know that 10 × 7 is 70. I marked off two 10 × 7 rectangles, which are equal to 140 tiles. 189 − 140 is 49 and 7 × 7 = 49, so I marked off a 7 × 7 rectangle. The length of the mural is 10 + 10 + 7, which is 27.”\n2. (7 × 10) + (7 × 10) + (7 × 7) = 189 · 140 ÷ 7 = 20, 49 ÷ 7 = 7, and 20 + 7 = 27 · 7 × ℓ = 189, or ℓ = 189 ÷ 7\n\nMISCONCEPTION WATCH\n• Adding 189 + 7 or subtracting. Ask what 189 stands for (all the tiles) and what 7 stands for (the width).\n• Guessing a length and multiplying without adjusting. Ask “Is your product too big or too small? By how much?”\n\nCONFERRING (card)\nCan students explain what makes a situation \"equal groups\" versus \"area,\" not just label it? Ask: “Why is this an area problem and not an equal-groups problem?” Listen for “the 7 is a side of the rectangle” and “the 189 is the area.”\n\nDIFFERENTIATION\nSupport: a list of multiples of 7 (7, 14, 21, … 70) or base-ten blocks. Extension: find a second way to break up 189."}, {"img": "_hub/slides/Math_U2_L15_Equal_Groups_and_Area_Division/s012.jpg", "title": "Activity 2", "notes": "PURPOSE\nIM L14 Activity 1 Synthesis. Highlight strategies that use multiples of 10 and 7 to find the side length by dividing or multiplying in parts.\n\nTIMING\nAbout 4 minutes.\n\nCLICKS\nClick 1: the area diagram with 70, 70, 49. Click 2: total and length. Clicks 3–5: the three equations, one at a time.\n\nTEACHER MOVES (IM)\n• Select students to share their responses and reasoning. Display their responses for all to see.\n• Highlight strategies that use multiples of 10 and 7 to find the side length of the rectangle by dividing or multiplying in parts. If no students use an area diagram in their reasoning, display an example for all to see (this slide).\n• Invite students to write the equations they wrote. If no division equations are included, display division equations and ask students if they could be used to answer the question. (For instance, 140 ÷ 7 = 20 and 49 ÷ 7 = 7, so 189 ÷ 7 = 27.)\n\nABOUT THE VISUAL\nThe area diagram is redrawn from the IM student response: two 10 × 7 rectangles (70 each) and one 7 × 7 rectangle (49). The equations are the IM sample responses.\n\nSUGGESTED QUESTION (not IM)\n“Where do you see the 140 in the picture? Where is the 49? Where is the 27?”\n\nUDL (IM, Representation)\nInvite students to identify what information and thinking was most helpful. Record their responses, including mathematical language and pictures, and keep the display as a reference.\n\nROSENSHINE\nPrinciple 4: Provide models, after students have tried the problem."}, {"img": "_hub/slides/Math_U2_L15_Equal_Groups_and_Area_Division/s013.jpg", "title": "Lesson Wrap Up", "notes"
