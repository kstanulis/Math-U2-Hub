<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Unit 2 Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple-deep:#1F3A5F; --purple-mid:#2F6690; --purple-light:#DCE8F3; --purple-pale:#F1F6FB;
  --gold:#C9963A; --gold-light:#FDF3E2; --teal:#2A7D6F; --teal-light:#E3F4F1;
  --charcoal:#16202C; --warm-gray:#5F6B7A; --rule:#D6E0EA; --page:#F8FAFC; --white:#fff;
  --rose:#9B2C2C; --rose-light:#FBEAEA; --blue:#0369A1; --blue-light:#E4F1F9; --amber:#B45309;
  --p1:#2F6690; --p2:#2A7D6F; --p3:#B45309;
  --thinkers:#6B46C1; --researchers:#0369A1; --communicators:#2A7D6F; --collaborators:#B45309; --selfmgr:#9B2C2C;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--page);color:var(--charcoal);font-size:14px;line-height:1.55}
a{color:var(--purple-mid)}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;font-weight:400;color:var(--purple-deep);line-height:1.2}

/* layout */
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.side{background:var(--purple-deep);color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 0 40px;border-right:4px solid var(--gold)}
.side .brand{padding:0 20px 14px;cursor:pointer}
.side .brand small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#B9CCE0;font-weight:600}
.side .brand b{font-family:'DM Serif Display',serif;font-weight:400;font-size:20px;line-height:1.15;display:block;margin-top:4px}
.search{margin:4px 16px 14px;position:relative}
.search input{width:100%;border:0;border-radius:6px;padding:8px 10px;font:inherit;font-size:13px;background:rgba(255,255,255,.12);color:#fff}
.search input::placeholder{color:#B9CCE0}
.results{position:absolute;left:0;right:0;top:38px;background:#fff;color:var(--charcoal);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20;max-height:60vh;overflow:auto;display:none}
.results a{display:block;padding:8px 12px;text-decoration:none;color:var(--charcoal);border-bottom:1px solid var(--rule);font-size:13px}
.results a small{display:block;color:var(--warm-gray);font-size:11px}
.results a:hover{background:var(--purple-pale)}
.nav-sec{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#B9CCE0;font-weight:700;padding:14px 20px 6px}
.nav a{display:flex;align-items:center;gap:8px;padding:5px 20px;color:#E6EEF6;text-decoration:none;font-size:13px;border-left:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:rgba(255,255,255,.13);border-left-color:var(--gold);color:#fff}
.nav a.partlink{font-weight:600;margin-top:6px}
.nav a.les{padding-left:30px;font-size:12.5px}
.nav .num{font-size:10.5px;font-weight:700;min-width:34px;color:#CFE0F0}
.nav .tick{margin-left:auto;color:var(--gold);font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.main{min-width:0}
.view{max-width:1120px;margin:0 auto;padding:28px 40px 90px}
.menu-btn{display:none}

/* masthead */
.mast{background:var(--purple-deep);color:#fff;border-bottom:4px solid var(--gold);padding:34px 40px 30px}
.mast .eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#B9CCE0;margin-bottom:8px}
.mast h1{color:#fff;font-size:32px}
.mast h1 em{color:#CFE0F0}
.mast p{color:#B9CCE0;font-size:13px;margin-top:6px}

.crumb{font-size:12px;color:var(--warm-gray);margin-bottom:10px}
.crumb a{color:var(--warm-gray)}
.eyebrow2{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--warm-gray)}
h2.big{font-size:28px;margin:4px 0 6px}
.lead{color:var(--warm-gray);font-size:13.5px}
section{margin-top:28px}
section > h3{font-size:19px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
section > h3 .count{font-family:'DM Sans';font-size:11px;color:var(--warm-gray);font-weight:600}

/* cards */
.card{background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:16px 18px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.note{background:var(--teal-light);border-left:4px solid var(--teal);border-radius:0 8px 8px 0;padding:12px 16px;font-size:13px;color:#1a5c51}
.flag{background:var(--gold-light);border-left:4px solid var(--gold);border-radius:0 8px 8px 0;padding:10px 14px;font-size:13px;color:#6b4a12;margin-top:8px}
.muted{color:var(--warm-gray)}
.small{font-size:12px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;text-decoration:none;border:1px solid transparent;white-space:nowrap}
.std{background:var(--purple-light);color:var(--purple-deep)}
.std.a{background:var(--purple-deep);color:#fff}
.std:hover{border-color:var(--purple-mid)}
.chip.deck{background:var(--blue-light);color:var(--blue)}
.chip.plan{background:var(--teal-light);color:var(--teal)}
.chip.none{background:#EEF2F6;color:#8A97A6}
.chip.cp{background:var(--rose-light);color:var(--rose)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.legend{font-size:11.5px;color:var(--warm-gray);display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* lesson list cards */
.lcard{display:grid;grid-template-columns:64px minmax(0,1fr);background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;transition:box-shadow .15s}
.lcard:hover{box-shadow:0 6px 18px rgba(31,58,95,.1)}
.lcard .n{background:var(--purple-pale);border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'DM Serif Display';font-size:19px;color:var(--purple-mid)}
.lcard .n small{font-family:'DM Sans';font-size:9px;font-weight:700;color:#9FB0C2;letter-spacing:.06em}
.lcard .n .t{font-family:'DM Sans';color:var(--gold);font-size:13px}
.lcard .b{padding:12px 16px}
.lcard .ti{font-weight:600;font-size:14px}
.lcard .tg{font-size:12px;font-style:italic;color:var(--purple-mid);margin:3px 0 7px}
.lcard .card-line{font-size:11px;color:var(--warm-gray);margin-bottom:6px}

/* part tiles */
.ptile{border-radius:10px;padding:14px 16px;color:#fff;text-decoration:none;display:block;min-height:120px}
.ptile b{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.ptile span{display:block;font-family:'DM Serif Display';font-size:16px;line-height:1.25;margin:6px 0}
.ptile small{opacity:.85;font-size:11.5px}
.progress{height:4px;background:rgba(255,255,255,.3);border-radius:3px;margin-top:8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold)}

/* timeline */
.timeline{display:flex;gap:6px;flex-wrap:wrap}
.tl{display:flex;flex-direction:column;align-items:center;justify-content:center;width:62px;height:54px;border-radius:8px;background:#fff;border:1px solid var(--rule);text-decoration:none;color:var(--charcoal);font-size:11px;font-weight:700;position:relative;border-top:4px solid var(--c)}
.tl small{font-weight:500;font-size:9px;color:var(--warm-gray);text-align:center;line-height:1.1;padding:0 3px}
.tl.done::after{content:'✓';position:absolute;top:2px;right:5px;color:var(--gold);font-size:11px}
.tl:hover{background:var(--purple-pale)}

/* lesson page */
.lhead{display:flex;gap:18px;align-items:flex-start}
.lnum{flex-shrink:0;width:78px;height:78px;border-radius:12px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'DM Serif Display';font-size:26px}
.lnum small{font-family:'DM Sans';font-size:10px;letter-spacing:.08em;font-weight:700;opacity:.85}
.targets{margin-top:8px}
.targets li{list-style:none;font-style:italic;color:var(--purple-mid);font-weight:500;margin:2px 0}
.taught{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;background:#fff;border:1px solid var(--rule);border-radius:20px;padding:5px 12px;margin-top:10px;cursor:pointer;user-select:none}
.taught input{accent-color:var(--purple-mid)}
.split{display:grid;grid-template-columns:1fr 1fr;border-radius:10px;overflow:hidden;border:1px solid var(--rule)}
.split > div{padding:12px 16px;background:#fff}
.split > div + div{border-left:1px solid var(--rule)}
.split .lab{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--warm-gray);margin-bottom:4px}
.split .q{font-size:13.5px}
.asset{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;border-radius:20px;padding:1px 9px;margin-bottom:4px}
.two{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.row{padding:10px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warm-gray);margin-bottom:2px}
blockquote{border-left:3px solid var(--gold);padding:4px 0 4px 12px;font-size:14px;color:var(--charcoal)}
.side-block + .side-block{margin-top:14px}
.side-block h4{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--warm-gray);margin-bottom:6px}
.slink{display:block;padding:7px 10px;border-radius:7px;background:var(--purple-pale);margin-bottom:5px;text-decoration:none;color:var(--charcoal);font-size:13px}
.slink:hover{background:var(--purple-light)}
.slink small{display:block;color:var(--warm-gray);font-size:11.5px}
.file{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--rule);border-radius:7px;background:#fff;text-decoration:none;color:var(--charcoal);font-size:12.5px;margin-bottom:5px;word-break:break-word}
.file:hover{border-color:var(--purple-mid)}
.file .ext{font-size:9.5px;font-weight:800;text-transform:uppercase;border-radius:4px;padding:2px 5px;color:#fff;background:#7F8C9B;flex-shrink:0;min-width:36px;text-align:center}
.file .ext.docx{background:#2B579A}.file .ext.pptx{background:#C43E1C}.file .ext.pdf{background:#B30B00}.file .ext.md{background:#555}.file .ext.html{background:var(--teal)}.file .ext.web{background:var(--purple-mid)}
.file.missing{opacity:.55;border-style:dashed}
.notes-area textarea{width:100%;min-height:90px;border:1px solid var(--rule);border-radius:8px;padding:10px;font:inherit;font-size:13px;resize:vertical;background:#fff}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:34px}
.pn a{flex:1;max-width:48%;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:#fff;text-decoration:none;color:var(--charcoal)}
.pn a small{display:block;color:var(--warm-gray);font-size:11px}
.pn a.r{text-align:right;margin-left:auto}

/* slide viewer */
.viewer{background:#111A24;border-radius:12px;padding:12px;color:#fff;outline:none}
.viewer:focus-visible{box-shadow:0 0 0 3px var(--gold)}
.vtop{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.vtop .ttl{font-weight:600;font-size:13px;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbtn{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:6px;padding:5px 10px;font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.vbtn:hover{background:rgba(255,255,255,.2)}
.vbtn.on{background:var(--gold);color:#111A24}
.stage{position:relative;display:flex;align-items:center;justify-content:center;background:#000;border-radius:8px;overflow:hidden}
.stage img{max-width:100%;max-height:70vh;display:block}
.viewer.portrait .stage img{max-height:80vh}
.arrow{position:absolute;top:0;bottom:0;width:18%;border:0;background:transparent;color:#fff;font-size:30px;opacity:0;transition:opacity .15s}
.stage:hover .arrow{opacity:.85}
.arrow.l{left:0;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}
.arrow.r{right:0;background:linear-gradient(-90deg,rgba(0,0,0,.35),transparent)}
.counter{position:absolute;bottom:8px;right:10px;background:rgba(0,0,0,.6);font-size:11.5px;padding:2px 8px;border-radius:10px}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 2px}
.thumbs button{flex-shrink:0;border:2px solid transparent;border-radius:5px;padding:0;background:none;opacity:.6}
.thumbs button.on{border-color:var(--gold);opacity:1}
.thumbs .th{display:block;border-radius:3px;background-repeat:no-repeat;background-color:#fff}
.spk{background:#1C2633;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:13px;white-space:pre-wrap;color:#E3EAF2;max-height:220px;overflow:auto}
.spk .lab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:4px}
.viewer:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0;padding:10px}
.viewer:fullscreen .stage{flex:1;background:#000}
.viewer:fullscreen .stage img{max-height:calc(100vh - 70px)}
.viewer:fullscreen .thumbs,.viewer:fullscreen .spk{display:none}
.empty{border:2px dashed var(--rule);border-radius:12px;padding:22px;text-align:center;color:var(--warm-gray);background:#fff}

/* standards */
.matrix{overflow-x:auto;background:#fff;border:1px solid var(--rule);border-radius:10px}
.matrix table{border-collapse:collapse;font-size:12px;width:100%}
.matrix th,.matrix td{border-bottom:1px solid var(--rule);padding:6px 5px;text-align:center}
.matrix th{font-size:10.5px;color:var(--warm-gray);font-weight:700;white-space:nowrap}
.matrix th a{color:inherit;text-decoration:none}
.matrix td.sc{text-align:left;white-space:nowrap;padding-left:12px}
.matrix td.sc a{font-weight:700;text-decoration:none;color:var(--purple-deep)}
.matrix .pt{border-left:2px solid var(--rule)}
.mk{display:inline-block;width:14px;height:14px;border-radius:50%}
.mk.p{background:var(--purple-light);border:2px solid var(--purple-mid)}
.mk.a{background:var(--purple-deep)}
.scale{border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:#fff}
.scale > div{display:grid;grid-template-columns:62px 1fr;border-bottom:1px solid var(--rule)}
.scale > div:last-child{border-bottom:0}
.scale .lv{font-family:'DM Serif Display';font-size:20px;display:flex;align-items:center;justify-content:center;background:var(--purple-pale);color:var(--purple-mid)}
.scale .lv.t{background:var(--purple-deep);color:#fff}
.scale .tx{padding:10px 14px;font-size:13px}
.scale ul{padding-left:18px;margin-top:4px}
table.rub{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
table.rub th{background:var(--purple-deep);color:#fff;text-align:left;padding:8px 10px;font-weight:600;font-size:12px}
table.rub td{border:1px solid var(--rule);padding:8px 10px;vertical-align:top}
table.rub td:first-child{font-weight:600;background:var(--purple-pale)}
.pdfwrap iframe{width:100%;height:78vh;border:1px solid var(--rule);border-radius:10px;background:#fff}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:1px solid var(--rule);background:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--warm-gray)}
.asset{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px;background:var(--purple-light);color:var(--purple-deep);margin-bottom:6px}
.docbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.docbar .tabs{margin:0}
.docbar a{margin-left:auto;font-size:12px;font-weight:600}
.tabs button.on{background:var(--purple-deep);color:#fff;border-color:var(--purple-deep)}

@media (max-width:1000px){
  .two,.g3,.g4{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 25% 0 0;z-index:30;transform:translateX(-105%);transition:transform .2s;height:100vh}
  .side.open{transform:none}
  .menu-btn{display:inline-flex;position:fixed;top:10px;left:10px;z-index:40;background:var(--purple-deep);color:#fff;border:2px solid var(--gold);border-radius:8px;padding:6px 10px;font-weight:700}
  .view{padding:56px 16px 70px}
  .mast{padding:56px 16px 22px}
  .two,.g2,.g3,.g4,.split{grid-template-columns:1fr}
  .split > div + div{border-left:0;border-top:1px solid var(--rule)}
  .lhead{flex-direction:column}
}
@media print{
  .side,.menu-btn,.viewer,.pn,.notes-area,.taught{display:none!important}
  .app{display:block}
}
</style>
</head>

{"name": "Day 11 Student.pdf", "href": "../Resources/Math%20Unit%202%20Resources/Day%2011%20Student.pdf", "ext": "pdf", "ok": true, "dir": "Resources/Math Unit 2 Resources"}], ["Cool-down", {"name": "Day 11 Cool.pdf", "href": "../Resources/Math%20Unit%202%20Resources/Day%2011%20Cool.pdf", "ext": "pdf", "ok": true, "dir": "Resources/Math Unit 2 Resources"}]], "texts": [], "res": [], "sg": [], "rubrics": [], "cp": null, "flags": []}, {"id": "D12", "label": "D12", "day": 12, "part": "p2", "card": "Bridges Supplement · Forum", "title": "Bridges Supplement — Doubling & Halving, and a Strategy Forum", "targets": ["I can multiply multi-digit numbers using efficient strategies, and explain my thinking."], "target_note": "", "desc": "IM Unit 6 doesn't dedicate a lesson to doubling and halving factors, but Bridges Unit 2, Module 3, Sessions 2–3 (Strategies & Forum; Doubling & Halving) fills the gap — deliver the Session 3 Ratio Table string from the Teacher Guide (Bridges Slides: Doubling Problem String; Student Book pp. 68–69), building toward the idea that when one factor doubles or is cut in half, so does the product. Then hold a forum where students share which of this week's recording methods — diagram, partial products, or standard algorithm — they found most efficient for a given problem, echoing the comparison IM L11 began.", "sq": "As mathematicians, what happens to a product when we double one factor — or cut it in half — and which of our recording methods shows that most clearly?", "case": "As communicators, how can being responsive to a classmate's strategy in the forum help us understand a new way to think about a problem?", "asset": "Communicators · Responsive", "std": {"4.NBT.B.5": "p"}, "tp": "Bridges U2 M3 S3: Ratio Table string — doubling and halving factors (Bridges Slides: Doubling Problem String)", "work": "Bridges U2 M3 S2–S3: doubling/halving ratio table string (Student Book pp. 68–69); forum comparing diagram, partial products, and standard algorithm", "conf": "Can students explain WHY a strategy worked, not just that it did?", "assess": "Forum observation; doubling/halving ratio-table tasks", "deck": "Math U2 L12_Doubling & Halving.pptx", "plan": [{"name": "Unit2_Lesson12_Doubling_and_Halving_and_a_Strategy_Forum.docx", "href": "Unit2_Lesson12_Doubling_and_Halving_and_a_Strategy_Forum.docx", "ext": "docx", "ok": true, "dir": "Outputs"}], "docs": [["Student pages", {"name": "Day 12 Student.pdf", "href": "../Resources/Math%20Unit%202%20Resources/Day%2012%20Student.pdf", "ext": "pdf", "ok": true, "dir": "Resources/Math Unit 2 Resources"}]], "texts": [], "res": ["doubling-string"], "sg": [], "rubrics": [], "cp": null, "flags": ["Bridges Teacher Guide pages for U2 M3 S2–S3 aren’t in the project yet. The student pages and lesson plan are."]}, {"id": "D13", "label": "D13", "day": 13, "part": "p2", "card": "IM L12", "title": "Solve Problems Involving Multiplication", "targets": ["I can choose an efficient strategy to solve a multi-step multiplication problem, and explain my choice."], "target_note": "", "desc": "Illustrative Math Lesson 12 asks students to apply whichever strategy from this part — diagram, partial products, standard algorithm, or Day 12's doubling/halving — fits a multi-step problem best, and to explain that choice. This is deliberately the last practice day before the Checkpoint, which asks for exactly this kind of efficiency reasoning.", "sq": "As mathematicians, how do we decide which strategy is the most efficient one for a given problem?", "case": "As researchers, how can being resourceful — drawing on every strategy we've learned this part — help us pick the best tool for a new problem?", "asset": "Researchers · Resourceful", "std": {"4.NBT.B.5": "p"}, "tp": "IM L12: choosing and justifying a strategy for a multi-step multiplication problem", "work": "IM L12 multi-step problems — solve and explain strategy choice", "conf": "Final efficiency-reasoning support before tomorrow's Checkpoint", "assess": "IM L12 multi-step problem set with strategy justification", "deck": "Math U2 L13_Solve-Problems-Involving-Multiplication.pptx", "plan": [], "docs": [["Teacher guide · IM L12", {"name": "Day 13 Teacher.pdf", "href": "../Resources/Math%20Unit%202%20Resources/Day%2013%20Teacher.pdf", "ext": "pdf", "ok": true, "dir": "Resources/Math Unit 2 Resources"}], ["Student pages", {"name": "Day 13 Student .pdf", "href": "../Resources/Math%20Unit%202%20Resources/Day%2013%20Student%20.pdf", "ext": "pdf", "ok": true, "dir": "Resources/Math Unit 2 Resources"}], ["Cool-down", {"name": "Day 13 Cool.pdf", "href": "../Resources/Math%20Unit%202%20Resources/Day%2013%20Cool.pdf", "ext": "pdf", "ok": true, "dir": "Resources/Math Unit 2 Resources"}]], "texts": [], "res": [], "sg": [], "rubrics": [], "cp": null, "flags": []}, {"id": "D14", "label": "D14", "day": 14, "part": "p2", "card": "Checkpoint", "title": "Checkpoint: Multiplication Strategies", "targets": ["I can choose and use efficient strategies to solve multiplication story problems, and explain why."], "target_note": "", "desc": "Briefly revisit yesterday's strategy-justification work, then administer the M3 Checkpoint: Multiplication Strategies. It asks students to solve a two-digit-by-two-digit comparison problem (apartment areas) using a ratio table plus one other strategy, and to explain which strategy was most efficient and why — the clearest expression of \"explaining my thinking\" (EQ2) in this unit, and the direct payoff of Days 9–13's recording and comparison work.", "sq": "As mathematicians, how do we show — using two different strategies — which one is really the most efficient?", "case": "As thinkers, how can being open-minded about more than one strategy help us judge which one is truly the most efficient?", "asset": "Thinkers · Open-Minded", "std": {"4.NBT.B.5": "a"}, "tp": "Brief review connecting IM L11–L12's strategy comparison to today's Checkpoint prompt", "work": "M3 Checkpoint: Multiplication Strategies", "conf": "Final efficiency-reasoning support before the Checkpoint", "assess": "M3 Checkpoint: Multiplication Strategies (NBT.5 — ratio table plus a second strategy; explain which was most efficient and why)", "deck": "Math U2 L14_Checkpoint_Multiplication_Strategies.pptx", "plan": [], "docs": [], "texts": [], "res": [], "sg": [], "rubrics": ["ican"], "cp": "cp2", "flags": []}, {"id": "D15", "label": "D15", "day": 15, "part": "p3", "card": "IM L13–L14", "title": "Situations Involving Equal-Size Groups & Area", "targets": ["I can identify whether a division situation involves equal-size groups or area, and represent it with a diagram."], "target_note": "", "desc": "Illustrative Math Lessons 13 and 14 open Section C by contrasting two situation types division shows up in: equal-size groups (sharing a quantity evenly) and area (finding a missing side length). Students sort and represent problems of each type before any formal algorithm — the same situation-first approach the unit's multiplication work took with base-ten and area diagrams.", "sq": "As mathematicians, how is dividing into equal groups related to the multiplication we've already learned?", "case": "As self managers, how can being flexible — trying our multiplication tools on a new operation — help us get started with division?", "asset": "Self Managers · Flexible", "std": {"4.NBT.B.6": "p"}, "tp": "IM L13–L14: distinguishing equal-size-groups and area situations for division", "work": "Sort and represent division situations by type; diagram each", "conf": "Can students explain what makes a situation \"equal groups\" versus \"area,\" not just label it?", "assess": "IM L13–L14 situation-sorting and diagramming tasks", "deck": "Math U2 L15_Equal_Groups_and_Area_Division.pptx", "plan": [], "docs": [["Teacher guide · IM L13", {"name": "Day 15 - Lesson 13 T.pdf", "href": "../Resources/Math%20Unit%202%20Resources/Day%2015%20-%20Lesson%2013%20T.pdf", "ext": "pdf", "ok": true, "dir": "Resources/Math Unit 2 Resources"} eacher guide · IM L17", {"name": "Day 17 - Lesson 17 T.pdf", "href": "../Resources/Math%20Unit%202%20Resources/Day%2017%20-%20Lesson%2017%20T.pdf", "ext": "pdf", "ok": true, "dir": "Resources/Math Unit 2 Resources"}], ["Teacher guide · IM L18", {"name": "Day 17 - Lesson 18 T.pdf", "href": "../Resources/Math%20Unit%202%20Resources/Day%2017%20-%20Lesson%2018%20T.pdf", "ext": "pdf", "ok": true, "dir": "Resources/Math Unit 2 Resources"}], ["Student pages · IM L17", {"name": "Day 17 Student.pdf", "href": "../Resources/Math%20Unit%202%20Resources/Day%2017%20Student.pdf", "ext": "pdf", "ok": true, "dir": "Resources/Math Unit 2 Resources"}]], "texts": [], "res": [], "sg": [], "rubrics": [], "cp": null, "flags": []}, {"id": "D18", "label": "D18", "day": 18, "part": "p3", "card": "IM L19–L20 · Discussion", "title": "Dividing with Remainders & Interpreting What They Mean", "targets": ["I can divide with remainders using partial quotients, and explain what the remainder means in the context of the problem."], "target_note": "", "desc": "Illustrative Math Lessons 19 and 20 extend yesterday's partial-quotients recording to problems that don't divide evenly, then turn to the reasoning the M4 Checkpoint will ask for directly: what should we do with a remainder, and does the answer change depending on the story? Discuss rounding up, dropping the remainder, or expressing it as a fraction, matched to context — round up for \"how many buses do we need,\" drop it for \"how many full teams can we make.\"", "sq": "As mathematicians, what should we do with a remainder — and does the answer change depending on the story?", "case": "As communicators, how can being respectful — really listening to a classmate's reasoning — help us hear a new way to think about a remainder?", "asset": "Communicators · Respectful", "std": {"4.NBT.B.6": "p"}, "tp": "IM L19: dividing with remainders using partial quotients; IM L20: what a remainder means depending on context", "work": "IM L19–L20 tasks — divide with remainders, then decide what to do with the remainder for each context", "conf": "Can students justify what to do with a remainder for a specific context, not just calculate it?", "assess": "IM L19–L20 tasks", "deck": "Math U2 L18_Dividing_with_Remainders.pptx", "plan": [], "docs": [["Teacher guide · IM L19", {"name": "Day 18 - Lesson 19 T.pdf", "href": "../Resources/Math%20Unit%202%20Resources/Day%2018%20-%20Lesson%2019%20T.pdf", "ext": "pdf", "ok": true, "dir": "Resources/Math Unit 2 Resources"}], ["Teacher guide · IM L20", {"name": "Day 18 - Lesson 20 T.pdf", "href": "../Resources/Math%20Unit%202%20Resources/Day%2018%20-%20Lesson%2020%20T.pdf", "ext": "pdf", "ok": true, "dir": "Resources/Math Unit 2 Resources"}], ["Student pages · IM L19", {"name": "Day 18 Student.pdf", "href": "../Resources/Math%20Unit%202%20Resources/Day%2018%20Student.pdf", "ext": "pdf", "ok": true, "dir": "Resources/Math Unit 2 Resources"}]], "texts": [], "res": [], "sg": [], "rubrics": [], "cp": null, "flags": []}, {"id": "D19", "label": "D19", "day": 19, "part": "p3", "card": "IM L21 · Checkpoint", "title": "Checkpoint: Division with Remainders", "targets": ["I can find whole-number quotients and remainders, and explain how to divide larger numbers using equations, arrays, or models."], "target_note": "", "desc": "Open with an Illustrative Math Lesson 21 problem — applying the division and remainder-interpretation reasoning from Days 17–18 to a new context — as a warm-up, then administer the M4 Checkpoint: Division with Remainders. The Checkpoint asks students to divide 17 eggs among 4 children and explain what to do with what's left over — the exact interpret-the-remainder reasoning practiced across Days 18–19. Send home the Student/Parent U2 Math Chat along with the revised U2 Screener.", "sq": "As mathematicians, how do we show our thinking clearly enough that someone else could follow exactly how we divided — and what we did with the remainder?", "case": "As self managers, how can b y feel most confident with (diagram, partial products, standard algorithm, or partial quotients) and one they want to keep practicing — echoing the reasonableness-checking habit Illustrative Math's own closing section (Assess the Reasonableness of Solutions) asks of students, applied here to their own growth. Close with a share circle connecting back to the unit's two essential questions.", "sq": "As mathematicians, how have we changed since the first day of this unit — and what do we want to work on next?", "case": "As self managers, how can reflecting on our three Checkpoints help us see how far we've come as mathematicians?", "asset": "Self Managers · Reflective", "std": {"4.OA.C.5": "p", "4.NBT.A.1": "a", "4.NBT.B.5": "a", "4.NBT.B.6": "a"}, "tp": "Mathematicians revisit their own growth — comparing pre-unit thinking to Day 20 thinking, and checking it for reasonableness", "work": "Revise the U2 Screener; compare pre-unit responses to now; name a strategy of confidence and a strategy to keep practicing; share circle", "conf": "Goal-setting conversations for Unit 3, grounded in each student's three Checkpoint results", "assess": "Revised U2 Screener as portfolio evidence of growth; self-assessment against OA.5, NBT.A1, NBT.5, NBT.6", "deck": null, "plan": [], "docs": [], "texts": [], "res": ["screener-ref"], "sg": [], "rubrics": ["ican"], "cp": "screener-rev", "flags": ["No deck for Day 20 in the project yet."]}], "checkpoints": [{"id": "screener", "title": "U2 Screener: Multiplicative Thinking (pre-unit)", "part": "p1", "lesson": "D01", "kind": "Pre-unit baseline", "std": ["4.NBT.A.1", "4.NBT.B.5", "4.NBT.B.6"], "text": null, "what": ["Checkpoint and Screener materials are kept off the public copy of this hub. Ask Keith for the PDFs and answer keys."], "files": [], "links": [], "flag": null}, {"id": "cp1", "title": "M1&M2 Checkpoint: Place Value & Multiplication", "part": "p1", "lesson": "D08", "kind": "Checkpoint 1 (Bridges, as written)", "std": ["4.NBT.A.1", "  and remainders.", "4.NBT.B.6"], ["Screener (pre-unit · Day 20)", "1, 2", "I can explain that in a multi-digit whole number, each digit is worth 10 times more than the digit to its right.", "4.NBT.A.1"], ["Screener (pre-unit · Day 20)", "3", "I can multiply 2-digit numbers", "4.NBT.B.5"], ["Screener (pre-unit · Day 20)", "4", "I can find whole number quotients and remainders. · I can explain how to divide larger numbers by using equations, arrays /models", "4.NBT.B.6"]], "scale": "Statements quoted from the Checkpoint and Screener PDFs. The Unit 2 scoring rubric isn’t in the project yet. Add it to Resources/ and it will be linked here and to every Checkpoint day.", "files": []}], "groups": [], "texts": [], "resources": [{"id": "mesa", "title": "MESA problem-solving routine", "kind": "Class routine (every day)", "body": ["Model · Equation · Strategy · Answer with units."], "files": [], "links": []}, {"id": "number-talk", "title": "Number Talk: Patterns in Multiplication", "kind": "IM L4 warm-up (Day 1)", "body": ["20×3, 21×3, 40×3, 42×3: using a known fact to derive a new one. Followed by the “start with 10, double it” pattern (10, 20, 40, 80, 160…)."], "files": [], "links": []}, {"id": "great-wall", "title": "The Great Wall of Base Ten", "kind": "Bridges supplement · class display (Days 2–3 onward)", "body": ["Build as a class using small 100-blocks; fill in the chart on SB p.44. Each piece is ten times the size of the piece to its right: mat, strip, unit. Keep the display up as a reference for the base-ten diagrams IM introduces on Day 3."], "files": [], "links": []}, {"id": "bridges-arrays", "title": "Bridges array-building pages", "kind": "Bridges Student Book p.52–53 (Day 7)", "body": ["For students who want to return to a physical array before the Day 8 Checkpoint."], "files": [], "links": []}, {"id": "doubling-string", "title": "Doubling Problem String (ratio table)", "kind": "Bridges U2 M3 S2–S3 (Day 12)", "body": ["Bridges Slides: Doubling Problem String; Student Book pp. 68–69. When one factor doubles or is cut in half, so does the product."], "files": [{"name": "Day 12 Student.pdf", "href": "../Resources/Math%20Unit%202%20Resources/Day%2012%20Student.pdf", "ext": "pdf", "ok": true, "dir": "Resources/Math Unit 2 Resources"}], "links": []}, {"id": "screener-ref", "title": "U2 Screener", "kind": "Baseline · revisited before each Checkpoint and on Day 20", "body": ["Pre-unit baseline. Students revise it on Day 20 and compare their answers."], "files": [], "links": []}, {"id": "math-chat", "title": "Student/Parent U2 Math Chat", "kind": "Home connection (Day 19)", "body": ["Sent home with the revised U2 Screener."], "files": [], "links": []}, {"id": "assets", "title": "Learning Assets reference", "kind": "Split-screen intentions", "body": ["Thinkers · Researchers · Communicators · Collaborators · Self Managers, with three dispositions each."], "files": [{"name": "LEARNING-ASSETS.md", "href": "../Resources/LEARNING-ASSETS.md", "ext": "md", "ok": true, "dir": "Resources"}], "links": []}], "unitFiles": [["Lesson Sequence (20 days, 3 parts)", {"name": "G4_Math_U2_Lesson_Sequence_1.html", "href": "../Resources/G4_Math_U2_Lesson_Sequence_1.html", "ext": "html", "ok": true, "dir": "Resources"}], ["Project instructions", {"name": "PROJECT-INSTRUCTIONS.md", "href": "../PROJECT-INSTRUCTIONS.md", "ext": "md", "ok": true, "dir": "."}], ["Learning Assets", {"name": "LEARNING-ASSETS.md", "href": "../Resources/LEARNING-ASSETS.md", "ext": "md", "ok": true, "dir": "Resources"}]], "unitLinks": [], "decks": {"Math U2 L04_Multiply Two-Digit Numbers and One-Digit Numbers.pptx": {"name": "Math U2 L04_Multiply Two-Digit Numbers and One-Digit Numbers.pptx", "slug": "Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers", "pptx": null, "pdf": null, "sprite": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/sprite.jpg", "tw": 192, "th": 108, "landscape": true, "slides": [{"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s001.jpg", "title": "Multiply Two-Digit Numbers and One-Digit Numbers", "notes": "PURPOSE: Open the lesson and set the split-screen intention: the WHAT (mathematical inquiry) and the HOW (Learning Asset: Thinkers · Open-Minded). Text is verbatim from the Day 4 sequence card.\nTIMING: 1 min, before the Warm-up. Lesson total 60 min: Warm-up 10, Activity 1 20, Activity 2 15, Lesson Synthesis 10, Cool-down 5 (IM timeline).\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Read both questions aloud. Ask students to keep the HOW question in mind: today some problems will look too big at first, and splitting a number apart is the move that makes them manageable.\nFORMATIVE ASSESSMENT: None on this slide.\nCALLOUTS:\n  • Standard: 4.NBT.B.5 (Addressing).\n  • Instructional routine: Notice and Wonder (Warm-up).\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s002.jpg", "title": "Learning Target", "notes": "PURPOSE: State the learning target (verbatim from the Day 4 sequence card) and the IM student-facing goal.\nTIMING: 1 min.\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Read the target together. “Today” line is the IM student-facing learning goal.\nFORMATIVE ASSESSMENT: Ask students to show a thumb: how confident are you with multiplying a two-digit number by a one-digit number right now? Revisit at the Cool-down.\nCALLOUTS:\n  • IM lesson goals (teacher-facing): comprehend the term “partial products”; interpret diagrams that represent partial products; represent products of two-digit and one-digit numbers with a diagram and calculate the value.\n  • No success criteria are given in the source, so there is no Success Criteria slide.\n  • Rosenshine Principle 2: Present new material in small steps — the lesson moves from gridded rectangles → base-ten diagrams → rectangular diagrams."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s003.jpg", "title": "Warm Up", "notes": "PURPOSE: Warm-up (Notice and Wonder). Elicit prior knowledge of area and the idea that a rectangle can be decomposed into smaller rectangular regions. Students look at 4 area diagrams they used in IM Grade 3. Focus on the connections between the diagrams with a grid and those without.\nTIMING: 10 min total for the Warm-up: 1 min quiet think time, 1 min partner discussion, then share and record (synthesis on the next slide).\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Groups of 2. Display the image.\n  “What do you notice? What do you wonder?”\n  1 minute: quiet think time.\n  “Discuss your thinking with your partner.”\n  1 minute: partner discussion. Share and record responses.\nANTICIPATED RESPONSES:\n  • Students may notice (IM): Two rectangles are gridded and have no numbers. The other two have no grid and have numbers. In the first two diagrams, there are 13 squares in each row and 4 squares in each column. A portion of the gridded rectangle is shaded. Some rectangles have the side lengths marked. The last rectangle is partitioned into two sections.\n  • Students may wonder (IM): Where are the numbers in the gridded rectangles? Why is the second rectangle shaded? Do the four diagrams represent the same rectangle?\nMISCONCEPTIONS TO WATCH FOR:\n  • Students may notice many things about counting units inside the gridded region. Steer the share toward connections between the gridded and ungridded diagrams.\nDIFFERENTIATION / EXTENSION:\n  • Support: point to one row of the grid and count the 13 squares with the class before partner talk.\n  • Extension: ask early sharers what the shaded part would be worth if each square is one unit (sample: 40).\nFORMATIVE ASSESSMENT: Listen for students who connect the 13 and 4 labels to the rows and columns of squares.\nCALLOUTS:\n  • Instructional routine: Notice and Wonder.\n  • Rosenshine Principle 1: Begin with a short review (Grade 3 area diagrams).\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s004.jpg", "title": "Warm Up", "notes": "PURPOSE: Warm-up Activity Synthesis. Connect the side-length labels to the grid, and show that the four diagrams can represent the same rectangle.\nTIMING: About 6–7 min of the Warm-up's 10.\nCLICK-BY-CLICK:\n  Click 1: Question 1 appears.\n  Click 2: Question 2 appears.\n  Click 3: Question 3 appears.\nTEACHER SAYS:\n  “What do you know about the 13 and 4 in the first ungridded rectangle?”\n  “What about the 10, 3, and 4 in the second ungridded rectangle?”\n  “How are the four diagrams related? Name as many connections as you see.”\n  If no students mentioned the area of the rectangles in their analysis, ask: “How might we find the area of the rectangles?”\nANTICIPATED RESPONSES:\n  • Q1 (IM): They are side lengths. They correspond to the number of squares across and the number of squares down in the first rectangle.\n  • Q2 (IM): The 10 and 3 are numbers that add up to 13. The 4 is the length of the shorter side.\n  • Q3 (IM): They all represent the same rectangle because they have the same side lengths and the same area. The first two show the number of square units that fit in the rectangle. The last two don’t show it but we can tell by multiplying the side lengths. The shaded portion in the second gridded rectangle shows the 4 × 10 portion in the fourth rectangle.\n  • Area question (IM): For the gridded rectangles, we can count the unit squares or multiply the number of units across and down. For the other two, we can multiply the side lengths.\nMISCONCEPTIONS TO WATCH FOR:\n  • Thinking the 10 and 3 make a different rectangle from the 13. Point back to the gridded diagram: the 10-column shaded part plus the 3 unshaded columns is still 13 across.\nDIFFERENTIATION / EXTENSION:\n  • Sentence frame for partners: “The ___ in this diagram matches the ___ in that diagram because ___.”\nFORMATIVE ASSESSMENT: Can students say that 4 × 10 and 4 × 3 together make 4 × 13? That idea carries the whole lesson.\nCALLOUTS:\n  • Rosenshine Principle 3: Ask a large number of questions.\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s005.jpg", "title": "Activity 1", "notes": "PURPOSE: Launch Activity 1. Students will make sense of base-ten diagrams for representing multiplication. The representation supports grouping tens and ones and encourages place value understanding and the distributive property (MP7).\nTIMING: About 1 min of Activity 1's 20.\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Groups of 3–4. (IM launch.)\n  Point out the two problems: 4 × 36 first, then 9 × 18. Then go to the Get Ready · Do · Done slide.\nDISCUSSION PROMPTS:\n  • What do you see in each row of the first diagram? (Keep it short; the questions come on the task slides.)\nMISCONCEPTIONS TO WATCH FOR:\n  • Counting every unit square one by one instead of using the tens.\nDIFFERENTIATION / EXTENSION:\n  • Keep base-ten blocks on each table for students who want to build a row of Tyler's diagram.\nFORMATIVE ASSESSMENT: Quick scan: are all groups seated and facing the task page before the GDD slide?\nCALLOUTS:\n  • This activity builds conceptual understanding of partial products in a concrete way. In Activity 2, students find these drawings cumbersome and move to rectangular diagrams.\n  • MP7: Look for and make use of structure.\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s006.jpg", "title": "Activity 1", "notes": "PURPOSE: Get Ready · Do · Done send-off for Activity 1 (Ward & Jacobsen, GDD pp. 74–79). Students picture the finished work first (Done), plan the steps and time (Do), then gather what they need (Get Ready).\nTIMING: 1–2 min. Step times come from IM Activity 1: 5 min independent work on the first problem, 2–3 min partner discussion, 3–4 min independent work on the second problem (12 min of work; halfway = 6 min).\nCLICK-BY-CLICK:\n  Click 1: Done mat appears (red, right).\n  Click 2: Do mat appears (green, middle).\n  Click 3: Get Ready mat appears (yellow, left).\nTEACHER SAYS:\n  Teacher says (drafted for this deck; there is no Day 4 lesson plan script): “Put on your future glasses. When you're done, your page will show where the 36 and the 4 are in Tyler's diagram, the value of 4 × 36, and how his diagram helps him find 9 × 18. Now the steps: 5 minutes on Problem 1 by yourself, 3 minutes talking with your group, then 4 minutes on Problem 2. Last, Get Ready: you need your task page and a pencil, and that's all on the table.”\n  Future-glasses prompt: “Close your eyes for a second. Picture your page when the timer goes off. What do you see written next to Problem 1c?”\n  If-then obstacle prompt: “If you start counting every little square one at a time, then stop and ask: can I count the tens first?”\n  Set the timer for the halfway point: 6 minutes. At the beep, students check: is Problem 1 finished, and have I started talking with my group?\nMISCONCEPTIONS TO WATCH FOR:\n  • Time robbers: hunting for a pencil, starting with Problem 2, recounting single squares.\nDIFFERENTIATION / EXTENSION:\n  • Students receiving learning support: give the Do steps as a printed strip they can tick off.\nFORMATIVE ASSESSMENT: At the 6-minute checkpoint, scan for groups still on Problem 1 part a.\nCALLOUTS:\n  • EF: GDD send-off (Ward & Jacobsen, GDD p. 75, Figure 1; timer at the halfway point p. 79).\n  • Grouping (3–4) and step times from IM Activity 1. Materials and space lines are inferred (IM lists none for this activity)."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s007.jpg", "title": "Activity 1", "notes": "PURPOSE: Activity 1, Problem 1: students make sense of a base-ten diagram for 4 × 36.\nTIMING: 5 min independent work, then 2–3 min group discussion (IM).\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Students work on their own first. Monitor for students who use different methods to find the value of 4 × 36 in the first problem.\nANTICIPATED RESPONSES:\n  • a. Each row has 3 tens and 6 ones. (IM)\n  • b. There are 4 rows of 3 tens and 6 ones. (IM)\n  • c. 144. Sample responses (IM): There are 12 tens and 24 ones, or 120 and 24, which make 144. / (4 × 30) + (4 × 6) = 120 + 24, which is 144. / Circling all the tens together and all the ones together.\nMISCONCEPTIONS TO WATCH FOR:\n  • Saying the 36 is the number of squares in the whole diagram.\n  • Adding 30 + 6 + 4 instead of multiplying each part by 4.\n  • Counting 24 ones as 24 tens.\nDIFFERENTIATION / EXTENSION:\n  • Support: build one row (36) with base-ten blocks, then make 4 rows.\n  • Extension: “Could Tyler have drawn this with fewer pieces? What would change?”\nFORMATIVE ASSESSMENT: Problem-solving conferring (sequence card, Day 4): Probe reasoning — can students explain why combining the parts gives the whole product, not just recite the steps? Ask: “Why does 120 + 24 give you the whole product?”\nCALLOUTS:\n  • MP7: Look for and make use of structure (place value and the distributive property).\n  • Rosenshine Principle 5: Guide student practice — circulate and question during independent work.\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s008.jpg", "title": "Activity 1", "notes": "PURPOSE: Activity 1, Problem 2: explain how a diagram grouped into tens and ones shows 9 × 18.\nTIMING: 3–4 min independent work (IM).\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Students work on their own.\nANTICIPATED RESPONSES:\n  • Sample (IM): The 9 tens make 90, and the 9 groups of 8 ones make 72, so the product is 90 + 72, which is 162.\n  • Sample (IM): (9 × 10) + (9 × 8) = 90 + 72 = 162.\nMISCONCEPTIONS TO WATCH FOR:\n  • Reading the tens box as “1 ten” instead of 9 tens.\n  • Treating 8 ones as 8 total instead of 9 groups of 8.\nDIFFERENTIATION / EXTENSION:\n  • Support: “How many rows? What is in each row?” before asking for the product.\n  • Extension: write one equation that shows both boxes at once.\nFORMATIVE ASSESSMENT: Problem-solving conferring (sequence card, Day 4): Probe reasoning — can students explain why combining the parts gives the whole product, not just recite the steps?\nCALLOUTS:\n  • MP7.\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s009.jpg", "title": "Activity 1", "notes": "PURPOSE: Activity 1 Synthesis: compare two student methods with Tyler's method.\nTIMING: About 5 min.\nCLICK-BY-CLICK:\n  Click 1: first question pair.\n  Click 2: second question pair.\nTEACHER SAYS:\n  Select 2 students who organized the diagram in the first problem in different ways and then compare their diagrams to Tyler’s method.\n  Invite selected students to share their method for finding the value of 4 × 36.\n  “How are these methods the same? How are they different?”\n  “How are these methods like Tyler’s method to find the value of 9 × 18? How are they different?”\nANTICIPATED RESPONSES:\n  • Sample (not in IM): Both students found the tens first and then the ones. One circled all 12 tens together; the other worked row by row.\n  • Sample (not in IM): Tyler already put all the tens in one box and all the ones in another box for 9 × 18, so he could multiply 9 × 10 and 9 × 8.\nMISCONCEPTIONS TO WATCH FOR:\n  • Students who think a method is only right if it matches Tyler's layout.\nFORMATIVE ASSESSMENT: Can students name the tens part and the ones part in each method?\nCALLOUTS:\n  • Rosenshine Principle 3: Ask a large number of questions.\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s010.jpg", "title": "Activity 1", "notes": "PURPOSE: Close Activity 1 by connecting the diagrams to equations. Colour code: orange = tens part, blue = ones part. These are the IM sample responses.\nTIMING: About 2 min.\nCLICK-BY-CLICK:\n  Click 1: 12 tens / 24 ones labels.\n  Click 2: equation for 4 × 36 = 144.\n  Click 3: sentence for 9 × 18.\n  Click 4: equation for 9 × 18 = 162.\nTEACHER SAYS:\n  Ask students to say where they see 120 and where they see 24 in the diagram before you click.\nANTICIPATED RESPONSES:\n  • IM: There are 12 tens and 24 ones, or 120 and 24, which make 144.\n  • IM: The 9 tens make 90, and the 9 groups of 8 ones make 72, so the product is 90 + 72, which is 162.\nMISCONCEPTIONS TO WATCH FOR:\n  • Writing 4 × 3 = 12 for the tens part and forgetting the place value (it is 4 × 30 = 120).\nFORMATIVE ASSESSMENT: Thumbs up / sideways / down: “I can explain why 120 + 24 is the whole product.”\nCALLOUTS:\n  • Rosenshine Principle 4: Provide models.\n  • Colour coding (orange tens / blue ones) continues in Activity 2 and the Lesson Synthesis.\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s011.jpg", "title": "Activity 2", "notes": "PURPOSE: Launch Activity 2. Students make sense of two representations that show the two-digit factor decomposed by place value: a base-ten diagram (Priya) and a rectangle (Han).\nTIMING: About 1 min of Activity 2's 15.\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Groups of 2.\n  “Take a few quiet minutes to work on the activity. Afterward, share your thinking with your partner.” (Say this after the GDD slide.)\nDISCUSSION PROMPTS:\n  • UDL Engagement (IM): Invite students to share examples from their own lives in which they might need to multiply two-digit and one-digit numbers. Invite them to imagine and share why Han and Priya might be multiplying 6 times 53.\nMISCONCEPTIONS TO WATCH FOR:\n  • Calling Han's diagram an “area diagram” as if it is drawn to scale. IM uses “diagrams” in student materials because the side lengths are not proportional.\nFORMATIVE ASSESSMENT: None yet.\nCALLOUTS:\n  • UDL — Engagement: Provide Access by Recruiting Interest. Optimize meaning and value. Supports accessibility for: Attention, Social-Emotional Functioning.\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s012.jpg", "title": "Activity 2", "notes": "PURPOSE: Get Ready · Do · Done send-off for Activity 2 (Ward & Jacobsen, GDD pp. 74–79).\nTIMING: 1 min. IM gives 6–7 min independent work and 3–4 min partner discussion. The split of the independent time into Problems 1–3 (4 min) and Problems 4–5 (3 min) is inferred. Work time 10 min; halfway = 5 min.\nCLICK-BY-CLICK:\n  Click 1: Done mat appears (red, right).\n  Click 2: Do mat appears (green, middle).\n  Click 3: Get Ready mat appears (yellow, left).\nTEACHER SAYS:\n  Teacher says (drafted for this deck; there is no Day 4 lesson plan script): “Future glasses on. When you're done, your page shows where 300 and 18 are in both diagrams, which diagram you prefer and why, the value of 6 × 53, and two diagrams you drew yourself. Steps: 4 minutes on Problems 1 to 3, 3 minutes on Problems 4 and 5, then 3 minutes sharing with your partner. Get Ready: task page and pencil, sitting next to your partner.”\n  Future-glasses prompt: “Picture Problem 5. What do the two diagrams you drew look like? How many parts does each one have?”\n  If-then obstacle prompt: “If drawing all of Priya's tens takes too long, then try Han's way for Problem 5.”\n  Set the timer for the halfway point: 5 minutes. At the beep: am I on Problem 4 yet?\nMISCONCEPTIONS TO WATCH FOR:\n  • Time robber: drawing every ten and one for Problem 5.\nDIFFERENTIATION / EXTENSION:\n  • Students receiving learning support: give a blank two-part rectangle template for Problem 5.\nFORMATIVE ASSESSMENT: At the 5-minute checkpoint, note who is still on Problem 1.\nCALLOUTS:\n  • EF: GDD send-off (Ward & Jacobsen, GDD p. 75, Figure 1; halfway timer p. 79).\n  • Materials and space lines are inferred (IM lists none)."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s013.jpg", "title": "Activity 2", "notes": "PURPOSE: Activity 2, Problem 1: interpret Priya's base-ten diagram.\nTIMING: Part of the 6–7 min independent work (IM).\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Students work on their own.\nANTICIPATED RESPONSES:\n  • Sample (IM): Each row has 5 tens and 3 ones, which represent 53. The six rows represent the 6.\n  • Sample (IM): The 300 is the 30 tens, which comes from 6 groups of 5 tens. The 18 is the 18 ones, which comes from 6 groups of 3.\nMISCONCEPTIONS TO WATCH FOR:\n  • Saying 300 is “30” because there are 30 rods (they need the value, 30 tens = 300).\nDIFFERENTIATION / EXTENSION:\n  • Support: base-ten blocks — build one row of 53.\nFORMATIVE ASSESSMENT: Problem-solving conferring (sequence card, Day 4): Probe reasoning — can students explain why combining the parts gives the whole product, not just recite the steps?\nCALLOUTS:\n  • MLR1 Stronger and Clearer Each Time is used in the synthesis (see slide 16 notes).\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s014.jpg", "title": "Activity 2", "notes": "PURPOSE: Activity 2, Problems 2–3: interpret Han's rectangular diagram and compare it with Priya's.\nTIMING: Part of the 6–7 min independent work (IM).\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nANTICIPATED RESPONSES:\n  • Q2 sample (IM): The 300 and 18 represent the areas of the rectangles if we had created a diagram like Priya’s but is easier to find 300 is 6 × 50 and the 18 is 6 × 3.\n  • Q3 samples (IM): Han’s way, because it is easier to see and multiply the numbers. / Priya’s way, because it’s easier to count the tens and ones.\nMISCONCEPTIONS TO WATCH FOR:\n  • Thinking Han's rectangle must be drawn to scale (the 3 part is not 1/16 of the width).\nDIFFERENTIATION / EXTENSION:\n  • Extension: “What would Han's diagram look like for 6 × 153?”\nFORMATIVE ASSESSMENT: Monitor for students who recognize that base-ten drawings are cumbersome and a less efficient way to find the product (IM).\nCALLOUTS:\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s015.jpg", "title": "Activity 2", "notes": "PURPOSE: Activity 2, Problems 4–5: find 6 × 53 and draw diagrams for 6 × 48 and 9 × 67.\nTIMING: Last part of the 6–7 min independent work, then 3–4 min partner discussion (IM).\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  As students work on the last problem, monitor for those who: recognize that base-ten drawings are cumbersome and a less efficient way to find the product; draw diagrams that show the two-digit side length partitioned by tens and ones; write expressions that show place value reasoning; use the distributive property (find the partial products, then add to find the value of the product).\nANTICIPATED RESPONSES:\n  • 4. 6 × 53 = 318 (IM).\n  • 5a. 288 — diagram 40 | 8 by 6, parts 240 and 48 (IM).\n  • 5b. 603 — diagram 60 | 7 by 9, parts 540 and 63 (IM).\nMISCONCEPTIONS TO WATCH FOR:\n  • Partitioning 48 as 24 + 24 or another split that does not help. Ask: which split gives you facts you know?\nDIFFERENTIATION / EXTENSION:\n  • Support: pre-drawn rectangle with one dashed line.\n  • Extension: 7 × 89 with two different diagrams.\nFORMATIVE ASSESSMENT: Problem-solving conferring (sequence card, Day 4): Probe reasoning — can students explain why combining the parts gives the whole product, not just recite the steps? Assessment (sequence card): IM L6 diagram-and-equation tasks.\nCALLOUTS:\n  • Rosenshine Principle 9: Require and monitor independent practice.\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s016.jpg", "title": "Activity 2", "notes": "PURPOSE: Activity 2 Synthesis: connect the two diagrams and the expression (6 × 50) + (6 × 3).\nTIMING: About 4 min.\nCLICK-BY-CLICK:\n  Click 1: similar?\n  Click 2: different?\n  Click 3: expressions and product?\n  Click 4: (6 × 50) + (6 × 3) = 300 + 18 = 318.\nTEACHER SAYS:\n  MLR1 Stronger and Clearer Each Time (IM): Before the whole-class discussion, give students time to meet with 2–3 partners to share and get feedback on their response to which method they prefer when multiplying 6 by 53. Invite listeners to ask questions, to press for details, and to suggest mathematical language. Give students 2–3 minutes to revise their written explanation based on the feedback they receive.\n  Select 2–3 students to share their responses and reasoning.\n  “How are Han’s and Priya’s diagrams similar?”\n  “How are they different?”\n  “What expressions can you write to show how to multiply 6 × 53? What is the product?”\nANTICIPATED RESPONSES:\n  • Similar (IM): They both show the 53 as 50 and 3. They multiply the parts and add them to find the total value.\n  • Different (IM): Han just drew a rectangle, and Priya drew all the tens and ones.\n  • Expression (IM): (6 × 50) + (6 × 3). The product is 318.\nMISCONCEPTIONS TO WATCH FOR:\n  • Writing 6 × 5 + 6 × 3 (dropping the zero) — ask what the 5 in 53 is worth.\nFORMATIVE ASSESSMENT: Listen during MLR1 for students who use “tens” and “ones” language when explaining their preference.\nCALLOUTS:\n  • MLR1 Stronger and Clearer Each Time — Advances: Writing, Speaking, Listening.\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s017.jpg", "title": "Activity 2", "notes": "PURPOSE: Name the term “partial products” (IM Activity 2 Synthesis).\nTIMING: 1–2 min.\nCLICK-BY-CLICK:\n  Click 1: 6 × 50 = 300 (orange part).\n  Click 2: 6 × 3 = 18 (blue part).\n  Click 3: 300 + 18 = 318.\nTEACHER SAYS:\n  Explain that the 300 and 18 in both Han’s and Priya’s diagrams are called partial products. Each is found by multiplying a part of one of the factors by the other factor.\nDIFFERENTIATION / EXTENSION:\n  • Add “partial products” to the class word display with a sketch of Han's diagram (IM uses MLR2 Collect and Display in the next lesson).\nFORMATIVE ASSESSMENT: Ask a few students to point to a partial product in their own Problem 5 diagram.\nCALLOUTS:\n  • IM lesson goal: Comprehend (in spoken language) the meaning of the term “partial products.”\n  • Rosenshine Principle 4: Provide models.\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s018.jpg", "title": "Activity 2", "notes": "PURPOSE: Check Problem 5 and press on why decomposing by place value helps.\nTIMING: About 2 min.\nCLICK-BY-CLICK:\n  Click 1: partial products for 6 × 48.\n  Click 2: 240 + 48 = 288.\n  Click 3: partial products for 9 × 67.\n  Click 4: 540 + 63 = 603.\n  Click 5: the why question.\nTEACHER SAYS:\n  For the last problem, if students do not partition their rectangular diagrams by place value, display the sample diagrams as shown in the student responses without products. Ask:\n  “What expressions can we write to represent each part of the diagram?”\n  “How does decomposing the two-digit number into tens and ones help to find the product?”\nANTICIPATED RESPONSES:\n  • Expressions (IM): 6 × 40 and 6 × 8 or 9 × 60 and 9 × 7.\n  • Why (IM): Finding multiples of ten and facts like 6 × 8 is easier than finding a product of say, 36 and 8. Then we can add the smaller products together to find the total product.\nMISCONCEPTIONS TO WATCH FOR:\n  • Adding 240 + 48 as 728 (lining up digits from the left).\nFORMATIVE ASSESSMENT: Problem-solving conferring (sequence card, Day 4): Probe reasoning — can students explain why combining the parts gives the whole product, not just recite the steps?\nCALLOUTS:\n  • Rosenshine Principle 6: Check for student understanding.\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s019.jpg", "title": "Lesson Wrap Up", "notes": "PURPOSE: Lesson Synthesis: pull the lesson together on 8 × 79 with a blank rectangle that the class labels and partitions.\nTIMING: 10 min (IM estimate).\nCLICK-BY-CLICK:\n  Start: 8 × 79 and a blank rectangle.\n  Click 1: Question 1.\n  Click 2: label 8, partition 79 into 70 and 9.\n  Click 3: Question 2.\n  Click 4: partial products 560 and 72.\n  Click 5: Question 3.\n  Click 6: 560 + 72 = 632.\nTEACHER SAYS:\n  “Today we used different diagrams and expressions to represent multiplication.”\n  Display 8 × 79 and a blank rectangle.\n  “How could we use this rectangle to represent 8 × 79?”\n  Label the rectangle and partition the rectangles to show 79 decomposed into 70 and 9.\n  “How does this diagram help us find the value of 8 × 79?”\n  “What is the value of the product?”\nANTICIPATED RESPONSES:\n  • Q1 (IM): Place 8 on one of the sides of the rectangle and partition the rectangle to show 79 across the other side.\n  • Q2 (IM): 8 × 79 is hard to do mentally, but I know that it is like finding the area of a rectangle with side lengths 8 and 79. I can decompose the rectangle into smaller rectangles and add the areas of the smaller rectangles to find the area of the large rectangle. Also, I can do 8 × 70 and 8 × 9 in my head, which makes the multiplication easier.\n  • Q3 (IM): 632, because 8 × 70 is 560 and 8 × 9 is 72, and 560 + 72 = 632.\nMISCONCEPTIONS TO WATCH FOR:\n  • Writing 8 × 7 = 56 for the tens part.\nDIFFERENTIATION / EXTENSION:\n  • Return to the HOW question on the title slide: how did being open-minded about splitting 79 apart help?\nFORMATIVE ASSESSMENT: Cold call 2–3 students for Question 2 explanations; listen for “partial products.”\nCALLOUTS:\n  • Rosenshine Principle 6: Check for student understanding.\n  • Split-screen HOW (Thinkers · Open-Minded): splitting 79 into 70 and 9.\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}, {"img": "_hub/slides/Math_U2_L04_Multiply_Two_Digit_Numbers_and_One_Digit_Numbers/s020.jpg", "title": "Cool Down", "notes": "PURPOSE: Cool-down: independent check of the learning target.\nTIMING: 5 min, independent.\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Students work on their own on the Cool-down page.\nANTICIPATED RESPONSES:\n  • Sample (IM): diagram with 80 | 3 across and 6 down; 6 × 80 = 480, 6 × 3 = 18, 480 + 18 = 498.\nMISCONCEPTIONS TO WATCH FOR:\n  • Responding to Student Thinking (IM): Students use a diagram, but find a value other than 498 as the product.\nDIFFERENTIATION / EXTENSION:\n  • Next Day Supports (IM): Launch Warm-up or activities by highlighting important representations from previous lessons.\n  • Prior-unit support: students who struggle with 6 × 8 or 6 × 80 may need a quick review of Unit 1 multiplication facts and ×10 patterns before Day 5.\nFORMATIVE ASSESSMENT: Sort cool-downs: correct with diagram / correct partial products but adding error / place-value error (e.g., 6 × 8 = 48 used for the tens). Use the piles to group for Day 5.\nCALLOUTS:\n  • Assessment (sequence card): IM L6 diagram-and-equation tasks.\n  • Source: IM Grade 4 Unit 6 Lesson 6 teacher guide (Day 4 Teacher.pdf). No separate lesson plan exists for Day 4, so the IM guide is the content authority."}]}, "Math U2 L05_Multiply Three- and Four-digit Numbers by One-digit Numbers​.pptx": {"name": "Math U2 L05_Multiply Three- and Four-digit Numbers by One-digit Numbers​.pptx", "slug": "Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers", "pptx": null, "pdf": null, "sprite": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/sprite.jpg", "tw": 192, "th": 108, "landscape": true, "slides": [{"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s001.jpg", "title": "Multiply Three- and Four-Digit Numbers by One-Digit Numbers", "notes": "PURPOSE: Open the lesson and set the split-screen intention (verbatim from the Day 5 sequence card).\nTIMING: 1 min. Lesson total 60 min: Warm-up 10, Activity 1 15, Activity 2 20, Lesson Synthesis 10, Cool-down 5 (IM timeline). Note Activity 1 is the shorter activity today.\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Read both questions aloud. Connect to Day 4: yesterday we split a two-digit number into tens and ones. Today the numbers get bigger.\nCALLOUTS:\n  • Standard: 4.NBT.B.5 (Addressing).\n  • Instructional routine: Estimation Exploration (Warm-up).\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s002.jpg", "title": "Learning Target", "notes": "PURPOSE: State the learning target (verbatim from the Day 5 sequence card) and the IM student-facing goal.\nTIMING: 1 min.\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Read the target together.\nFORMATIVE ASSESSMENT: Thumb check on confidence; revisit at the Cool-down.\nCALLOUTS:\n  • IM lesson goals: interpret diagrams that represent partial products as a strategy for multiplying three- and four-digit numbers by place; represent products of three- or four-digit and one-digit numbers with a diagram and calculate the value.\n  • Students should have multiple opportunities to hear the term “partial products” today (IM narrative).\n  • No success criteria are given in the source, so there is no Success Criteria slide."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s003.jpg", "title": "Warm Up", "notes": "PURPOSE: Warm-up (Estimation Exploration): practise estimating a reasonable answer from experience and known information. Listen for the different ways students use their understanding of place value to estimate the area and explain why an estimate is too low or too high.\nTIMING: 10 min total: 1 min quiet think time, 1 min partner discussion, record responses, then synthesis (next slide).\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Groups of 2. Display the image.\n  “What is an estimate that’s too high? Too low? About right?”\n  1 minute: quiet think time.\n  “Discuss your thinking with your partner.”\n  1 minute: partner discussion. Record responses.\nANTICIPATED RESPONSES:\n  • Too low (IM): 1,800–2,000.\n  • About right (IM): 2,200–2,400.\n  • Too high (IM): 2,500 or higher.\nMISCONCEPTIONS TO WATCH FOR:\n  • Estimating 6 × 3 hundreds = 18 and forgetting the place value.\nDIFFERENTIATION / EXTENSION:\n  • Support: “Round 395 to a friendlier number first. What is 6 × 400?”\nFORMATIVE ASSESSMENT: Record class estimates in the three boxes; note who reasons from 6 × 400.\nCALLOUTS:\n  • Instructional routine: Estimation Exploration.\n  • Rosenshine Principle 1: Begin with a short review (×100 facts).\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s004.jpg", "title": "Warm Up", "notes": "PURPOSE: Warm-up Activity Synthesis.\nTIMING: About 5 min.\nCLICK-BY-CLICK:\n  Click 1: Question 1.\n  Click 2: Question 2.\n  Click 3: 6 × 400 = 2,400.\n  Click 4: 6 × 5 = 30.\n  Click 5: 2,400 − 30 = 2,370.\nTEACHER SAYS:\n  “Is your estimate greater or less than the actual product?”\n  “How could we find the actual product?”\nANTICIPATED RESPONSES:\n  • Q1 (IM): greater (for students who estimated from 6 × 400).\n  • Q2 (IM): 6 × 400 − 6 × 5, or subtract 6 × 5 from 2,400.\n  • The value 2,370 is computed here from the IM strategy (sample).\nMISCONCEPTIONS TO WATCH FOR:\n  • Subtracting 5 instead of 6 × 5 (getting 2,395).\nFORMATIVE ASSESSMENT: Ask: “Why do we take away 30 and not 5?”\nCALLOUTS:\n  • Rosenshine Principle 3: Ask a large number of questions.\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s005.jpg", "title": "Activity 1", "notes": "PURPOSE: Launch Activity 1. Students use rectangular diagrams to represent multiplication of three-digit and one-digit numbers. The activity is designed to encourage them to decompose by place value — into hundreds, tens, and ones.\nTIMING: About 1 min of Activity 1's 15.\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Groups of 2.\n  “Work with your partner on the first problem. Then try the rest of the activity independently.”\nMISCONCEPTIONS TO WATCH FOR:\n  • Students who decompose 135 as 100 + 35 or other splits. Accept, but ask which split makes the multiplying easiest.\nDIFFERENTIATION / EXTENSION:\n  • MLR2 Collect and Display (IM): Direct attention to words collected and displayed from the previous activity. Invite students to borrow language from the display as needed, and update it throughout the lesson. The bottom line on the slide is the IM launch direction.\nCALLOUTS:\n  • MLR2 Collect and Display — Advances: Conversing, Reading.\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s006.jpg", "title": "Activity 1", "notes": "PURPOSE: Get Ready · Do · Done send-off for Activity 1 (Ward & Jacobsen, GDD pp. 74–79).\nTIMING: 1 min. Step times from IM: 2 min group work on the first problem, 5–7 min independent work on the rest (7 used here), 3 min partner discussion. Work time 12 min; halfway = 6 min.\nCLICK-BY-CLICK:\n  Click 1: Done mat (red, right).\n  Click 2: Do mat (green, middle).\n  Click 3: Get Ready mat (yellow, left).\nTEACHER SAYS:\n  Teacher says (drafted for this deck; the Day 5 lesson plan has no GDD script): “Future glasses on. When you're done, your page shows the expression and value for Clare's diagram, your own diagram for 6 × 252 with its value, and Lin's diagram finished with an expression for every part. Steps: 2 minutes on Problem 1 with your partner, 7 minutes on Problems 2 and 3 on your own, then 3 minutes comparing. Get Ready: task page, pencil, next to your partner.”\n  Future-glasses prompt: “Picture Lin's diagram when it's finished. How many parts does it have? What is written above each one?”\n  If-then obstacle prompt: “If you lose track of which part you have multiplied, then put a tick on each part as you finish it.”\n  Set the timer for the halfway point: 6 minutes. At the beep: is Problem 2 finished?\nMISCONCEPTIONS TO WATCH FOR:\n  • Time robber: redrawing the diagram neatly many times.\nFORMATIVE ASSESSMENT: At 6 minutes, note who is still on Problem 1.\nCALLOUTS:\n  • EF: GDD send-off (Ward & Jacobsen, GDD p. 75, Figure 1; halfway timer p. 79).\n  • Materials and space lines are inferred (the lesson plan lists none)."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s007.jpg", "title": "Activity 1", "notes": "PURPOSE: Activity 1, Problem 1 (partner work).\nTIMING: 2 min group work time on the first problem (IM).\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  “Work with your partner on the first problem. Then try the rest of the activity independently.”\nANTICIPATED RESPONSES:\n  • a. 3 × 135 (IM).\n  • b. (3 × 100) + (3 × 30) + (3 × 5) = 300 + 90 + 15 = 405 (IM).\nMISCONCEPTIONS TO WATCH FOR:\n  • Writing 3 × 100 + 30 + 5 (multiplying only the first part).\nFORMATIVE ASSESSMENT: Problem-solving conferring (sequence card, Day 5): Are students tracking every place-value part, or losing one when the diagram gets bigger?\nCALLOUTS:\n  • Rosenshine Principle 5: Guide student practice.\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s008.jpg", "title": "Activity 1", "notes": "PURPOSE: Activity 1, Problem 2 (independent).\nTIMING: Part of 5–7 min independent work (IM).\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nTEACHER SAYS:\n  Monitor for students who: write expressions that show the multi-digit factor decomposed by place value; draw diagrams that partition the multi-digit factor by place value.\nANTICIPATED RESPONSES:\n  • a. Diagram 200 | 50 | 2 across, 6 down (IM).\n  • b. 6 × 200 = 1,200; 6 × 50 = 300; 6 × 2 = 12; 1,200 + 300 + 12 = 1,512 (IM).\nMISCONCEPTIONS TO WATCH FOR:\n  • 6 × 50 = 30 (dropping the zero).\n  • Adding 1,200 + 300 + 12 as 1,332 (misaligned places).\nDIFFERENTIATION / EXTENSION:\n  • Support: give a three-part rectangle with blank labels.\n  • Extension: draw a second diagram for 6 × 252 that splits 252 a different way; which is easier?\nFORMATIVE ASSESSMENT: Problem-solving conferring (sequence card, Day 5): Are students tracking every place-value part, or losing one when the diagram gets bigger?\nCALLOUTS:\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s009.jpg", "title": "Activity 1", "notes": "PURPOSE: Activity 1, Problem 3 (independent): complete a partly labelled four-part diagram.\nTIMING: Last part of the 5–7 min independent work, then 3 min partner discussion (IM).\nCLICK-BY-CLICK: No animation on this slide. Everything shows at once.\nANTICIPATED RESPONSES:\n  • a. Labels 2,000 | 100 | 30 | 5; parts 6,000 | 300 | 90 | 15 (IM).\n  • b. (3 × 2,000) + (3 × 100) + (3 × 30) + (3 × 5) (IM).\n  • c. 6,000 + 300 + 90 + 15 = 6,405 (IM).\nMISCONCEPTIONS TO WATCH FOR:\n  • Missing the 2,000 part because it has no label in Lin's diagram.\n  • Labelling the third part 90 on top (90 is the partial product; the side label is 30).\nFORMATIVE ASSESSMENT: Problem-solving conferring (sequence card, Day 5): Are students tracking every place-value part, or losing one when the diagram gets bigger? Assessment (sequence card): IM L7 diagram-and-equation tasks.\nCALLOUTS:\n  • Rosenshine Principle 9: Require and monitor independent practice.\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s010.jpg", "title": "Activity 1", "notes": "PURPOSE: Activity 1 Synthesis: students share diagrams for 6 × 252; the teacher records expressions.\nTIMING: About 3 min.\nCLICK-BY-CLICK:\n  Click 1: Question 1.\n  Click 2: Question 2.\n  Click 3: partial products appear in the diagram.\n  Click 4: expressions.\n  Click 5: sum = 1,512.\nTEACHER SAYS:\n  Invite several students to share diagrams they drew to represent 6 × 252.\n  As each student shares, consider asking the class:\n  “Where do you see the parts of the factor that were decomposed?”\n  “What expressions are represented in the diagram?”\n  Record expressions as students share.\nANTICIPATED RESPONSES:\n  • Sample (IM): 6 × 200 = 1,200; 6 × 50 = 300; 6 × 2 = 12; 1,200 + 300 + 12 = 1,512.\nFORMATIVE ASSESSMENT: Use the term “partial products” when naming 1,200, 300 and 12.\nCALLOUTS:\n  • Rosenshine Principle 4: Provide models.\n  • Source: Day 5 lesson plan (Day 5 Teacher.pdf = IM Grade 4 Unit 6 Lesson 7) and Day 5 Student.pdf."}, {"img": "_hub/slides/Math_U2_L05_Multiply_Three_and_Four_digit_Numbers_by_One_digit_Numbers/s011.jpg", "title": "Activity 1", "notes": "PURPOSE: Quick check of Problems 1 and 3 be
